  @media (prefers-color-scheme: dark){

      --hair:rgba(255,255,255,.08);
      --chipbd:rgba(255,255,255,.18);
      --gtile:#2C2822;
      --teal:#3FB8B2; --teal-press:#57C8C2; --patina:#5FB0C1; --butter:#EAC36A; --eggplant:#B9A3D6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
      --b-rec-bg:rgba(185,163,214,.16); --b-rec-fg:#C9B6E4; --b-rec-bd:rgba(185,163,214,.36);
      --b-inc-bg:rgba(95,176,193,.16); --b-inc-fg:#8FCEDB; --b-inc-bd:rgba(95,176,193,.4);

@media (min-width:1100px){ .admin-wrap{max-width:1040px} }

     떨어져 가운데가 텅 빕니다. 이제 오른쪽 끝은 한 덩어리로 움직입니다. */
  .atabs{display:flex;flex-wrap:wrap;align-items:flex-start;justify-content:space-between;gap:8px;margin-bottom:12px}
  /* 탭이 12개라 좁은 화면에서 네다섯 줄로 접혔습니다(375px 에서 탭바만 168px,
   화면 세로의 20%). 접는 대신 한 줄로 두고 옆으로 밀리게 합니다 — 지금 어느
   탭에 있는지 보이면서 나머지는 밀어서 찾는 편이, 화면을 통째로 먹는 것보다
   낫습니다. 데스크톱에서는 어차피 다 들어가서 스크롤이 생기지 않습니다. */
.atablist{display:flex;gap:6px;flex:1 1 auto;min-width:0;

  scroll-snap-type:x proximity;padding-bottom:2px}

/* ── 손가락으로 쓰는 화면에서만 넓힙니다 ──────────────────────────────────
   마우스는 1px 도 정확히 찍지만 손가락은 그렇지 않습니다. 그렇다고 데스크톱
   까지 버튼을 키우면 표가 쓸데없이 길어져서, 포인터가 거친 기기에만 적용합니다.
   측정값: 탭 37px, 표 안 mini 30px, 로그인 입력칸 42px — 모두 44px 미만이었습니다. */
@media (pointer:coarse){
  .atab{min-height:44px;padding:0 15px;display:inline-flex;align-items:center}

  /* iOS 사파리는 글씨가 16px 미만인 입력칸을 누르면 화면을 확대합니다.
     한 번 확대되면 스스로 돌아오지 않아서 관리 작업 내내 옆으로 밀립니다. */

  .atbl th,.atbl td{padding:10px 10px}
}
  .mini.del{color:var(--warn-hi-fg)}
  .atag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(120,120,128,.16);color:var(--ink2);margin-left:4px}
  .atag.used{background:var(--b-inc-bg);color:var(--b-inc-fg)}
  .atag.new{background:rgba(14,124,123,.16);color:var(--teal)}

  .atag.sub{background:rgba(234,195,106,.22);color:#9A6A12;border:1px solid rgba(197,146,32,.4)}
  /* 표 — 회원 목록과 관리자 명단.

  /* 도넛 그래프 + 범례. 넓으면 나란히, 좁으면 그래프 아래로 범례가 갑니다. */

  .aimg{max-width:120px;border-radius:10px;margin-top:6px}
  .tokgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .tokchk{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px}
  .tokchk input{accent-color:var(--teal)}
  .codegen{display:flex;gap:8px;margin-bottom:12px;align-items:stretch;flex-wrap:wrap}

  .codegen .ain{margin-bottom:0}
  .mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
  .statrow{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .statcard{flex:1 1 110px;min-width:104px;background:var(--card2);border-radius:12px;padding:14px 10px;text-align:center}
  .statn{font-size:24px;font-weight:800;color:var(--teal)}
  .statl{font-size:11px;color:var(--ink2);margin-top:2px}
  .statx{font-size:10.5px;color:var(--ink2);margin-top:4px;opacity:.85;line-height:1.4}
  .proempty{text-align:center;color:var(--ink2);font-size:13.5px;padding:26px 12px;line-height:1.7}
  .acctbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border-radius:12px;padding:12px 13px;font-size:13.5px}
  /* 보안 탭 — 일별 막대. 라이브러리를 쓰지 않고 div 높이로만 그립니다.

  .asvc.on{background:#075a48;border-color:#075a48;color:#fff}
  /* 사람/봇/AI 비율 막대 — .abar 는 이미 버튼 줄로 쓰이고 있어 다른 이름입니다 */
  .aratio{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eee9dc;margin:4px 0 6px}

<div id="adminRoot" class="admin-root"></div>
<script>
const SB = (typeof SUPABASE_URL!=='undefined' && SUPABASE_URL && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function download(name,txt){ const b=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function genCode(){ const s='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let o='';
  for(let i=0;i<10;i++){ o+=s[Math.floor(Math.random()*s.length)]; if(i===4)o+='-'; } return o; }
async function loadOverrides(){ /* 관리자에서는 앱 화면 갱신이 필요 없습니다 */ }

/* 앱에 내장된 기본 목록을 DB 로 옮깁니다.
   기존 게코 페이지에서는 이 두 함수가 호출만 되고 정의가 없어
   [현재 앱 목록 가져오기] 버튼이 ReferenceError 로 죽어 있었습니다. */
async function seedMorphs(){
  if(!SB) throw new Error('백엔드가 설정되지 않았습니다.');
  const rows=[];
  GENES.forEach((g,i)=>{
    const r={ id:g.id, kind:g.type, family:g.family||'albino',
              ko:g.ko, en:g.en, zh:g.zh, ja:g.ja,
              risk:!!g.risk, sort:i+1, active:true, updated_at:new Date().toISOString() };
    if(g.type==='incdom'){ r.super_ko=g.superKo; r.super_en=g.superEn; r.super_zh=g.superZh; r.super_ja=g.superJa; }
    rows.push(r);
  });
  POLY.forEach((p,i)=>rows.push({ id:p.id, kind:'poly', family:'poly',
    ko:p.ko, en:p.en, zh:p.zh, ja:p.ja, risk:false,
    sort:GENES.length+i+1, active:true, updated_at:new Date().toISOString() }));
  const r=await SB.from('morphs').upsert(rows);
  if(r.error) throw r.error;
  return rows.length;
}
/* 콤보는 id 가 uuid 라 upsert 기준이 없습니다. 예전에는 그냥 insert 라서 두 번
   누르면 목록이 통째로 두 배가 됐습니다. 구성(tokens)이 같으면 같은 콤보로 보고
   빠진 것만 넣습니다. 그래서 새 콤보가 하나 늘었을 때 버튼을 눌러도 그 하나만
   추가되고, 손으로 고쳐둔 이름은 그대로 남습니다. */
async function seedCombos(){
  if(!SB) throw new Error('백엔드가 설정되지 않았습니다.');
  const ex=await SB.from('combos').select('id,tokens,sort');
  if(ex.error) throw ex.error;
  const have=new Set((ex.data||[]).map(r=>[...(r.tokens||[])].sort().join('|')));
  let sort=Math.max(0,...(ex.data||[]).map(r=>r.sort||0));
  const rows=COMBOS
    .filter(c=>!have.has([...(c.tokens||[])].sort().join('|')))
    .map(c=>({ tokens:c.tokens||[], ko:c.ko, en:c.en,
      vintage:!!c.vintage, risk:!!c.risk, sort:++sort, updated_at:new Date().toISOString() }));
  if(!rows.length) return 0;
  const r=await SB.from('combos').insert(rows);
  if(r.error) throw r.error;
  return rows.length;
}

  /* ── 저장 용량 ─────────────────────────────────────────────────────────

     적용 전이면 조용히 건너뜁니다 — 없다고 '한눈에' 화면 전체가 멈추면 안 됩니다. */
  async function storageUsage(){

  function gb(bytes){
    const n=Number(bytes)||0;
    if(n>=1073741824) return (n/1073741824).toFixed(2)+'GB';
    if(n>=1048576)    return (n/1048576).toFixed(1)+'MB';
    if(n>=1024)       return Math.round(n/1024)+'KB';
    return n+'B';
  }
  function storageSection(u){
    if(!u) return '';
    const bar=(used,quota)=>{
      const pctv=quota? Math.min(100, used/quota*100) : 0;
      /* 8할을 넘기면 색을 바꿉니다. 숫자만으로는 '아직 괜찮은지' 가 안 읽힙니다. */
      const cls=pctv>=80? ' danger' : pctv>=60? ' warn' : '';
      return '<div class="quotameter'+cls+'"><i style="width:'+pctv.toFixed(1)+'%"></i></div>'
        +'<div class="statx">'+gb(used)+' / '+gb(quota)+' · '+pctv.toFixed(1)+'%</div>';
    };
    const s=u.storage||{}, d=u.database||{};
    let h='<div class="alabel2">💾 저장 용량 (Supabase 무료 요금제)</div>'
      +'<div class="statrow">'
      +'<div class="statcard"><div class="statn">'+gb(s.bytes)+'</div>'
      +'<div class="statl">사진 ('+(Number(s.files)||0).toLocaleString()+'개)</div>'
      +bar(s.bytes,s.quota)+'</div>'
      +'<div class="statcard"><div class="statn">'+gb(d.bytes)+'</div>'
      +'<div class="statl">데이터베이스</div>'
      +bar(d.bytes,d.quota)+'</div>'
      +'</div>';
    const top=(u.top||[]).filter(t=>Number(t.bytes)>0);
    if(top.length){
      h+='<div class="ahint">사진을 가장 많이 쓰는 회원. 한 사람 때문에 용량이 튀는지 여기서 보입니다.</div>'
        +'<div class="atblwrap"><table class="atbl"><thead><tr><th>회원</th><th>파일</th><th>용량</th></tr></thead><tbody>'
        +top.map(t=>'<tr><td>'+esc(String(t.owner||'-').slice(0,8))+'…</td>'
          +'<td>'+(Number(t.files)||0).toLocaleString()+'</td><td>'+gb(t.bytes)+'</td></tr>').join('')
        +'</tbody></table></div>';
    }
    return h;
  }

    /* 선택한 계산기 것만 보여줍니다. 예전에는 계산기 구분이 없는 뷰를 써서
       크레 탭에서도 레게 조합이 같이 나왔습니다.
       service 가 비어 있는 옛 기록은 전부 레오파드입니다. */
    const tc=rows(cq)

      .sort((a,b)=>b.cnt-a.cnt).slice(0,5);
    h+='<div class="alabel2">자주 확인한 조합 TOP 5'
      +(adSvc? ' <span class="asub">'+esc(svcName(adSvc))+'</span>':'')+'</div><div class="alist">'

    if(P.length && !mktCount) todos.push('마케팅 수신 동의자가 없습니다. 가입 화면의 선택 동의 문구를 점검해 보세요.');

      +todos.map(t=>'<div class="arow"><div class="arow-main">'+esc(t)+'</div></div>').join('')+'</div>';

  const RANGES=[
    ['24h','24시간',  1,      'hour'],
    ['7d', '7일',     7,      'day'],
    ['30d','30일',    30,     'day'],
    ['3m', '3개월',   91,     'week'],
    ['6m', '6개월',   182,    'week'],
  ];
  let adRange='7d';

  function bucketKey(d, unit){
    const p=n=>String(n).padStart(2,'0');
    if(unit==='hour') return p(d.getHours())+'시';
    if(unit==='week'){ const t=new Date(d); t.setDate(t.getDate()-t.getDay()); // 일요일 시작
      return (t.getMonth()+1)+'/'+t.getDate(); }
    return (d.getMonth()+1)+'/'+p(d.getDate());
  }
  function bucketList(days, unit){
    const out=[], now=new Date();
    if(unit==='hour'){ for(let i=23;i>=0;i--){ const d=new Date(now-i*3600e3); out.push(bucketKey(d,unit)); } return out; }
    if(unit==='week'){ const step=7, n=Math.ceil(days/step);
      for(let i=n-1;i>=0;i--) out.push(bucketKey(new Date(now-i*step*864e5), unit));
      return [...new Set(out)]; }
    for(let i=days-1;i>=0;i--) out.push(bucketKey(new Date(now-i*864e5), unit));
    return out;
  }

  /* ---------- 비밀번호 재설정 요청 (최고관리자 전용) ----------
     원래 비밀번호는 단방향 해시로만 저장되어 아무도 볼 수 없습니다.
     알려주는 게 아니라 임시 비밀번호로 덮어쓰고, 그걸 회원에게 전달합니다.
     메일 발송은 자동화하지 않았습니다 — 운영자가 직접 보냅니다. */
  let prFilter='open';

  /* 읽어주기 쉬운 임시 비밀번호를 만듭니다.
     0/O, 1/l/I 처럼 눈으로 헷갈리는 글자는 뺐습니다 — 메일로 받아 손으로
     옮겨 적는 값이라, 헷갈리면 그대로 문의가 됩니다. */
  function tempPw(){
    const A='ABCDEFGHJKMNPQRSTUVWXYZ', a='abcdefghijkmnpqrstuvwxyz',
          d='23456789', sp='!@#$%^&*';
    const pick=s=>s[Math.floor(Math.random()*s.length)];
    let out=[pick(A),pick(sp),pick(d)];
    for(let i=0;i<7;i++) out.push(pick(A+a+d));
    // 자리 섞기
    for(let i=out.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [out[i],out[j]]=[out[j],out[i]]; }
    return out.join('');
  }

  /* ---------- 유입 경로 (최고관리자 전용) ---------- */

  /* 도넛 그래프. 라이브러리를 쓰지 않고 SVG 원 하나로 그립니다.
     외부 스크립트를 붙이면 배포한 페이지가 그 CDN 이 죽는 날 같이 죽습니다.

     원 둘레를 100 으로 잡아 두면(r = 100/2π) 비율을 그대로 dasharray 에
     넣을 수 있어 계산이 사라집니다. */
  const DONUT_COLORS=['#075a48','#3B8DA0','#b47b1e','#6B5686','#0E7C7B','#A4553B','#8a8375'];
  function donut(items, centerLabel){
    const tot=items.reduce((s,x)=>s+x.n,0);
    if(!tot) return '<div class="asub" style="padding:14px">아직 데이터가 없어요.</div>';
    const R=100/(2*Math.PI);
    let off=0;
    const arcs=items.map((x,i)=>{
      const pct=x.n*100/tot;
      const c=x.color||DONUT_COLORS[i%DONUT_COLORS.length];
      const s='<circle class="dseg" r="'+R.toFixed(4)+'" cx="0" cy="0" fill="none" stroke="'+c+'"'
        +' stroke-width="13" stroke-dasharray="'+pct.toFixed(3)+' '+(100-pct).toFixed(3)+'"'
        +' stroke-dashoffset="'+(-off).toFixed(3)+'"><title>'+esc(x.label)+' '+x.n+'회 ('+pct.toFixed(1)+'%)</title></circle>';
      off+=pct; return s;
    }).join('');
    const legend=items.map((x,i)=>{
      const c=x.color||DONUT_COLORS[i%DONUT_COLORS.length];
      return '<div class="dlg"><i style="background:'+c+'"></i>'
        +'<span class="dlgn">'+esc(x.label)+'</span>'
        +'<b>'+(x.n*100/tot).toFixed(1)+'%</b>'
        +'<span class="asub">'+x.n+'회</span></div>';
    }).join('');
    return '<div class="dwrap"><svg class="dsvg" viewBox="-25 -25 50 50" role="img" aria-label="'+esc(centerLabel||'비율')+'">'
      +'<g transform="rotate(-90)">'+arcs+'</g>'
      +'<text class="dctr" x="0" y="1">'+tot+'</text>'
      +'<text class="dctr2" x="0" y="7">'+esc(centerLabel||'건')+'</text></svg>'
      +'<div class="dlgs">'+legend+'</div></div>';
  }

  const REF_KIND=[['search','검색','#075a48'],['sns','SNS·커뮤니티','#3B8DA0'],
                  ['site','다른 사이트','#b47b1e'],['direct','직접 방문','#6B5686'],
                  ['unknown','알 수 없음','#8a8375']];
  /* 국기 이모지는 국가코드 두 글자를 지역표시기호로 옮기면 나옵니다.
     이미지가 필요 없고 어느 기기에서나 같은 값이 나옵니다. */
  function flag(cc){
    if(!cc||cc.length!==2||cc==='??') return '🏳';
    try{ return String.fromCodePoint(...[...cc.toUpperCase()].map(c=>0x1F1E6+c.charCodeAt(0)-65)); }
    catch(e){ return '🏳'; }
  }
  const CC_NAME={KR:'대한민국',US:'미국',JP:'일본',CN:'중국',TW:'대만',HK:'홍콩',
    GB:'영국',DE:'독일',FR:'프랑스',CA:'캐나다',AU:'호주',SG:'싱가포르',
    TH:'태국',VN:'베트남',ID:'인도네시아',MY:'말레이시아',PH:'필리핀',
    IN:'인도',RU:'러시아',BR:'브라질',NL:'네덜란드',IT:'이탈리아',ES:'스페인',
    PL:'폴란드',SE:'스웨덴',MX:'멕시코','??':'알 수 없음'};

  async function tabSource(){
    const body=document.getElementById('adBody'); body.innerHTML='불러오는 중…';
    try{
      const R=RANGES.filter(r=>r[0]===adRange)[0]||RANGES[1];
      const since=new Date(Date.now()-R[2]*864e5).toISOString();

      const [src,cty]=await Promise.all([
        svcFilter(SB.from('visit_sources').select('ref_kind,ref_name,ref_host,device,service')).gte('ts',since).limit(50000),
        svcFilter(SB.from('visit_countries').select('country,device,service')).gte('ts',since).limit(50000)
      ]);
      if(src.error) throw src.error;

      const rows=src.data||[], crows=(cty.data||[]);

      /* 종류별 */
      const byKind={};
      rows.forEach(r=>{ const k=r.ref_kind||'unknown'; byKind[k]=(byKind[k]||0)+1; });
      const kindItems=REF_KIND.filter(k=>byKind[k[0]])
        .map(k=>({label:k[1], n:byKind[k[0]], color:k[2]}))
        .sort((a,b)=>b.n-a.n);

      /* 유입처별 — 어디를 타고 왔는지 */
      const byName={};
      rows.filter(r=>r.ref_kind!=='direct').forEach(r=>{
        const nm=r.ref_name||r.ref_host||'알 수 없음';
        (byName[nm]=byName[nm]||{n:0,host:r.ref_host,kind:r.ref_kind,dev:new Set()});
        byName[nm].n++; byName[nm].dev.add(r.device);
      });
      const nameList=Object.keys(byName).map(k=>({name:k,...byName[k]}))
        .sort((a,b)=>b.n-a.n).slice(0,15);

      /* 국가별 */
      const byC={};
      crows.forEach(r=>{ const c=r.country||'??'; byC[c]=(byC[c]||0)+1; });
      const cList=Object.keys(byC).map(c=>({cc:c,n:byC[c]})).sort((a,b)=>b.n-a.n);
      const cItems=cList.slice(0,7).map(x=>({label:flag(x.cc)+' '+(CC_NAME[x.cc]||x.cc), n:x.n}));
      const rest=cList.slice(7).reduce((s,x)=>s+x.n,0);
      if(rest) cItems.push({label:'기타', n:rest, color:'#8a8375'});

      let h=svcBar();
      h+='<div class="asvcbar">'+RANGES.map(r=>
          '<button class="asvc'+(adRange===r[0]?' on':'')+'" data-rg="'+r[0]+'">'+r[1]+'</button>').join('')+'</div>';

      h+='<div class="ahint">사이트 안에서 계산기끼리 오간 이동과 수집기 접속은 빼고 셉니다. '
        +'<b>직접 방문은 실제보다 많게 잡힙니다</b> — 카카오톡·인스타 앱 안에서 열면 브라우저가 '
        +'어디서 왔는지를 알려주지 않아 전부 직접 방문으로 떨어집니다.</div>';

      h+='<div class="alabel2">📊 어떻게 들어왔나</div>'+donut(kindItems,'유입');

      h+='<div class="alabel2">🔗 어디를 타고 왔나 <span class="asub">상위 '+nameList.length+'곳</span></div>';
      h+= nameList.length
        ? '<div class="atblwrap"><table class="atbl"><thead><tr><th>유입처</th><th>종류</th>'
          +'<th>방문</th><th>기기</th><th>주소</th></tr></thead><tbody>'
          +nameList.map(x=>'<tr><td><b>'+esc(x.name)+'</b></td>'
            +'<td>'+esc((REF_KIND.filter(k=>k[0]===x.kind)[0]||['','기타'])[1])+'</td>'
            +'<td class="acen">'+x.n+'</td><td class="acen">'+x.dev.size+'</td>'
            +'<td class="asub">'+esc(x.host||'-')+'</td></tr>').join('')
          +'</tbody></table></div>'
        : '<div class="asub" style="padding:14px">아직 없어요. 검색이나 링크를 타고 들어온 방문이 생기면 여기에 쌓입니다.</div>';

      h+='<div class="alabel2">🌏 어느 나라에서</div>'+donut(cItems,'접속');

      body.innerHTML=h;
      bindSvcBar(tabSource);
      body.querySelectorAll('[data-rg]').forEach(b=>b.onclick=()=>{ adRange=b.dataset.rg; tabSource(); });
    }catch(e){
      body.innerHTML='<div class="aerr"><b>유입 통계를 불러오지 못했습니다.</b><br><br>'
        +'<code>supabase_v11.sql</code> 을 적용했는지 확인하세요. '
        +'적용 전에는 <code>visit_sources</code> 뷰가 없습니다.<br>'
        +'<span class="asub">'+esc((e&&e.message)||'')+'</span></div>';
    }
  }

  async function tabCode(){
    const body=document.getElementById('adBody'); body.innerHTML='불러오는 중…';
    const c=await SB.from('access_codes').select('*').order('created_at',{ascending:false}); const rows=c.data||[];
    const fmt=d=>d? new Date(d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'}) : '무기한';
    const cnt=k=>rows.filter(r=>r.kind===k).length;
    let html='<div class="statrow"><div class="statcard"><div class="statn">'+rows.length+'</div><div class="statl">전체 코드</div></div>'
      +'<div class="statcard"><div class="statn">'+cnt('trial')+'</div><div class="statl">체험판</div></div>'
      +'<div class="statcard"><div class="statn">'+cnt('sub')+'</div><div class="statl">구독</div></div>'
      +'<div class="statcard"><div class="statn">'+rows.filter(r=>r.redeemed_by).length+'</div><div class="statl">사용됨</div></div></div>'
      +'<div class="alabel2">코드 발급</div>'
      +'<div class="codegen"><select class="ain" id="cgKind" style="flex:0 0 116px"><option value="trial">체험판</option><option value="sub">구독</option></select>'
      +'<select class="ain" id="cgDays" style="flex:0 0 110px"><option value="7">7일</option><option value="14">14일</option><option value="30">30일</option><option value="90">90일</option><option value="365">1년</option><option value="">무기한</option></select>'
      +'<input class="ain" id="cgNote" placeholder="발급 대상 메모 (예: 홍길동/인스타)">'
      +'<input class="ain" id="cgQty" type="number" min="1" max="50" value="1" style="flex:0 0 74px">'
      +'<button class="abtn" id="cgBtn">발급</button></div>'
      +'<div class="ahint">기간은 <b>코드를 사용한 시점부터</b> 계산됩니다. 삭제하거나 차단하면 그 코드를 쓴 사용자의 권한도 사라집니다.</div>';
    html+='<div class="alist">'+rows.map(r=>{
      const used=!!r.redeemed_by, exp=r.expires_at && new Date(r.expires_at)<new Date();
      const st = r.revoked? '<span class="atag rev">차단</span>' : exp? '<span class="atag rev">만료</span>' : used? '<span class="atag used">사용중</span>' : '<span class="atag new">미사용</span>';
      const kind = r.kind==='sub'? '<span class="atag sub">구독</span>' : '<span class="atag">체험 '+(r.days||'-')+'일</span>';
      return '<div class="arow"><div class="arow-main"><b class="mono">'+esc(r.code)+'</b>'+kind+st
        +'<div class="asub">'+esc(r.note||'-')+(used? ' · 사용자 '+esc(String(r.redeemed_by).slice(0,10))+' · 만료 '+fmt(r.expires_at) : '')+'</div></div>'
        +'<div class="arow-act"><button class="mini" data-cp="'+esc(r.code)+'">복사</button>'
        +'<button class="mini" data-rv="'+esc(r.code)+'">'+(r.revoked?'해제':'차단')+'</button>'
        +'<button class="mini del" data-d="'+esc(r.code)+'">삭제</button></div></div>'; }).join('')+'</div>';
    body.innerHTML=html;
    document.getElementById('cgBtn').onclick=async()=>{
      const kind=document.getElementById('cgKind').value;
      const daysV=document.getElementById('cgDays').value;
      const note=document.getElementById('cgNote').value.trim();
      const qty=Math.max(1,Math.min(50,parseInt(document.getElementById('cgQty').value||'1',10)));
      const batch=[]; for(let i=0;i<qty;i++) batch.push({code:genCode(), note, kind, days: daysV===''? null : parseInt(daysV,10)});
      const res=await SB.from('access_codes').insert(batch);
      if(res.error){alert(res.error.message);return;}
      if(qty>1) alert(qty+'개 발급됨:\n'+batch.map(x=>x.code).join('\n'));
      tabCode();
    };
    body.querySelectorAll('[data-cp]').forEach(b2=>b2.onclick=()=>{ navigator.clipboard&&navigator.clipboard.writeText(b2.dataset.cp); b2.textContent='복사됨'; setTimeout(()=>b2.textContent='복사',1200); });
    body.querySelectorAll('[data-rv]').forEach(b2=>b2.onclick=async()=>{ const r=rows.find(x=>x.code===b2.dataset.rv); await SB.from('access_codes').update({revoked:!r.revoked}).eq('code',r.code); tabCode(); });
    body.querySelectorAll('[data-d]').forEach(b2=>b2.onclick=async()=>{ if(!confirm('이 코드를 삭제하면 사용한 사용자의 권한도 박탈됩니다. 진행할까요?'))return; await SB.from('access_codes').delete().eq('code',b2.dataset.d); tabCode(); });
  }

  let memQ='', memFilter='all';
  async function tabMember(){
    if(window.AdminMembers){
      await window.AdminMembers.render({SB,body:document.getElementById('adBody'),adminUser,esc,download});
      return;
    }
    const body=document.getElementById('adBody'); body.innerHTML='불러오는 중…';
    const r=await SB.from('profiles').select('*').order('created_at',{ascending:false});
    if(r.error){ body.innerHTML='<div class="aerr"><b>회원 정보를 볼 권한이 없습니다.</b><br><br>'
      +'현재 로그인: '+esc((adminUser&&adminUser.email)||'-')+'<br>'
      +'Supabase SQL Editor에서 <b>supabase_setup.sql</b> 전체를 실행하고, <code>admins</code> 테이블에 이 이메일이 등록되어 있는지 확인하세요.</div>'; return; }
    const all=r.data||[];
    const n=k=>all.filter(x=>x[k]).length;
    const fmt=d=>d? new Date(d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'}) : '-';

    // 가입 수단은 auth.identities 에 있어 표에서 못 읽습니다. 함수로 받아옵니다.
    // supabase_v9.sql 을 아직 안 넣었으면 비어 있는 채로 나머지를 그립니다.
    const prov={};
    try{
      const pv=await SB.rpc('admin_member_providers');
      (pv.data||[]).forEach(x=>{ prov[x.user_id]=x.providers||[]; });
    }catch(e){}

    const FILTERS=[['all','전체',x=>true],
                   ['mail','메일 수신',x=>x.agree_mkt_email],
                   ['sms','문자 수신',x=>x.agree_mkt_sms],
                   ['third','제3자 제공',x=>x.agree_third],
                   ['phone','연락처 보유',x=>!!x.phone]];
    const f=(FILTERS.filter(z=>z[0]===memFilter)[0]||FILTERS[0])[2];
    const q=memQ.trim().toLowerCase();
    const rows=all.filter(f).filter(x=>!q || ((x.email||'')+(x.name||'')+(x.nickname||'')+(x.phone||'')).toLowerCase().includes(q));

    let html='<div class="statrow"><div class="statcard"><div class="statn">'+all.length+'</div><div class="statl">전체 회원</div></div>'
      +'<div class="statcard"><div class="statn">'+n('agree_mkt_email')+'</div><div class="statl">이메일 수신</div></div>'
      +'<div class="statcard"><div class="statn">'+n('agree_mkt_sms')+'</div><div class="statl">문자 수신</div></div>'
      +'<div class="statcard"><div class="statn">'+n('agree_third')+'</div><div class="statl">제3자 제공</div></div></div>'
      +'<div class="abar">'+FILTERS.map(z=>'<button class="abtn sm '+(memFilter===z[0]?'':'ghost')+'" data-f="'+z[0]+'">'+z[1]+'</button>').join('')+'</div>'
      +'<div class="abar"><input class="ain" id="memQ" placeholder="이메일·이름·닉네임·번호 검색" value="'+esc(memQ)+'"></div>'
      +'<div class="abar"><button class="abtn sm ghost" id="expMkt">마케팅 동의자 CSV</button>'
      +'<button class="abtn sm ghost" id="expSms">문자 발송용 CSV</button>'
      +'<button class="abtn sm ghost" id="expAll">전체 회원 CSV</button></div>'
      +'<div class="ahint">광고성 정보 전송 시 제목에 <b>(광고)</b> 표기와 <b>무료 수신거부 방법</b>을 반드시 포함해야 합니다(정보통신망법). '
      +'수신 동의는 <b>2년마다 재확인</b> 의무가 있고, 제3자 제공은 실제 제공 시점에 제공받는 자·항목을 다시 고지해야 합니다.</div>'
      +'<div class="alabel2">회원 목록 <span class="asub">'+rows.length+'명 표시</span></div>';

    // 수집 항목을 한 줄에 한 명씩, 칸을 맞춰 봅니다.
    // 좁은 화면에서는 표만 옆으로 넘겨 봅니다 (.atblwrap 이 가로 스크롤)
    const yn=v=>v? '<span class="atag used">○</span>' : '<span class="asub">–</span>';
    // 한 사람이 여러 수단을 가질 수 있습니다 (이메일 가입 후 구글 연동 등)
    const PLABEL={email:'자사',google:'구글',kakao:'카카오',apple:'애플'};
    const pv=id=>{ const a=prov[id];
      if(!a||!a.length) return '<span class="asub">-</span>';
      return a.map(p=>'<span class="aprov '+esc(p)+'">'+esc(PLABEL[p]||p)+'</span>').join(''); };

    html+= rows.length
      ? '<div class="atblwrap"><table class="atbl"><thead><tr>'
        +'<th>이메일</th><th>가입</th><th>이름</th><th>닉네임</th><th>연락처</th><th>가입일</th>'
        +'<th>메일</th><th>문자</th><th>제3자</th><th>최종동의</th></tr></thead><tbody>'
        +rows.map(x=>'<tr>'
          +'<td><b>'+esc(x.email||'-')+'</b></td>'
          +'<td class="anowrap">'+pv(x.user_id)+'</td>'
          +'<td>'+esc(x.name||'-')+'</td>'
          +'<td>'+(x.nickname? '@'+esc(x.nickname) : '-')+'</td>'
          +'<td class="anowrap">'+esc(x.phone||'-')+'</td>'
          +'<td class="anowrap">'+fmt(x.created_at)+'</td>'
          +'<td class="acen">'+yn(x.agree_mkt_email)+'</td>'
          +'<td class="acen">'+yn(x.agree_mkt_sms)+'</td>'
          +'<td class="acen">'+yn(x.agree_third)+'</td>'
          +'<td class="anowrap">'+fmt(x.mkt_at||x.consent_at)+'</td>'
          +'</tr>').join('')
        +'</tbody></table></div>'
      : '<div class="asub" style="padding:14px">조건에 맞는 회원이 없습니다.</div>';
    body.innerHTML=html;

    body.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ memFilter=b.dataset.f; tabMember(); });
    const qi=document.getElementById('memQ');
    qi.oninput=()=>{ memQ=qi.value; };
    qi.onkeydown=e=>{ if(e.key==='Enter') tabMember(); };

    const csv=(list,name)=>{
      if(!list.length){ alert('내보낼 회원이 없습니다.'); return; }
      const head=['email','providers','name','nickname','phone','mkt_email','mkt_sms','third_party','consent_at','mkt_at','created_at'];
      const esc2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const lines=[head.join(',')].concat(list.map(x=>[x.email,(prov[x.user_id]||[]).join('|'),
        x.name,x.nickname,x.phone,
        x.agree_mkt_email,x.agree_mkt_sms,x.agree_third,x.consent_at,x.mkt_at,x.created_at].map(esc2).join(',')));
      download(name, '\ufeff'+lines.join('\n'));
    };
    document.getElementById('expMkt').onclick=()=>csv(all.filter(x=>x.agree_mkt_email||x.agree_mkt_sms),'marketing-optin.csv');
    document.getElementById('expSms').onclick=()=>csv(all.filter(x=>x.agree_mkt_sms&&x.phone),'sms-optin.csv');
    document.getElementById('expAll').onclick=()=>csv(all,'members.csv');
  }

  // 이 페이지는 관리자 전용이므로 곧바로 렌더합니다 (해시 라우팅 불필요)
  renderAdmin();
  if(SB) SB.auth.onAuthStateChange(()=>renderAdmin());
</script>
</body>
</html>
