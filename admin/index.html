<style>
  :root{
    --bg:#EDEAE1;            /* Cloud Dancer 톤 그룹 배경 */
    --card:#FDFCF9;          /* 카드/리스트 화이트 */
    --card2:#F4F1E9;         /* 부모 컨테이너 */

    --hair:rgba(38,34,29,.08);
    --chipbd:rgba(38,34,29,.16);
    --gtile:#E7E2D6;
    --teal:#0E7C7B;          /* Transformative Teal (주 인터랙션) */
    --teal-press:#0A6160;
    --patina:#3B8DA0;        /* Patina Blue (부모 B) */
    --butter:#EAC36A;        /* Butter Yellow (하이라이트) */
    --eggplant:#6B5686;      /* Eggplant (열성 배지·het) */
    --shadow:0 1px 2px rgba(38,34,29,.05), 0 6px 18px rgba(38,34,29,.05);
    --b-rec-bg:rgba(107,86,134,.13); --b-rec-fg:#6B5686; --b-rec-bd:rgba(107,86,134,.34);
    --b-inc-bg:rgba(59,141,160,.15); --b-inc-fg:#2C7A8C; --b-inc-bd:rgba(59,141,160,.4);
    --b-dom-bg:rgba(197,146,32,.16); --b-dom-fg:#9A6A12; --b-dom-bd:rgba(197,146,32,.42);
    --b-poly-bg:rgba(138,131,117,.14); --b-poly-fg:#736C5E; --b-poly-bd:rgba(38,34,29,.14);
    --warn-hi-bg:#FBEAE3; --warn-hi-bd:#F0C3B2; --warn-hi-fg:#B4402A;
    --warn-md-bg:#FBF2DA; --warn-md-bd:#EAD6A2; --warn-md-fg:#8A6410;
    --note-bg:#F3EEE0; --note-bd:#E4DCC7; --note-fg:#6C6452;
    --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#141310; --card:#211E1A; --card2:#1B1915; --ink:#F3EFE7; --ink2:#A49D8F;
      --hair:rgba(255,255,255,.08);
      --chipbd:rgba(255,255,255,.18);
      --gtile:#2C2822;
      --teal:#3FB8B2; --teal-press:#57C8C2; --patina:#5FB0C1; --butter:#EAC36A; --eggplant:#B9A3D6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
      --b-rec-bg:rgba(185,163,214,.16); --b-rec-fg:#C9B6E4; --b-rec-bd:rgba(185,163,214,.36);
      --b-inc-bg:rgba(95,176,193,.16); --b-inc-fg:#8FCEDB; --b-inc-bd:rgba(95,176,193,.4);
      --b-dom-bg:rgba(234,195,106,.16); --b-dom-fg:#EAC36A; --b-dom-bd:rgba(234,195,106,.4);
      --b-poly-bg:rgba(164,157,143,.16); --b-poly-fg:#BDB6A6; --b-poly-bd:rgba(255,255,255,.14);
      --warn-hi-bg:#2E1713; --warn-hi-bd:#6E2E22; --warn-hi-fg:#F3A594;
      --warn-md-bg:#2A2210; --warn-md-bd:#6B531A; --warn-md-fg:#EBC873;
      --note-bg:#201D16; --note-bd:#3A3427; --note-fg:#BDB49E;
    }
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  a{color:var(--teal)}
  .admin-root{display:none;min-height:100vh}
  .admin-wrap{max-width:720px;margin:0 auto;padding:16px}
  .admin-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
  .admin-top h1{font-size:20px;font-weight:800;margin:0}
  .admin-back{color:var(--teal);text-decoration:none;font-weight:700;font-size:13px}
  .atabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .atab{border:1px solid var(--hair);background:var(--card);color:var(--ink);border-radius:10px;padding:9px 14px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}

  .atab.logout{margin-left:auto;color:var(--warn-hi-fg)}

  .alabel{font-size:15px;font-weight:800;margin-bottom:10px}
  .alabel2{font-size:12px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
  .ahint{font-size:11px;color:var(--ink2);margin:8px 0 4px}
  .ain{width:100%;box-sizing:border-box;padding:11px 12px;border:1.5px solid var(--chipbd);border-radius:10px;background:var(--card2);color:var(--ink);font-size:14px;font-family:inherit;margin-bottom:8px}
  .abtn{background:var(--teal);color:#fff;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;flex:0 0 auto}
  .abtn.sm{padding:9px 14px;font-size:13px;margin-bottom:10px}
  .abtn.ghost{background:rgba(120,120,128,.15);color:var(--ink)}
  .aformbtns{display:flex;gap:8px;margin-top:12px}
  .aerr{color:var(--warn-hi-fg);font-size:12.5px;margin-top:8px;min-height:16px}
  .alist{display:flex;flex-direction:column;gap:7px;margin-top:4px}
  .arow{display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:11px;padding:11px 13px}
  .arow-main{flex:1;min-width:0;font-size:14px}
  .arow-main .asub{font-size:11.5px;color:var(--ink2);margin-top:2px}
  .arow-act{display:flex;gap:6px;flex:0 0 auto}
  .mini{border:1px solid var(--hair);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .mini.del{color:var(--warn-hi-fg)}
  .atag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(120,120,128,.16);color:var(--ink2);margin-left:4px}
  .atag.used{background:var(--b-inc-bg);color:var(--b-inc-fg)}
  .atag.new{background:rgba(14,124,123,.16);color:var(--teal)}
  .atag.rev{background:var(--warn-hi-bg);color:var(--warn-hi-fg)}
  .atag.sub{background:rgba(234,195,106,.22);color:#9A6A12;border:1px solid rgba(197,146,32,.4)}
  /* 표 — 회원 목록과 관리자 명단.
     좁은 화면에서 칸을 줄이면 읽을 수 없게 되므로, 표만 가로로 넘겨 봅니다.
     페이지 자체가 옆으로 밀리면 안 되니 감싼 쪽에 스크롤을 겁니다. */
  .atblwrap{overflow-x:auto;-webkit-overflow-scrolling:touch;margin-top:4px;
    background:var(--card2);border-radius:11px}
  .atbl{border-collapse:collapse;width:100%;font-size:12.5px}
  .atbl th,.atbl td{padding:9px 11px;text-align:left;white-space:nowrap;
    border-bottom:1px solid rgba(120,120,128,.14)}
  .atbl th{font-size:11px;font-weight:700;color:var(--ink2);
    background:rgba(120,120,128,.07);position:sticky;top:0}
  .atbl tbody tr:last-child td{border-bottom:0}
  .atbl td.acen{text-align:center}
  .atbl td.anowrap{white-space:nowrap;color:var(--ink2)}
  .arole{display:inline-block;font-size:10.5px;font-weight:700;padding:3px 9px;
    border-radius:20px;margin-left:8px;align-self:center}
  .arole.owner{background:rgba(14,124,123,.16);color:var(--teal)}
  .arole.staff{background:rgba(120,120,128,.16);color:var(--ink2)}
  .achk{display:flex;align-items:center;gap:8px;font-size:13.5px;margin:6px 0}
  .achk input{width:18px;height:18px;accent-color:var(--teal)}
  .aimg{max-width:120px;border-radius:10px;margin-top:6px}
  .tokgrid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
  .tokchk{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px}
  .tokchk input{accent-color:var(--teal)}
  .codegen{display:flex;gap:8px;margin-bottom:12px;align-items:stretch;flex-wrap:wrap}
  .codegen .ain{flex:1 1 180px;min-width:0}
  .codegen .ain{margin-bottom:0}
  .mono{font-family:ui-monospace,Menlo,monospace;letter-spacing:.5px}
  .statrow{display:flex;gap:8px;margin-bottom:6px;flex-wrap:wrap}
  .statcard{flex:1 1 110px;min-width:104px;background:var(--card2);border-radius:12px;padding:14px 10px;text-align:center}
  .statn{font-size:24px;font-weight:800;color:var(--teal)}
  .statl{font-size:11px;color:var(--ink2);margin-top:2px}
  .statx{font-size:10.5px;color:var(--ink2);margin-top:4px;opacity:.85;line-height:1.4}
  .proempty{text-align:center;color:var(--ink2);font-size:13.5px;padding:26px 12px;line-height:1.7}
  .acctbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--card2);border-radius:12px;padding:12px 13px;font-size:13.5px}
  .abar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px;align-items:center}
  .abar .ain{flex:1 1 160px;margin-bottom:0}
  .aempty{font-size:13px;color:var(--ink2);line-height:1.6;background:var(--card2);border-radius:11px;padding:14px}
  .arow.off{opacity:.5}
  .ordbtns{display:flex;flex-direction:column;gap:2px}
  .ordbtns button{border:none;background:rgba(120,120,128,.15);color:var(--ink);border-radius:5px;width:24px;height:17px;font-size:9px;cursor:pointer;line-height:1;padding:0}
  /* 도구 선택 (전체 / 레오파드 / 크레스티드) */
  .asvcbar{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 12px}
  .asvc{min-height:34px;padding:0 13px;border:1px solid var(--hair,#e3ded2);border-radius:999px;
        background:#fff;color:#4a4437;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .asvc.on{background:#075a48;border-color:#075a48;color:#fff}
  /* 사람/봇/AI 비율 막대 — .abar 는 이미 버튼 줄로 쓰이고 있어 다른 이름입니다 */
  .aratio{display:flex;height:10px;border-radius:999px;overflow:hidden;background:#eee9dc;margin:4px 0 6px}
  .aratio i{display:block;height:100%}
  .daybar .dn em{color:#b47b1e;font-style:normal;font-size:11px}
  .daybar{display:flex;align-items:center;gap:8px;font-size:12px;margin:3px 0}
  .daybar .dl{width:74px;color:var(--ink2);flex:0 0 auto}
  .daybar .dt{height:9px;border-radius:5px;background:var(--teal);min-width:3px}
  .daybar .dn{color:var(--ink2);font-size:11px}
  /* 스튜디오 관리자 전용 */
  .admin-root{display:block;min-height:100vh}
  .svc-head{display:flex;align-items:center;gap:9px;margin:18px 0 8px;font-size:13px;font-weight:800}
  .svc-head .dot{width:9px;height:9px;border-radius:50%;background:var(--teal);flex:0 0 auto}
  .backlink{color:var(--ink2);text-decoration:none;font-size:13px;font-weight:700}
</style>

<body>
<div id="adminRoot" class="admin-root"></div>
<script>
const SB = (typeof SUPABASE_URL!=='undefined' && SUPABASE_URL && window.supabase)
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function download(name,txt){ const b=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(b); a.download=name; a.click(); }
function genCode(){ const s='ABCDEFGHJKMNPQRSTUVWXYZ23456789'; let o='';
  for(let i=0;i<10;i++){ o+=s[Math.floor(Math.random()*s.length)]; if(i===4)o+='-'; } return o; }
async function loadOverrides(){ /* 관리자에서는 앱 화면 갱신이 필요 없습니다 */ }

/* 앱에 내장된 기본 목록을 DB 로 옮깁니다.
   기존 게코 페이지에서는 이 두 함수가 호출만 되고 정의가 없어
   [현재 앱 목록 가져오기] 버튼이 ReferenceError 로 죽어 있었습니다. */
async function seedMorphs(){
  if(!SB) throw new Error('백엔드가 설정되지 않았습니다.');
  const rows=[];
  GENES.forEach((g,i)=>{
    const r={ id:g.id, kind:g.type, family:g.family||'albino',
              ko:g.ko, en:g.en, zh:g.zh, ja:g.ja,
              risk:!!g.risk, sort:i+1, active:true, updated_at:new Date().toISOString() };
    if(g.type==='incdom'){ r.super_ko=g.superKo; r.super_en=g.superEn; r.super_zh=g.superZh; r.super_ja=g.superJa; }
    rows.push(r);
  });
  POLY.forEach((p,i)=>rows.push({ id:p.id, kind:'poly', family:'poly',
    ko:p.ko, en:p.en, zh:p.zh, ja:p.ja, risk:false,
    sort:GENES.length+i+1, active:true, updated_at:new Date().toISOString() }));
  const r=await SB.from('morphs').upsert(rows);
  if(r.error) throw r.error;
  return rows.length;
}
/* 콤보는 id 가 uuid 라 upsert 기준이 없습니다. 예전에는 그냥 insert 라서 두 번
   누르면 목록이 통째로 두 배가 됐습니다. 구성(tokens)이 같으면 같은 콤보로 보고
   빠진 것만 넣습니다. 그래서 새 콤보가 하나 늘었을 때 버튼을 눌러도 그 하나만
   추가되고, 손으로 고쳐둔 이름은 그대로 남습니다. */
async function seedCombos(){
  if(!SB) throw new Error('백엔드가 설정되지 않았습니다.');
  const ex=await SB.from('combos').select('id,tokens,sort');
  if(ex.error) throw ex.error;
  const have=new Set((ex.data||[]).map(r=>[...(r.tokens||[])].sort().join('|')));
  let sort=Math.max(0,...(ex.data||[]).map(r=>r.sort||0));
  const rows=COMBOS
    .filter(c=>!have.has([...(c.tokens||[])].sort().join('|')))
    .map(c=>({ tokens:c.tokens||[], ko:c.ko, en:c.en,
      vintage:!!c.vintage, risk:!!c.risk, sort:++sort, updated_at:new Date().toISOString() }));
  if(!rows.length) return 0;
  const r=await SB.from('combos').insert(rows);
  if(r.error) throw r.error;
  return rows.length;
}
  /* ---------- 관리자 ---------- */
  let adminUser=null, adTab='info';
  // 'owner' 최고관리자 · 'staff' 부관리자 · null 관리자 아님
  // 화면을 감추는 건 잠금이 아닙니다. 실제 차단은 DB 정책(supabase_v8.sql)이 합니다.
  let adRole=null;
  const isOwner=()=>adRole==='owner';
  async function loadRole(){
    try{ const r=await SB.rpc('my_admin_role'); adRole=r.data||null; }
    catch(e){ adRole=null; }
  }
  function shell(inner){
    return '<div class="admin-wrap"><div class="admin-top">'
      +'<h1>🛠 량 스튜디오 관리자</h1>'
      +'<a class="backlink" href="/">← 스튜디오</a></div>'+inner+'</div>'; }
  async function renderAdmin(){
    const ar=document.getElementById('adminRoot');
    if(!SB){ ar.innerHTML=shell('<div class="apad">백엔드(Supabase)가 설정되지 않았습니다.<br><br><b>gecko/gecko-core.js</b> 의 SUPABASE_URL / SUPABASE_ANON 을 확인해 주세요.</div>'); return; }
    try{ const s=await SB.auth.getSession(); adminUser=s.data.session?s.data.session.user:null; }catch(e){ adminUser=null; }
    if(!adminUser){ adRole=null; renderLogin(); return; }
    await loadRole();
    renderPanel();
  }
  function renderLogin(){
    document.getElementById('adminRoot').innerHTML=shell('<div class="apad"><div class="alabel">관리자 로그인</div><input id="adEmail" class="ain" placeholder="이메일" type="email"><input id="adPw" class="ain" placeholder="비밀번호" type="password"><button class="abtn" id="adLogin">로그인</button><div id="adErr" class="aerr"></div></div>');
    document.getElementById('adLogin').onclick=async()=>{ const e=document.getElementById('adEmail').value.trim(),p=document.getElementById('adPw').value,err=document.getElementById('adErr'); err.textContent='로그인 중…'; try{ const r=await SB.auth.signInWithPassword({email:e,password:p}); if(r.error)err.textContent='로그인 실패: '+r.error.message; else { adminUser=r.data.user; await loadRole(); renderPanel(); } }catch(x){ err.textContent='오류'; } };
  }
  /* 어느 도구를 보고 있는지. ''(전체) 또는 studio-config.js 의 서비스 키.
     통계·콤보처럼 도구별로 갈리는 화면에만 적용되고, 회원·코드처럼 스튜디오
     전체에 걸친 화면에는 적용되지 않습니다. */
  let adSvc='';
  const SVC = (typeof STUDIO_SERVICES!=='undefined') ? STUDIO_SERVICES : {gecko:'레오파드 게코'};
  const svcName = k => SVC[k] || k || '전체';
  /* 통계에 서비스 조건을 붙입니다. 전체를 볼 때는 그냥 통과시킵니다.
     예전 기록에는 service 가 비어 있는데, 그건 전부 레오파드입니다. */
  function svcFilter(q){
    if(!adSvc) return q;
    return adSvc==='gecko' ? q.or('service.eq.gecko,service.is.null') : q.eq('service',adSvc);
  }
  function svcBar(){
    const opts=[['','전체']].concat(Object.keys(SVC).map(k=>[k,SVC[k]]));
    return '<div class="asvcbar">'+opts.map(o=>
      '<button class="asvc'+(adSvc===o[0]?' on':'')+'" data-s="'+o[0]+'">'+esc(o[1])+'</button>').join('')+'</div>';
  }
  function bindSvcBar(rerender){
    document.querySelectorAll('.asvc').forEach(b=>b.onclick=()=>{ adSvc=b.dataset.s; rerender(); });
  }

  function renderPanel(){
    // 서비스가 늘면 여기에 탭을 추가하세요 (docs/STUDIO.md)
    // 세 번째 값이 true 면 최고관리자 전용입니다. 부관리자에게는 안 보입니다.
    const ALL=[['info','한눈에',true],['member','회원',true],['stat','통계',true],
               ['code','코드',false],['morph','레오 모프',false],['combo','레오 콤보',false],
               ['crmorph','크레 모프',false],['text','문구',true],['admin','관리자',true]];
    const tabs=ALL.filter(t=>!t[2]||isOwner());
    if(!tabs.some(t=>t[0]===adTab)) adTab=tabs.length?tabs[0][0]:'code';

    const badge=adRole? '<span class="arole '+adRole+'">'
      +(isOwner()?'최고관리자':'부관리자')+'</span>' : '';
    document.getElementById('adminRoot').innerHTML=shell(
      '<div class="atabs">'+tabs.map(t=>'<button class="atab'+(adTab===t[0]?' on':'')+'" data-t="'+t[0]+'">'+t[1]+'</button>').join('')
      +badge+'<button class="atab logout" id="adLogout">로그아웃</button></div><div id="adBody" class="apad"></div>');
    document.querySelectorAll('.atab[data-t]').forEach(b=>b.onclick=()=>{ adTab=b.dataset.t; renderPanel(); });
    document.getElementById('adLogout').onclick=async()=>{ await SB.auth.signOut(); adminUser=null; adRole=null; renderLogin(); };

    if(!adRole){
      document.getElementById('adBody').innerHTML='<div class="aerr"><b>관리자로 등록되지 않은 계정입니다.</b><br><br>'

      member:tabMember,crmorph:tabCrMorph,text:tabText,admin:tabAdmins}[adTab])();

  /* ---------- 관리자 명단 (최고관리자 전용) ---------- */
  async function tabAdmins(){
    const body=document.getElementById('adBody'); body.innerHTML='<div class="asub">불러오는 중…</div>';
    const r=await SB.from('admins').select('*').order('role').order('email');
    if(r.error){ body.innerHTML='<div class="aerr"><b>관리자 명단을 볼 권한이 없습니다.</b><br><br>'
      +'<code>supabase_v8.sql</code> 을 적용했는지 확인하세요.</div>'; return; }
    const rows=r.data||[];
    const me=((adminUser&&adminUser.email)||'').toLowerCase();
    const owners=rows.filter(x=>x.role==='owner').length;
    const fmt=d=>d? new Date(d).toLocaleDateString('ko-KR',{year:'2-digit',month:'2-digit',day:'2-digit'}) : '-';

    body.innerHTML='<div class="alabel">관리자 추가</div>'
      +'<div class="ahint">부관리자는 <b>코드 발급</b>과 <b>모프 추가·수정</b>만 할 수 있습니다. '
      +'회원 개인정보·동의 기록·접속 통계·안내 문구에는 접근할 수 없습니다.</div>'
      +'<div class="abar"><input class="ain" id="naEmail" placeholder="이메일" type="email">'
      +'<select class="ain" id="naRole" style="max-width:150px"><option value="staff">부관리자</option><option value="owner">최고관리자</option></select>'
      +'<button class="abtn sm" id="naAdd">추가</button></div>'
      +'<div id="naMsg" class="asub"></div>'
      +'<div class="alabel2">등록된 관리자 <span class="asub">'+rows.length+'명</span></div>'
      +'<div class="atblwrap"><table class="atbl"><thead><tr>'
      +'<th>이메일</th><th>등급</th><th>메모</th><th>등록일</th><th></th></tr></thead><tbody>'
      +rows.map(x=>{
        const mine=(x.email||'').toLowerCase()===me;
        const last=x.role==='owner'&&owners<=1;
        return '<tr><td><b>'+esc(x.email)+'</b>'+(mine?' <span class="asub">(나)</span>':'')+'</td>'
          +'<td><span class="arole '+x.role+'">'+(x.role==='owner'?'최고관리자':'부관리자')+'</span></td>'
          +'<td>'+esc(x.note||'-')+'</td><td>'+fmt(x.created_at)+'</td>'
          +'<td class="anowrap">'
          +(last? '<span class="asub">마지막 최고관리자</span>'
                : '<button class="abtn sm ghost" data-role="'+esc(x.email)+'" data-to="'+(x.role==='owner'?'staff':'owner')+'">'
                  +(x.role==='owner'?'부관리자로':'최고관리자로')+'</button>'
                  +' <button class="abtn sm ghost" data-del="'+esc(x.email)+'">삭제</button>')
          +'</td></tr>'; }).join('')
      +'</tbody></table></div>';

    const msg=document.getElementById('naMsg');
    const say=(t,bad)=>{ msg.textContent=t; msg.style.color=bad?'var(--warn-hi-fg)':'var(--ink2)'; };

    document.getElementById('naAdd').onclick=async()=>{
      const em=document.getElementById('naEmail').value.trim().toLowerCase();
      const ro=document.getElementById('naRole').value;
      if(!em||em.indexOf('@')<0){ say('이메일을 확인해 주세요.',true); return; }
      say('등록 중…');
      const w=await SB.from('admins').upsert({email:em,role:ro},{onConflict:'email'});
      if(w.error){ say('등록 실패: '+w.error.message,true); return; }
      say('등록했습니다. 해당 계정이 다시 로그인하면 적용됩니다.');
      tabAdmins();
    };
    body.querySelectorAll('[data-role]').forEach(b=>b.onclick=async()=>{
      const w=await SB.from('admins').update({role:b.dataset.to}).eq('email',b.dataset.role);
      if(w.error){ say('변경 실패: '+w.error.message,true); return; }
      tabAdmins();
    });
    body.querySelectorAll('[data-del]').forEach(b=>b.onclick=async()=>{
      if(!confirm(b.dataset.del+' 의 관리자 권한을 해제할까요?')) return;
      const w=await SB.from('admins').delete().eq('email',b.dataset.del);
      if(w.error){ say('삭제 실패: '+w.error.message,true); return; }
      tabAdmins();
    });
  }

  /* ---------- 한눈에 보기 (대시보드) ---------- */
  async function tabInfo(){

    body.innerHTML='<div class="asub">불러오는 중…</div>';
    const today=new Date().toISOString().slice(0,10);
    const d7=new Date(Date.now()-6*864e5).toISOString().slice(0,10);
    const num=r=>(r&&r.count)||0;
    const rows=r=>(r&&r.data)||[];

    const [vTot,vToday,vWeek,vDev,prof,codes,anim,pair,clu,cq]=await Promise.all([
      svcFilter(SB.from('visits').select('*',{count:'exact',head:true})),
      svcFilter(SB.from('visits').select('*',{count:'exact',head:true})).eq('day',today),
      svcFilter(SB.from('visits').select('*',{count:'exact',head:true})).gte('day',d7),
      svcFilter(SB.from('visits').select('device,day,service,client')).gte('day',d7).limit(5000),
      SB.from('profiles').select('*'),
      SB.from('access_codes').select('*'),
      SB.from('animals').select('id,device,created_at').limit(5000),
      SB.from('pairings').select('id').limit(5000),
      SB.from('clutches').select('id,egg_count').limit(5000),
      SB.from('top_combos_by_service').select('*').limit(500),
    ]);

    // 권한 확인 — profiles 는 관리자만 읽을 수 있음
    if(prof.error){
      body.innerHTML='<div class="aerr"><b>관리자 권한이 없습니다.</b><br><br>'
        +'현재 로그인: '+esc((adminUser&&adminUser.email)||'-')+'<br>'
        +'Supabase SQL Editor에서 <b>supabase_setup.sql</b> 전체를 실행하고, '
        +'<code>admins</code> 테이블에 이 이메일이 등록되어 있는지 확인하세요.</div>';
      return;
    }

    const P=rows(prof), C=rows(codes), A=rows(anim);
    const uniqWeek=new Set(rows(vDev).map(x=>x.device)).size;
    const now=Date.now();
    const activeCodes=C.filter(c=>c.redeemed_by&&!c.revoked&&(!c.expires_at||new Date(c.expires_at)>now));
    const newMembers=P.filter(x=>x.created_at&&new Date(x.created_at)>=new Date(d7)).length;
    const mktCount=P.filter(x=>x.agree_mkt_email||x.agree_mkt_sms).length;
    const withPhone=P.filter(x=>x.phone).length;
    const withName=P.filter(x=>x.name||x.nickname).length;
    const activeUsers=new Set(A.map(x=>x.device)).size;
    const eggs=rows(clu).reduce((s,x)=>s+(x.egg_count||0),0);

    const card=(n,l,sub)=>'<div class="statcard"><div class="statn">'+n+'</div><div class="statl">'+l+'</div>'
      +(sub?'<div class="statx">'+sub+'</div>':'')+'</div>';
    const pct=(a,b)=>b? Math.round(a/b*100)+'%' : '0%';

    // 최근 7일 추이
    const byDay={}; rows(vDev).forEach(x=>{ if(x.day) byDay[x.day]=(byDay[x.day]||0)+1; });
    const days=[]; for(let i=6;i>=0;i--) days.push(new Date(Date.now()-i*864e5).toISOString().slice(0,10));
    const mx=Math.max(1,...days.map(d=>byDay[d]||0));

    // 최근 7일 방문자 종류 (client 컬럼이 없으면 전부 사람으로 잡힘)
    const wk=rows(vDev), wkK={human:0,bot:0,ai:0};
    wk.forEach(x=>{ wkK[(x.client==='bot'||x.client==='ai')?x.client:'human']++; });

    let h=svcBar();
    h+='<div class="alabel2">📊 오늘'+(adSvc?' · '+esc(svcName(adSvc)):'')+'</div><div class="statrow">'
      +card(num(vToday),'오늘 접속')
      +card(num(vWeek),'최근 7일','순 방문 '+uniqWeek)
      +card(num(vTot),'누적 접속')
      +'</div>';

    h+='<div class="alabel2">🙋 최근 7일 방문자</div><div class="statrow">'
      +card(wkK.human,'사람')
      +card(wkK.bot,'검색봇')
      +card(wkK.ai,'AI 수집기')
      +'</div>';

    h+='<div class="alabel2">👥 회원</div><div class="statrow">'
      +card(P.length,'전체 회원', newMembers? '최근 7일 +'+newMembers : '최근 7일 신규 없음')
      +card(mktCount,'마케팅 수신 동의', pct(mktCount,P.length)+' 동의')
      +card(withPhone,'연락처 보유', pct(withPhone,P.length))
      +card(withName,'이름·닉네임 보유', pct(withName,P.length))
      +'</div>';

    h+='<div class="alabel2">💎 프리미엄</div><div class="statrow">'
      +card(activeCodes.length,'이용 중')
      +card(C.filter(c=>!c.redeemed_by&&!c.revoked).length,'미사용 코드')
      +card(C.length,'발급 총계')
      +'</div>';

    h+='<div class="alabel2">🦎 브리딩 데이터</div><div class="statrow">'
      +card(A.length,'등록 개체', activeUsers+'명이 사용 중')
      +card(rows(pair).length,'페어링')
      +card(rows(clu).length,'클러치', eggs? '알 '+eggs+'개':'')
      +'</div>';

    // 서비스별 접속 (docs/STUDIO.md) — service 컬럼이 아직 없으면 이 구역은 생략
    const SVC_ICON={gecko:'🦎 레오파드 게코', crested:'🦎 크레스티드 게코', pygmy:'🐿 피그미 테스트', studio:'🏠 스튜디오 허브'};
    const svcCnt={}; let hasSvc=false;
    rows(vDev).forEach(x=>{ const k=x.service||'gecko'; hasSvc=true; svcCnt[k]=(svcCnt[k]||0)+1; });
    if(hasSvc){
      h+='<div class="alabel2">서비스별 접속 <span class="asub">최근 7일</span></div><div class="statrow">'
        +Object.keys(svcCnt).sort((a,b)=>svcCnt[b]-svcCnt[a])
           .map(k=>card(svcCnt[k], SVC_ICON[k]||k)).join('')
        +'</div>';
    }

    h+='<div class="alabel2">최근 7일 접속 추이</div>'
      +days.map(d=>'<div class="daybar"><span class="dl">'+d.slice(5)+'</span>'
        +'<span class="dt" style="width:'+Math.round((byDay[d]||0)/mx*60)+'%"></span>'
        +'<span class="dn">'+(byDay[d]||0)+'</span></div>').join('');

    /* 선택한 계산기 것만 보여줍니다. 예전에는 계산기 구분이 없는 뷰를 써서
       크레 탭에서도 레게 조합이 같이 나왔습니다.
       service 가 비어 있는 옛 기록은 전부 레오파드입니다. */
    const tc=rows(cq)
      .filter(r=>!adSvc || (adSvc==='gecko' ? (!r.service||r.service==='gecko') : r.service===adSvc))
      .sort((a,b)=>b.cnt-a.cnt).slice(0,5);
    h+='<div class="alabel2">자주 확인한 조합 TOP 5'
      +(adSvc? ' <span class="asub">'+esc(svcName(adSvc))+'</span>':'')+'</div><div class="alist">'
      +(tc.length? tc.map((r,i)=>'<div class="arow"><div class="arow-main"><b>'+(i+1)+'. '+esc(r.label||r.ckey)+'</b></div><div class="atag">'+r.cnt+'회</div></div>').join('')
        : '<div class="asub">아직 데이터가 없어요.</div>')+'</div>';

    // 할 일 / 점검
    const todos=[];
    if(!P.length) todos.push('아직 가입한 회원이 없어요. 회원가입 흐름이 정상 동작하는지 확인해 보세요.');
    if(P.length && !mktCount) todos.push('마케팅 수신 동의자가 없습니다. 가입 화면의 선택 동의 문구를 점검해 보세요.');
    if(C.filter(c=>!c.redeemed_by&&!c.revoked).length===0) todos.push('배포 가능한 미사용 코드가 없습니다. [코드] 탭에서 발급하세요.');
    if(!A.length) todos.push('등록된 개체가 없습니다. 브리딩 관리 기능 홍보를 검토해 보세요.');
    if(todos.length) h+='<div class="alabel2">🔔 점검할 것</div><div class="alist">'
      +todos.map(t=>'<div class="arow"><div class="arow-main">'+esc(t)+'</div></div>').join('')+'</div>';

    body.innerHTML=h; bindSvcBar(tabInfo);
  }

  let morphQ='';
  async function tabMorph(){
    const body=document.getElementById('adBody'); body.innerHTML='불러오는 중…';
    const m=await SB.from('morphs').select('*').order('sort'); const all=m.data||[];
    const rows=morphQ? all.filter(r=>((r.ko||'')+(r.en||'')+r.id).toLowerCase().includes(morphQ.toLowerCase())) : all;
    let html='<div class="abar"><button class="abtn sm" id="mNew">+ 새 모프</button><button class="abtn sm ghost" id="mSeed">현재 앱 목록 가져오기</button><button class="abtn sm ghost" id="mExp">백업</button></div>'
      +'<div class="abar"><input class="ain" id="mQ" placeholder="이름·ID 검색" value="'+esc(morphQ)+'"></div>';
    if(!all.length){ html+='<div class="aempty"><b>아직 DB에 모프가 없습니다.</b><br>지금은 앱에 내장된 기본 목록('+(GENES.length+POLY.length)+'개)이 쓰이고 있어요.<br><br><b>현재 앱 목록 가져오기</b>를 누르면 지금 화면에 보이는 모프가 그대로 DB에 들어가고, 그때부터 여기서 추가·수정할 수 있습니다.</div>'; }
    else { html+='<div class="alist">'+rows.map(r=>'<div class="arow'+(r.active===false?' off':'')+'">'
      +'<div class="ordbtns"><button data-u="'+esc(r.id)+'">▲</button><button data-dn="'+esc(r.id)+'">▼</button></div>'
      +'<div class="arow-main"><b>'+esc(r.ko||r.id)+'</b><span class="atag">'+esc(r.kind)+'</span>'+(r.risk?'<span class="atag rev">⚠</span>':'')
      +'<div class="asub">'+esc(r.en||'')+' · '+esc(r.id)+'</div></div>'
      +'<div class="arow-act"><button class="mini" data-rk="'+esc(r.id)+'">'+(r.risk?'⚠ 해제':'⚠ 설정')+'</button>'
      +'<button class="mini" data-t="'+esc(r.id)+'">'+(r.active===false?'켜기':'끄기')+'</button>'
      +'<button class="mini" data-e="'+esc(r.id)+'">수정</button><button class="mini del" data-d="'+esc(r.id)+'">삭제</button></div></div>').join('')+'</div>'; }
    body.innerHTML=html;
    document.getElementById('mNew').onclick=()=>morphForm(null);
    document.getElementById('mExp').onclick=()=>download('morphs-backup.json',JSON.stringify(all,null,1));
    document.getElementById('mSeed').onclick=async(e)=>{ e.target.textContent='가져오는 중…'; try{ const n=await seedMorphs(); await loadOverrides(); alert(n+'개를 DB에 넣었습니다.'); }catch(x){ alert('실패: '+x.message); } tabMorph(); };
    const q=document.getElementById('mQ'); q.oninput=()=>{ morphQ=q.value; };
    q.onkeydown=(e)=>{ if(e.key==='Enter') tabMorph(); };
    body.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>morphForm(all.find(x=>x.id===b.dataset.e)));
    body.querySelectorAll('[data-t]').forEach(b=>b.onclick=async()=>{ const r=all.find(x=>x.id===b.dataset.t); await SB.from('morphs').update({active:!(r.active!==false)}).eq('id',r.id); await loadOverrides(); tabMorph(); });
    body.querySelectorAll('[data-rk]').forEach(b=>b.onclick=async()=>{ const r=all.find(x=>x.id===b.dataset.rk); await SB.from('morphs').update({risk:!r.risk}).eq('id',r.id); await loadOverrides(); tabMorph(); });
    body.querySelectorAll('[data-d]').forEach(b=>b.onclick=async()=>{ if(!confirm('삭제할까요?'))return; await SB.from('morphs').delete().eq('id',b.dataset.d); await loadOverrides(); tabMorph(); });
    const move=async(id,dir)=>{ const i=all.findIndex(x=>x.id===id), j=i+dir; if(j<0||j>=all.length)return;
      await SB.from('morphs').update({sort:all[j].sort||j+1}).eq('id',all[i].id);
      await SB.from('morphs').update({sort:all[i].sort||i+1}).eq('id',all[j].id);
      await loadOverrides(); tabMorph(); };
    body.querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>move(b.dataset.u,-1));
    body.querySelectorAll('[data-dn]').forEach(b=>b.onclick=()=>move(b.dataset.dn,1));
  }
  function morphForm(r){

      +f('color','대표색 #RRGGBB',r.color)+'<label class="achk"><input type="checkbox" id="mf_risk" '+(r.risk?'checked':'')+'> 위험(⚠) 표시</label>'
      +'<div class="alabel2">실물 이미지 (자동 리사이즈)</div><input type="file" id="mf_img" accept="image/*"><div id="mf_imgprev">'+(r.image_url?'<img src="'+esc(r.image_url)+'" class="aimg">':'')+'</div>'
      +'<div class="aformbtns"><button class="abtn" id="mSave">저장</button><button class="abtn ghost" id="mCancel">취소</button></div><div id="mErr" class="aerr"></div>';
    document.getElementById('mf_kind').value=r.kind||'rec';
    let imgUrl=r.image_url||null;
    document.getElementById('mf_img').onchange=async(e)=>{ const file=e.target.files[0]; if(!file)return;
      const pv=document.getElementById('mf_imgprev');
      pv.textContent = file.size>1048576 ? '사진을 줄이는 중… ('+(file.size/1048576).toFixed(1)+'MB)' : '업로드 중…';
      try{ const blob=await resizeImage(file,640);
        pv.textContent='업로드 중… ('+Math.round(blob.size/1024)+'KB로 축소됨)';
        const path='m/'+((document.getElementById('mf_id').value||'x')+'_'+Date.now())+'.jpg';
        const up=await SB.storage.from('morph-images').upload(path,blob,{contentType:'image/jpeg',upsert:true});
        if(up.error){
          const m=up.error.message||'';
          pv.textContent = /row-level security|Unauthorized|policy/i.test(m)
            ? '업로드 권한이 없어요. supabase_setup.sql 의 F) Storage 정책을 실행했는지 확인하세요.'
            : '업로드 실패: '+m;
          return; }
        imgUrl=SB.storage.from('morph-images').getPublicUrl(path).data.publicUrl;
        pv.innerHTML='<img src="'+esc(imgUrl)+'" class="aimg">';

  const KIND=[['human','사람','#075a48'],['bot','검색봇','#8a8375'],['ai','AI 수집기','#b47b1e']];

  /* 기간 선택 — 1시간 단위부터 6개월까지.
     visits.day 는 UTC 기준이라 한국 시간과 하루가 어긋납니다(오전 8시 접속이
     전날로 잡힘). 그래서 day 를 쓰지 않고 ts 를 브라우저 현지시간으로 묶습니다. */
  const RANGES=[
    ['24h','24시간',  1,      'hour'],
    ['7d', '7일',     7,      'day'],
    ['30d','30일',    30,     'day'],
    ['3m', '3개월',   91,     'week'],
    ['6m', '6개월',   182,    'week'],
  ];
  let adRange='7d';

  function bucketKey(d, unit){
    const p=n=>String(n).padStart(2,'0');
    if(unit==='hour') return p(d.getHours())+'시';
    if(unit==='week'){ const t=new Date(d); t.setDate(t.getDate()-t.getDay()); // 일요일 시작
      return (t.getMonth()+1)+'/'+t.getDate(); }
    return (d.getMonth()+1)+'/'+p(d.getDate());
  }
  function bucketList(days, unit){
    const out=[], now=new Date();
    if(unit==='hour'){ for(let i=23;i>=0;i--){ const d=new Date(now-i*3600e3); out.push(bucketKey(d,unit)); } return out; }
    if(unit==='week'){ const step=7, n=Math.ceil(days/step);
      for(let i=n-1;i>=0;i--) out.push(bucketKey(new Date(now-i*step*864e5), unit));
      return [...new Set(out)]; }
    for(let i=days-1;i>=0;i--) out.push(bucketKey(new Date(now-i*864e5), unit));
    return out;
  }

      +'<div class="statcard"><div class="statn">'+n('agree_mkt_sms')+'</div><div class="statl">문자 수신</div></div>'
      +'<div class="statcard"><div class="statn">'+n('agree_third')+'</div><div class="statl">제3자 제공</div></div></div>'
      +'<div class="abar">'+FILTERS.map(z=>'<button class="abtn sm '+(memFilter===z[0]?'':'ghost')+'" data-f="'+z[0]+'">'+z[1]+'</button>').join('')+'</div>'
      +'<div class="abar"><input class="ain" id="memQ" placeholder="이메일·이름·닉네임·번호 검색" value="'+esc(memQ)+'"></div>'
      +'<div class="abar"><button class="abtn sm ghost" id="expMkt">마케팅 동의자 CSV</button>'
      +'<button class="abtn sm ghost" id="expSms">문자 발송용 CSV</button>'
      +'<button class="abtn sm ghost" id="expAll">전체 회원 CSV</button></div>'
      +'<div class="ahint">광고성 정보 전송 시 제목에 <b>(광고)</b> 표기와 <b>무료 수신거부 방법</b>을 반드시 포함해야 합니다(정보통신망법). '
      +'수신 동의는 <b>2년마다 재확인</b> 의무가 있고, 제3자 제공은 실제 제공 시점에 제공받는 자·항목을 다시 고지해야 합니다.</div>'
      +'<div class="alabel2">회원 목록 <span class="asub">'+rows.length+'명 표시</span></div>';

    // 수집 항목을 한 줄에 한 명씩, 칸을 맞춰 봅니다.
    // 좁은 화면에서는 표만 옆으로 넘겨 봅니다 (.atblwrap 이 가로 스크롤)
    const yn=v=>v? '<span class="atag used">○</span>' : '<span class="asub">–</span>';
    html+= rows.length
      ? '<div class="atblwrap"><table class="atbl"><thead><tr>'
        +'<th>이메일</th><th>이름</th><th>닉네임</th><th>연락처</th><th>가입일</th>'
        +'<th>메일</th><th>문자</th><th>제3자</th><th>최종동의</th></tr></thead><tbody>'
        +rows.map(x=>'<tr>'
          +'<td><b>'+esc(x.email||'-')+'</b></td>'
          +'<td>'+esc(x.name||'-')+'</td>'
          +'<td>'+(x.nickname? '@'+esc(x.nickname) : '-')+'</td>'
          +'<td class="anowrap">'+esc(x.phone||'-')+'</td>'
          +'<td class="anowrap">'+fmt(x.created_at)+'</td>'
          +'<td class="acen">'+yn(x.agree_mkt_email)+'</td>'
          +'<td class="acen">'+yn(x.agree_mkt_sms)+'</td>'
          +'<td class="acen">'+yn(x.agree_third)+'</td>'
          +'<td class="anowrap">'+fmt(x.mkt_at||x.consent_at)+'</td>'
          +'</tr>').join('')
        +'</tbody></table></div>'
      : '<div class="asub" style="padding:14px">조건에 맞는 회원이 없습니다.</div>';
    body.innerHTML=html;

    body.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{ memFilter=b.dataset.f; tabMember(); });
    const qi=document.getElementById('memQ');
    qi.oninput=()=>{ memQ=qi.value; };
    qi.onkeydown=e=>{ if(e.key==='Enter') tabMember(); };

    const csv=(list,name)=>{
      if(!list.length){ alert('내보낼 회원이 없습니다.'); return; }
      const head=['email','name','nickname','phone','mkt_email','mkt_sms','third_party','consent_at','mkt_at','created_at'];
      const esc2=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
      const lines=[head.join(',')].concat(list.map(x=>[x.email,x.name,x.nickname,x.phone,
        x.agree_mkt_email,x.agree_mkt_sms,x.agree_third,x.consent_at,x.mkt_at,x.created_at].map(esc2).join(',')));
      download(name, '\ufeff'+lines.join('\n'));
    };
    document.getElementById('expMkt').onclick=()=>csv(all.filter(x=>x.agree_mkt_email||x.agree_mkt_sms),'marketing-optin.csv');
    document.getElementById('expSms').onclick=()=>csv(all.filter(x=>x.agree_mkt_sms&&x.phone),'sms-optin.csv');
    document.getElementById('expAll').onclick=()=>csv(all,'members.csv');
  }

  // 이 페이지는 관리자 전용이므로 곧바로 렌더합니다 (해시 라우팅 불필요)
  renderAdmin();
  if(SB) SB.auth.onAuthStateChange(()=>renderAdmin());
</script>
</body>
</html>
