<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>브리딩 관리 · 레오파드 모프 계산기</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gecko-core.js"></script>
<style>
  :root{
    --bg:#EDEAE1; --card:#FDFCF9; --card2:#F4F1E9; --ink:#26221D; --ink2:#8A8375;
    --hair:rgba(38,34,29,.08); --chipbd:rgba(38,34,29,.16); --gtile:#E7E2D6;
    --teal:#0E7C7B; --teal-press:#0A6160; --patina:#3B8DA0; --butter:#EAC36A; --eggplant:#6B5686;
    --shadow:0 1px 2px rgba(38,34,29,.05), 0 6px 18px rgba(38,34,29,.05);
    --warn-bg:#FBEAE3; --warn-bd:#F0C3B2; --warn-fg:#B4402A;
    --note-bg:#F3EEE0; --note-bd:#E4DCC7; --note-fg:#6C6452; --radius:16px;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141310; --card:#211E1A; --card2:#1B1915; --ink:#F3EFE7; --ink2:#A49D8F;
      --hair:rgba(255,255,255,.08); --chipbd:rgba(255,255,255,.18); --gtile:#2C2822;
      --teal:#3FB8B2; --patina:#5FB0C1; --eggplant:#B9A3D6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.28);
      --warn-bg:#2E1713; --warn-bd:#6E2E22; --warn-fg:#F3A594;
      --note-bg:#201D16; --note-bd:#3A3427; --note-fg:#BDB49E; }
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);line-height:1.5;padding-bottom:60px;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","Microsoft YaHei",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  header{padding:20px 16px 14px;text-align:center;position:relative}
  header h1{margin:0;font-size:21px;font-weight:800;letter-spacing:-.4px}
  header .sub{color:var(--ink2);font-size:12.5px;margin-top:4px}
  .back{position:absolute;left:14px;top:20px;color:var(--teal);text-decoration:none;font-weight:700;font-size:13.5px}
  .wrap{max-width:720px;margin:0 auto;padding:0 14px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;justify-content:center}
  .tab{border:1px solid var(--hair);background:var(--card);color:var(--ink);border-radius:11px;padding:10px 15px;font-size:13.5px;font-weight:700;cursor:pointer;font-family:inherit}
  .tab.on{background:var(--teal);border-color:var(--teal);color:#fff}
  .pad{background:var(--card);border-radius:var(--radius);padding:15px;box-shadow:var(--shadow)}
  .lbl{font-size:15.5px;font-weight:800;margin-bottom:10px}
  .lbl2{font-size:12px;font-weight:700;color:var(--ink2);margin:14px 0 6px}
  .hint{font-size:11.5px;color:var(--ink2);margin:6px 0}
  .in{width:100%;box-sizing:border-box;padding:11px 12px;border:1.5px solid var(--chipbd);border-radius:10px;background:var(--card2);color:var(--ink);font-size:14px;font-family:inherit;margin-bottom:8px}
  .btn{background:var(--teal);color:#fff;border:none;border-radius:11px;padding:12px 18px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap}
  .btn.ghost{background:rgba(120,120,128,.15);color:var(--ink)}
  .btn.sm{padding:9px 13px;font-size:13px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .formbtns{display:flex;gap:8px;margin-top:12px}
  .err{color:var(--warn-fg);font-size:12.5px;margin-top:8px;min-height:16px}
  .card{background:var(--card2);border-radius:12px;padding:12px 13px;margin-bottom:8px;display:flex;gap:11px;align-items:center}
  .thumb{width:56px;height:56px;border-radius:10px;background:var(--gtile);flex:0 0 auto;display:flex;align-items:center;justify-content:center;overflow:hidden}
  .thumb img{width:100%;height:100%;object-fit:cover}
  .info{flex:1;min-width:0}
  .nm{font-weight:700;font-size:14.5px}
  .ms{font-size:11.5px;color:var(--ink2);margin-top:2px;word-break:keep-all}
  .ht{font-size:11.5px;color:var(--eggplant);margin-top:1px}
  .acts{display:flex;gap:6px;flex:0 0 auto}
  .mini{border:1px solid var(--hair);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .mini.del{color:var(--warn-fg)}
  .sexb{display:inline-block;font-size:10px;font-weight:800;padding:1px 6px;border-radius:20px;margin-left:5px}
  .sexb.m{background:rgba(59,141,160,.18);color:var(--patina)}
  .sexb.f{background:rgba(192,132,252,.18);color:var(--eggplant)}
  .tag{display:inline-block;font-size:10.5px;font-weight:700;padding:2px 7px;border-radius:20px;background:rgba(120,120,128,.16);color:var(--ink2);margin-left:5px}
  .tag.d{background:rgba(14,124,123,.16);color:var(--teal)}
  .gd{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--butter);margin-right:2px}
  .tokgrid{display:grid;grid-template-columns:1fr 1fr;gap:3px}
  .tokchk{display:flex;align-items:center;gap:6px;font-size:12.5px;padding:5px}
  .tokchk input{accent-color:var(--teal)}
  .empty{text-align:center;color:var(--ink2);font-size:13.5px;padding:28px 12px;line-height:1.7}
  .pathbox{background:var(--card2);border-radius:12px;padding:13px;margin-bottom:9px;font-size:13px;line-height:1.6}
  .step{display:flex;gap:9px;margin:7px 0}
  .num{flex:0 0 22px;height:22px;border-radius:50%;background:var(--teal);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center}
  .num.ok{background:var(--teal)}
  .num.no{background:var(--warn-fg,#B4402A)}
  .ownb{margin-left:5px;background:var(--teal);color:#fff;font-size:9.5px;font-weight:800;padding:1px 6px;border-radius:6px;white-space:nowrap}
  .mini-t{color:var(--ink2);font-size:11px;font-weight:700}
  .gate{max-width:420px;margin:40px auto;text-align:center}
  .gate .pad{padding:24px}
  .prev img{max-width:130px;border-radius:10px;margin-top:6px}
  .combotag{display:inline-block;background:var(--teal);color:#fff;font-size:9.5px;font-weight:800;padding:2px 7px;border-radius:6px;margin-right:6px}
  .bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
</style>
</head>
<body>
<header>
  <a class="back" href="index.html">← 계산기</a>
  <h1>🦎 브리딩 관리</h1>
  <div class="sub" id="who"></div>
</header>
<div class="wrap">
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-t="animals">내 개체</button>
    <button class="tab" data-t="pair">페어링</button>
    <button class="tab" data-t="clutch">클러치</button>
    <button class="tab" data-t="goal">역산</button>
  </div>
  <div id="body"><div class="empty">불러오는 중…</div></div>
</div>

<script>
const SB = (SUPABASE_URL && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const esc = escapeHtml;
let USER=null, isPrem=false, premKind=null, premExp=null;
let TAB='animals', A=[], P=[], C=[];

function devId(){ try{ let d=localStorage.getItem('leoDevice'); if(!d){ d='dev_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('leoDevice',d);} return d; }catch(e){ return 'dev_anon'; } }
function uid(){ return USER? 'u_'+USER.id : devId(); }
const $=id=>document.getElementById(id);

async function boot(){
  if(!SB){ $('body').innerHTML='<div class="gate"><div class="pad">백엔드가 설정되지 않았습니다.<br>index.html 상단의 SUPABASE_URL / SUPABASE_ANON 을 채워주세요.</div></div>'; return; }
  try{ const s=await SB.auth.getSession(); USER=s.data.session? s.data.session.user:null; }catch(e){ USER=null; }
  try{ const r=await SB.rpc('premium_status',{p_device:uid()}); const d=r.data||{}; isPrem=!!d.active; premKind=d.kind; premExp=d.expires_at; }catch(e){ isPrem=false; }
  $('who').textContent = USER? (USER.email||'') + (isPrem? ' · '+(premKind==='sub'?'구독':'체험판'):'') : '';
  if(!isPrem){ gate(); return; }
  $('tabs').style.display='flex';
  document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ TAB=b.dataset.t;
    document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('on',x.dataset.t===TAB)); render(); });
  await loadAll(); render();
}
function gate(){
  $('body').innerHTML='<div class="gate"><div class="pad"><div style="font-size:34px">💎</div>'
    +'<div class="lbl" style="margin-top:8px">프리미엄 전용 기능이에요</div>'
    +'<div class="hint" style="font-size:13px">내 개체 등록·혈통, 페어링 플래너, 클러치(부화 예정일) 관리, 목표 모프 역산 계산기를 이용할 수 있어요.</div>'
    +(USER?'':'<div class="hint">로그인하면 기기가 바뀌어도 프리미엄이 유지됩니다.</div>')
    +'<div class="formbtns"><a class="btn" href="index.html" style="flex:1;text-decoration:none;text-align:center">계산기에서 코드 입력하기</a></div>'
    +'</div></div>';
}
async function loadAll(){
  const g=async t=>{ try{ const r=await SB.rpc('my_rows',{p_device:uid(),p_table:t}); return r.data||[]; }catch(e){ return []; } };
  A=await g('animals'); P=await g('pairings'); C=await g('clutches');
}
async function save(t,row){ const r=await SB.rpc('save_row',{p_device:uid(),p_table:t,p_row:row}); if(r.error) throw r.error; return r.data; }
async function del(t,id){ await SB.rpc('delete_row',{p_device:uid(),p_table:t,p_id:id}); }
/* resizeImage 는 gecko-core.js 의 공용 함수를 사용합니다 (큰 사진 자동 축소·회전 보정) */

function render(){ ({animals:tabAnimals,pair:tabPair,clutch:tabClutch,goal:tabGoal}[TAB])(); }

/* ---------- 내 개체 ---------- */
function card(a){
  const vis=(a.morphs||[]).map(morphNameOf).join(' ')||'노멀';
  const het=(a.hets||[]).map(morphNameOf);
  const sx=a.sex==='male'?'<span class="sexb m">♂</span>':a.sex==='female'?'<span class="sexb f">♀</span>':'';
  const gr=a.color_grade? '<div class="ms">'+'<span class="gd"></span>'.repeat(a.color_grade)+' 색 강도 '+a.color_grade+'/5</div>':'';
  const th=a.photo_url? '<img src="'+esc(a.photo_url)+'">' : geckoSVG(geckoProfile(a.morphs||[]),50);
  const par=(a.parent_a||a.parent_b)? '<div class="ms">부모: '+esc(nameById(a.parent_a))+' × '+esc(nameById(a.parent_b))+'</div>':'';
  return '<div class="card"><div class="thumb">'+th+'</div><div class="info">'
    +'<div class="nm">'+esc(a.name||'이름없음')+sx+'</div><div class="ms">'+esc(vis)+'</div>'
    +(het.length?'<div class="ht">het '+esc(het.join(', '))+'</div>':'')+gr+par
    +(a.hatch_date?'<div class="ms">해칭 '+esc(a.hatch_date)+'</div>':'')+'</div>'
    +'<div class="acts"><button class="mini" data-e="'+a.id+'">수정</button><button class="mini del" data-d="'+a.id+'">삭제</button></div></div>';
}
function nameById(id){ const x=A.filter(y=>y.id===id)[0]; return x? (x.name||'이름없음') : '-'; }
function tabAnimals(){
  $('body').innerHTML='<div class="pad"><div class="bar"><button class="btn sm" id="new">+ 개체 등록</button><span class="hint">'+A.length+'마리</span></div>'
    +(A.length? A.map(card).join('') : '<div class="empty">등록된 개체가 없어요.<br>보유 중인 게코를 등록하면 페어링·클러치 관리를 할 수 있습니다.</div>')+'</div>';
  $('new').onclick=()=>form(null);
  document.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>form(A.filter(y=>y.id===x.dataset.e)[0]));
  document.querySelectorAll('[data-d]').forEach(x=>x.onclick=async()=>{ if(!confirm('삭제할까요?'))return; await del('animals',x.dataset.d); await loadAll(); tabAnimals(); });
}
function form(a){
  a=a||{morphs:[],hets:[]};
  const rec=GENES.filter(g=>g.type==='rec');
  const sv=new Set(a.morphs||[]), sh=new Set(a.hets||[]);
  const popt=id=>'<option value="">부모 선택 안 함</option>'+A.filter(x=>x.id!==a.id).map(x=>'<option value="'+x.id+'"'+(id===x.id?' selected':'')+'>'+esc(x.name||'이름없음')+'</option>').join('');
  $('body').innerHTML='<div class="pad"><div class="lbl">'+(a.id?'개체 수정':'개체 등록')+'</div>'
    +'<input class="in" id="f_name" placeholder="이름 / 개체번호" value="'+esc(a.name||'')+'">'
    +'<div class="row2"><select class="in" id="f_sex"><option value="">성별 미상</option><option value="male">수컷 ♂</option><option value="female">암컷 ♀</option></select>'
    +'<input class="in" id="f_hatch" type="date" value="'+esc(a.hatch_date||'')+'"></div>'
    +'<div class="lbl2">비주얼 (발현 모프)</div><div class="tokgrid">'
    +tokenOptions().map(t=>'<label class="tokchk"><input type="checkbox" class="v" value="'+esc(t[0])+'"'+(sv.has(t[0])?' checked':'')+'>'+esc(t[1])+'</label>').join('')
    +POLY.map(x=>'<label class="tokchk"><input type="checkbox" class="v" value="'+esc(x.id)+'"'+(sv.has(x.id)?' checked':'')+'>'+esc(pName(x))+'</label>').join('')+'</div>'
    +'<div class="lbl2">het 보유 (열성)</div><div class="tokgrid">'
    +rec.map(g=>'<label class="tokchk"><input type="checkbox" class="h" value="'+esc(g.id)+'"'+(sh.has(g.id)?' checked':'')+'>'+esc(gName(g))+'</label>').join('')+'</div>'
    +'<div class="lbl2">혈통 (선택)</div><div class="row2"><select class="in" id="f_pa">'+popt(a.parent_a)+'</select><select class="in" id="f_pb">'+popt(a.parent_b)+'</select></div>'
    +'<div class="lbl2">라인브리딩 색 강도</div><select class="in" id="f_grade"><option value="">기록 안 함</option>'
    +[1,2,3,4,5].map(n=>'<option value="'+n+'">'+n+' / 5</option>').join('')+'</select>'
    +'<div class="lbl2">사진</div><input type="file" id="f_img" accept="image/*"><div class="prev" id="prev">'+(a.photo_url?'<img src="'+esc(a.photo_url)+'">':'')+'</div>'
    +'<input class="in" id="f_note" placeholder="메모" value="'+esc(a.note||'')+'" style="margin-top:8px">'
    +'<div class="formbtns"><button class="btn" id="save">저장</button><button class="btn ghost" id="cancel">취소</button></div><div class="err" id="err"></div></div>';
  $('f_sex').value=a.sex||''; $('f_grade').value=a.color_grade||'';
  let photo=a.photo_url||null;
  $('f_img').onchange=async e=>{ const f=e.target.files[0]; if(!f)return; const pv=$('prev');
    const mb=(f.size/1048576).toFixed(1);
    pv.textContent = f.size>1048576 ? '사진을 줄이는 중… ('+mb+'MB)' : '업로드 중…';
    try{
      const b=await resizeImage(f,900);
      pv.textContent='업로드 중… ('+Math.round(b.size/1024)+'KB로 축소됨)';
      const path='a/'+uid().replace(/[^\w-]/g,'')+'_'+Date.now()+'.jpg';
      const up=await SB.storage.from('morph-images').upload(path,b,{contentType:'image/jpeg',upsert:true});
      if(up.error){
        const m=up.error.message||'';
        pv.textContent = /row-level security|Unauthorized|policy/i.test(m)
          ? '업로드 권한이 없어요. 관리자에게 문의해 주세요. (Storage 정책 미적용)'
          : '실패: '+m;
        return; }
      photo=SB.storage.from('morph-images').getPublicUrl(path).data.publicUrl; pv.innerHTML='<img src="'+esc(photo)+'">';
    }catch(x){ pv.textContent='실패: '+(x.message||'사진을 처리하지 못했어요.'); } };
  $('cancel').onclick=()=>tabAnimals();
  $('save').onclick=async()=>{
    const row={ id:a.id||null, name:$('f_name').value.trim(), sex:$('f_sex').value||null,
      hatch_date:$('f_hatch').value||null,
      morphs:[...document.querySelectorAll('.v:checked')].map(x=>x.value),
      hets:[...document.querySelectorAll('.h:checked')].map(x=>x.value),
      parent_a:$('f_pa').value||null, parent_b:$('f_pb').value||null,
      color_grade:parseInt($('f_grade').value||'0',10)||null, photo_url:photo, note:$('f_note').value.trim() };
    try{ await save('animals',row); await loadAll(); tabAnimals(); }catch(x){ $('err').textContent=x.message||'저장 실패'; } };
}

/* ---------- 페어링 ---------- */
function tabPair(){
  if(A.length<2){ $('body').innerHTML='<div class="pad"><div class="empty">개체를 2마리 이상 등록하면<br>페어링을 저장하고 계산기로 넘길 수 있어요.</div></div>'; return; }
  const opt=a=>'<option value="'+a.id+'">'+esc(a.name||'이름없음')+' ('+((a.morphs||[]).map(morphNameOf).join(' ')||'노멀')+')</option>';
  const m=A.filter(a=>a.sex!=='female'), f=A.filter(a=>a.sex!=='male');
  $('body').innerHTML='<div class="pad"><div class="lbl">새 페어링</div>'
    +'<select class="in" id="p_m"><option value="">수컷 선택</option>'+m.map(opt).join('')+'</select>'
    +'<select class="in" id="p_f"><option value="">암컷 선택</option>'+f.map(opt).join('')+'</select>'
    +'<input class="in" id="p_name" placeholder="페어링 이름 (예: 2026 A라인)">'
    +'<div class="formbtns"><button class="btn" id="calc">계산기로 보내기</button><button class="btn ghost" id="sv">저장</button></div>'
    +'<div class="lbl2">저장된 페어링</div>'
    +(P.length? P.map(pp=>{ const mm=A.filter(x=>x.id===pp.male)[0], ff=A.filter(x=>x.id===pp.female)[0];
        return '<div class="card"><div class="info"><div class="nm">'+esc(pp.name||'이름없음')+'</div>'
          +'<div class="ms">♂ '+esc(mm?mm.name:'-')+' × ♀ '+esc(ff?ff.name:'-')+'</div></div>'
          +'<div class="acts"><button class="mini" data-pl="'+pp.id+'">계산</button><button class="mini del" data-pd="'+pp.id+'">삭제</button></div></div>'; }).join('')
      : '<div class="empty">저장된 페어링이 없어요.</div>')+'</div>';
  const go=(mid,fid)=>{ if(!mid||!fid){ alert('수컷과 암컷을 모두 선택하세요.'); return; }
    const ma=A.filter(x=>x.id===mid)[0], fa=A.filter(x=>x.id===fid)[0];
    const pack=a=>({m:a.morphs||[],h:a.hets||[],n:a.name||''});
    try{ sessionStorage.setItem('leoPair', JSON.stringify({A:pack(ma),B:pack(fa)})); }catch(e){}
    location.href='index.html#pair'; };
  $('calc').onclick=()=>go($('p_m').value,$('p_f').value);
  $('sv').onclick=async()=>{ const mid=$('p_m').value,fid=$('p_f').value;
    if(!mid||!fid){ alert('수컷과 암컷을 모두 선택하세요.'); return; }
    await save('pairings',{id:null,name:$('p_name').value.trim()||'페어링',male:mid,female:fid});
    await loadAll(); tabPair(); };
  document.querySelectorAll('[data-pl]').forEach(x=>x.onclick=()=>{ const pp=P.filter(y=>y.id===x.dataset.pl)[0]; go(pp.male,pp.female); });
  document.querySelectorAll('[data-pd]').forEach(x=>x.onclick=async()=>{ await del('pairings',x.dataset.pd); await loadAll(); tabPair(); });
}

/* ---------- 클러치 ---------- */
function hatchDays(t){ t=parseFloat(t)||28; if(t>=31)return 38; if(t>=29.5)return 45; if(t>=28)return 55; if(t>=26.5)return 68; return 80; }
function tabClutch(){
  const today=new Date().toISOString().slice(0,10);
  const popt=P.map(pp=>'<option value="'+pp.id+'">'+esc(pp.name||'페어링')+'</option>').join('');
  $('body').innerHTML='<div class="pad"><div class="lbl">클러치 등록</div>'
    +(P.length?'<select class="in" id="c_p"><option value="">페어링 선택 (선택)</option>'+popt+'</select>':'')
    +'<div class="row2"><input class="in" id="c_date" type="date" value="'+today+'"><input class="in" id="c_temp" type="number" step="0.5" value="28" placeholder="인큐 온도 ℃"></div>'
    +'<input class="in" id="c_cnt" type="number" min="1" value="2" placeholder="알 개수">'
    +'<div class="hint" id="c_pred"></div>'
    +'<div class="formbtns"><button class="btn" id="c_save">저장</button></div>'
    +'<div class="lbl2">진행 중인 클러치</div>'
    +(C.length? C.map(c=>{ const d=c.expected_hatch? Math.ceil((new Date(c.expected_hatch)-new Date())/86400000):null;
        const bg=d===null?'':d>0?'<span class="tag d">D-'+d+'</span>':'<span class="tag">부화 예정일 지남</span>';
        return '<div class="card"><div class="info"><div class="nm">'+esc(c.laid_date||'')+' 산란'+bg+'</div>'
          +'<div class="ms">알 '+(c.egg_count||'-')+'개 · '+(c.temp||'-')+'℃ · 부화예정 '+esc(c.expected_hatch||'-')+'</div></div>'
          +'<div class="acts"><button class="mini del" data-cd="'+c.id+'">삭제</button></div></div>'; }).join('')
      : '<div class="empty">등록된 클러치가 없어요.<br>산란일과 온도를 넣으면 부화 예정일을 계산해 드려요.</div>')+'</div>';
  const upd=()=>{ const days=hatchDays($('c_temp').value), d=$('c_date').value;
    const dt=d? new Date(new Date(d).getTime()+days*86400000).toISOString().slice(0,10):'-';
    $('c_pred').innerHTML='예상 부화: <b>'+dt+'</b> (약 '+days+'일) · 온도에 따라 성별 경향이 달라집니다'; return dt; };
  $('c_temp').oninput=upd; $('c_date').onchange=upd; upd();
  $('c_save').onclick=async()=>{ const dt=upd();
    await save('clutches',{id:null, pairing:($('c_p')||{}).value||null, laid_date:$('c_date').value||null,
      temp:parseFloat($('c_temp').value)||null, expected_hatch:dt==='-'?null:dt,
      egg_count:parseInt($('c_cnt').value||'0',10)||null});
    await loadAll(); tabClutch(); };
  document.querySelectorAll('[data-cd]').forEach(x=>x.onclick=async()=>{ await del('clutches',x.dataset.cd); await loadAll(); tabClutch(); });
}

/* ---------- 역산 ---------- */
/* ---------- 목표 모프 역산 (등록한 개체 기준) ---------- */
// 개체가 특정 유전자에 대해 무엇을 가졌는지: 'super' | 'visual' | 'het' | null
function carries(a, geneId){
  const m=a.morphs||[], h=a.hets||[];
  if(m.indexOf('super_'+geneId)>=0) return 'super';
  if(m.indexOf(geneId)>=0) return 'visual';
  if(h.indexOf(geneId)>=0) return 'het';
  return null;
}
// 목표 토큰 하나에 대해 그 개체가 부모로 쓸 수 있는지
function meetsReq(a, req){
  const c=carries(a, req.gene);
  if(!c) return false;
  if(req.type==='rec')    return true;                 // het 이상이면 기여 가능
  if(req.type==='super')  return true;                 // 맥스노우 이상이면 기여 가능
  return c==='visual'||c==='super';                    // 우성·불완전우성은 발현 개체 필요
}
function goalReqs(tk){
  const reqs=[];
  tk.forEach(t=>{
    if(String(t).indexOf('super_')===0){ const id=t.slice(6);
      reqs.push({gene:id, type:'super', token:t, need:'양쪽 부모 모두 보유 (25%로 슈퍼폼)'}); return; }
    const g=GENES.filter(x=>x.id===t)[0]; if(!g) return;
    if(g.type==='rec')        reqs.push({gene:g.id, type:'rec',    token:t, need:'양쪽 부모 모두 최소 het 이상'});
    else if(g.type==='incdom')reqs.push({gene:g.id, type:'incdom', token:t, need:'한쪽 부모만 발현해도 50%'});
    else                      reqs.push({gene:g.id, type:'dom',    token:t, need:'한쪽 부모만 발현해도 50%'});
  });
  return reqs;
}
function ownTag(a, req){
  const c=carries(a, req.gene);
  return c==='super'? '슈퍼폼' : c==='visual'? '비주얼' : c==='het'? 'het' : null;
}
function tabGoal(){
  const opts=tokenOptions();
  // 각 모프 옆에 내가 보유한 개체 수 뱃지
  const ownCount=tok=>{
    const gene = String(tok).indexOf('super_')===0 ? tok.slice(6) : tok;
    return A.filter(a=>carries(a,gene)).length;
  };
  $('body').innerHTML='<div class="pad"><div class="lbl">목표 모프 역산</div>'
    +'<div class="hint">만들고 싶은 모프를 고르면 <b>내가 등록한 개체</b> 기준으로 가능한지, 무엇이 부족한지 알려드려요.</div>'
    +(A.length? '<div class="hint">등록된 개체 <b>'+A.length+'마리</b> ('
        +A.filter(a=>a.sex==='male').length+'♂ / '+A.filter(a=>a.sex==='female').length+'♀'
        +(A.filter(a=>!a.sex||a.sex==='unknown').length? ' / 성별미상 '+A.filter(a=>!a.sex||a.sex==='unknown').length : '')+')</div>'
      : '<div class="empty" style="margin:8px 0">등록된 개체가 없어요.<br><b>내 개체</b> 탭에서 보유 게코를 먼저 등록하면, 목표까지 얼마나 왔는지 알려드릴 수 있어요.</div>')
    +'<div class="tokgrid">'+opts.map(t=>{
        const n=ownCount(t[0]);
        return '<label class="tokchk"><input type="checkbox" class="g" value="'+esc(t[0])+'">'
          +esc(t[1])+(n? '<span class="ownb">보유 '+n+'</span>':'')+'</label>'; }).join('')+'</div>'
    +'<div class="formbtns"><button class="btn" id="run">경로 계산</button></div><div id="out"></div></div>';
  $('run').onclick=()=>{
    const tk=[...document.querySelectorAll('.g:checked')].map(x=>x.value), out=$('out');
    if(!tk.length){ out.innerHTML='<div class="err">목표 모프를 하나 이상 고르세요.</div>'; return; }
    const cb=matchCombo(new Set(tk));
    const reqs=goalReqs(tk);
    const recLike=reqs.filter(r=>r.type==='rec'||r.type==='super');   // 확률을 떨어뜨리는 조건
    const n=recLike.length;

    let h='<div class="pathbox"><b>목표</b><br>'
      +(cb?'<span class="combotag">콤보</span>'+esc(cb[LANG]||cb.en)+'<br>':'')
      +esc(tk.map(morphNameOf).join(' '))+'</div>';

    // 1) 조건별로 "내 개체가 충족하는가"
    h+='<div class="pathbox"><b>조건별 내 개체 현황</b>';
    const missing=[];
    reqs.forEach(r=>{
      const ok=A.filter(a=>meetsReq(a,r));
      const males=ok.filter(a=>a.sex==='male'), females=ok.filter(a=>a.sex==='female');
      const both = r.type==='rec'||r.type==='super';        // 양쪽 부모 필요
      const done = both ? (males.length>0 && females.length>0) : ok.length>0;
      if(!done) missing.push(r);
      const badge = done? '<span class="num ok">✓</span>' : '<span class="num no">!</span>';
      let detail;
      if(!ok.length) detail='보유 개체 없음 — 새로 들이거나 다른 경로가 필요해요.';
      else detail = ok.map(a=>esc(a.name||'이름없음')+' <span class="mini-t">'+ownTag(a,r)
              +(a.sex==='male'?' ♂':a.sex==='female'?' ♀':'')+'</span>').join(', ')
            + (both && !done ? ' <b>— '+(males.length?'암컷':'수컷')+'이 필요해요.</b>' : '');
      h+='<div class="step">'+badge+'<span><b>'+esc(morphNameOf(r.token))+'</b> — '+esc(r.need)
        +'<div class="ms">'+detail+'</div></span></div>';
    });
    h+='</div>';

    // 2) 지금 보유 개체로 만들 수 있는 최선의 페어링
    const males=A.filter(a=>a.sex==='male'), females=A.filter(a=>a.sex==='female');
    if(males.length && females.length){
      const scored=[];
      males.forEach(m=>females.forEach(f=>{
        let met=0; const gaps=[];
        reqs.forEach(r=>{
          const both=r.type==='rec'||r.type==='super';
          const ok = both ? (meetsReq(m,r)&&meetsReq(f,r)) : (meetsReq(m,r)||meetsReq(f,r));
          if(ok) met++; else gaps.push(morphNameOf(r.token));
        });
        scored.push({m,f,met,gaps});
      }));
      scored.sort((x,y)=>y.met-x.met);
      const top=scored.slice(0,3).filter(s=>s.met>0);
      if(top.length){
        h+='<div class="pathbox"><b>내 개체로 가능한 페어링</b>';
        top.forEach((s,i)=>{
          const full=s.met===reqs.length;
          h+='<div class="step"><span class="num'+(full?' ok':'')+'">'+(i+1)+'</span><span>'
            +'<b>'+esc(s.m.name||'이름없음')+' ♂ × '+esc(s.f.name||'이름없음')+' ♀</b> — 조건 '+s.met+'/'+reqs.length+' 충족'
            +(full? ' <b>(목표 달성 가능)</b>' : '<div class="ms">부족: '+esc(s.gaps.join(', '))+'</div>')
            +'</span></div>';
        });
        h+='<div class="ms" style="margin-top:6px">페어링 탭에서 등록하면 실제 확률까지 계산됩니다.</div></div>';
      }
    } else if(A.length){
      h+='<div class="pathbox"><b>내 개체로 가능한 페어링</b><div class="ms">'
        +(males.length? '암컷이 등록되어 있지 않아 페어링을 계산할 수 없어요.'
         : females.length? '수컷이 등록되어 있지 않아 페어링을 계산할 수 없어요.'
         : '개체의 성별을 등록하면 가능한 페어링을 찾아드려요.')+'</div></div>';
    }

    // 3) 세대 경로 — 조건 충족 여부에 따라 다르게 안내
    const ready = A.length && !missing.length;
    h+='<div class="pathbox"><b>'+(ready? '지금 할 수 있는 것' : '추천 경로')+'</b>';
    if(ready){
      h+='<div class="step"><span class="num ok">✓</span><span>필요한 조건을 <b>이미 모두 보유</b>하고 있어요. 위 페어링을 <b>페어링 탭</b>에 등록하면 실제 출현 확률이 계산됩니다.</span></div>';
      if(n) h+='<div class="step"><span class="num">i</span><span>다만 부모가 모두 <b>het</b>인 형질이 있으면 한 배에서 바로 안 나올 수 있어요. '
        +'열성·슈퍼폼 조건이 '+n+'개라 최대 <b>1/'+Math.pow(4,n)+'</b>('+(100/Math.pow(4,n)).toFixed(1)+'%)까지 낮아질 수 있습니다. '
        +'부모 중 한쪽이 비주얼이면 확률이 크게 올라갑니다.</span></div>';
    }
    else if(!n){
      h+='<div class="step"><span class="num">1</span><span>우성·불완전우성 형질이라 <b>한쪽 부모에만 있으면 F1에서 바로</b> 나옵니다. 해당 개체를 들이면 됩니다.</span></div>';
    }
    else{
      h+='<div class="step"><span class="num">1</span><span><b>F1</b> — 서로 다른 형질의 비주얼끼리 교배해 <b>더블 het</b>를 만듭니다. 이 세대에선 목표가 안 나옵니다.</span></div>';
      h+='<div class="step"><span class="num">2</span><span><b>F2</b> — het끼리 교배 시 목표 출현. 확률 약 <b>1/'+Math.pow(4,n)+'</b> ('+(100/Math.pow(4,n)).toFixed(1)+'%)</span></div>';
      if(n>=2) h+='<div class="step"><span class="num">↺</span><span>확률이 낮으면 F1에서 <b>비주얼 하나 + het</b>를 먼저 만들고 역교배하면 확률이 크게 올라갑니다.</span></div>';
      if(missing.length) h+='<div class="step"><span class="num no">!</span><span>먼저 <b>'
        +esc(missing.map(r=>morphNameOf(r.token)).join(', '))+'</b> 조건을 채울 개체가 필요해요.</span></div>';
    }
    h+='</div>';
    out.innerHTML=h;
  };
}

/* DB에 모프/콤보가 있으면 그것으로 갱신 후 시작 */
(async function(){
  if(SB){ try{
    const m=await SB.from('morphs').select('*').eq('active',true).order('sort');
    if(m.data&&m.data.length){ const g=[],p=[];
      m.data.forEach(r=>{ if(r.color)GCOLOR[r.id]=r.color;
        if(r.kind==='poly') p.push({id:r.id,ko:r.ko,en:r.en,zh:r.zh,ja:r.ja});
        else{ const o={id:r.id,type:r.kind,family:r.family||'albino',ko:r.ko,en:r.en,zh:r.zh,ja:r.ja,risk:!!r.risk};
          if(r.super_ko){o.superKo=r.super_ko;o.superEn=r.super_en;o.superZh=r.super_zh;o.superJa=r.super_ja;} g.push(o); } });
      if(g.length){ GENES.length=0; g.forEach(x=>GENES.push(x)); }
      if(p.length){ POLY.length=0; p.forEach(x=>POLY.push(x)); } }
    const c=await SB.from('combos').select('*').order('sort');
    if(c.data&&c.data.length){ COMBOS.length=0; c.data.forEach(r=>COMBOS.push({tokens:r.tokens||[],ko:r.ko,en:r.en,vintage:!!r.vintage,risk:!!r.risk})); }
  }catch(e){} }
  boot();
})();
