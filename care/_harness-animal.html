<script>
(function () {
  const C = window.CareCore, T = C.today();
  const ID = 'a1';
  /* 족보용 가계도 — 외조부를 조부와 같게 두어 근친 표시를 확인합니다 */
  const kin = [
    { id:'ff', name:'조부', species:'leopard', sex:'male' },
    { id:'fm', name:'조모', species:'leopard', sex:'female' },
    { id:'mm', name:'외조모', species:'leopard', sex:'female' },
    { id:'f',  name:'아비', species:'leopard', sex:'male',   parent_a:'ff', parent_b:'fm' },
    { id:'m',  name:'어미', species:'leopard', sex:'female', parent_a:'ff', parent_b:'mm' },
    { id:'x',  name:'짝',   species:'leopard', sex:'female' },
    { id:'k1', name:'새끼1', species:'leopard', parent_a:ID, parent_b:'x' },
    { id:'k2', name:'새끼2', species:'leopard', parent_a:'x', parent_b:ID }
  ];
  const demoPhoto = color => 'data:image/svg+xml;charset=UTF-8,' + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" width="900" height="600"><rect width="100%" height="100%" fill="' + color
    + '"/><circle cx="450" cy="300" r="180" fill="#fff" opacity=".55"/></svg>');
  let animal = { id: ID, parent_a:'f', parent_b:'m', name: '노랑이', species: 'leopard', sex: 'female', life_stage: 'adult', hatch_date: '2024-05-02',
                 photo_url: demoPhoto('#dca64c'), photos: [demoPhoto('#70967d'), demoPhoto('#9b8063'), demoPhoto('#7489a5')],
                 note: '비공개 메모 — 새면 안 됨', is_public: true, is_listed: false,
                 public_note: '2024년 5월 해칭. 순한 편입니다.', public_breeder: true,
                 share_token: 'DEMOtoken1234567890ab' };
  const plans = C.SPECIES.leopard.plans.map((t, i) => ({ id: 'p' + i, animal_id: ID, kind: t.kind,
    title: t.title, interval_days: t.interval_days || null, weekdays: t.weekdays || null,
    start_date: C.addDays(T, -120), is_active: true }));
  let records = [];
  for (let i = 60; i >= 0; i--) { const d = C.addDays(T, -i);
    plans.forEach(p => { if (C.isDueOn(p, d) && Math.random() > .25)
      records.push({ id: 'r' + records.length, plan_id: p.id, animal_id: ID, kind: p.kind, done_date: d, title: p.title }); }); }
  records.push({ id: 'sg1', animal_id: ID, kind: 'symptom', detail: 'wobble', title: '관찰', done_date: C.addDays(T, -3) });
  const weights = [10,8,6,4,2,0].map((i, n) => ({ id: 'w' + n, animal_id: ID,
    measured_on: C.addDays(T, -i * 7), grams: 48 + n * 2.4 }));
  weights.push({ id: 'w6', animal_id: ID, measured_on: T, measured_at: T + 'T21:00:00+09:00', grams: 60.5 });
  const feeds = [
    { id:'food-cgd', name:'망고 슈퍼푸드', kind:'staple', unit:'g', per_use:6, amount_left:84, is_active:true },
    { id:'food-cricket', name:'귀뚜라미', kind:'staple', unit:'piece', per_use:4, amount_left:20, is_active:true }
  ];
  const noop = async () => {};
  window.CareApp = { ready: true, user: { id: 'u1', email: 'demo@x' }, premium: { active: true, kind: 'sub' },
    sb: { rpc: async name => name === 'public_animal' ? { data: {
      name: animal.name, species: animal.species, sex: animal.sex, life_stage: animal.life_stage,
      hatch_date: animal.hatch_date, morphs: ['이클립스', '탠저린'], hets: [], photo_url: animal.photo_url,
      photos: animal.photos, note: animal.public_note, breeder: '량 스튜디오', clutch: '2024-A',
      parents: { a: { name: '아비' }, b: { name: '어미' } },
      latest_weight: { grams: 60.5, measured_on: T }, weight_history: []
    }, error: null } : { data: null, error: new Error('Unknown RPC') } },
    device: () => 'd', friendly: e => String((e && e.message) || e), boot: async () => ({}), logVisit: () => {},
    listAnimals: async () => [animal].concat(kin), listPlans: async () => plans,
    listRecords: async () => records, listWeights: async () => weights, listFeeds: async () => feeds,
    addRecord: async r => { records.push(Object.assign({ id: 'n' + records.length, done_date: T }, r)); },
    deleteRecord: noop, saveWeight: noop,
    setShare: async (id, pub, note, br, rot, listed) => {
      animal = Object.assign({}, animal, { is_public: pub, is_listed: listed,
        public_note: note, public_breeder: br, share_token: rot ? 'ROTATED' + Date.now() : animal.share_token });
    }
  };
  const harnessUrl = new URL(location.href);
  harnessUrl.searchParams.set('id', ID);
  history.replaceState(null, '', harnessUrl.pathname + harnessUrl.search + harnessUrl.hash);
})();
</script>
