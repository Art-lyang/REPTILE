<script>
/* 가짜 백엔드 */
(function () {
  const C = window.CareCore, T = C.today();
  const sp = new URLSearchParams(location.search).get('species') || 'gecko';
  /* 역산확인용 — 종마다 실제 토큰이 다르므로 주소로 받습니다 */
  const seed=(new URLSearchParams(location.search).get('morphs')||'').split(',').filter(Boolean);
  let animals = [
    { id:'a1', species:sp, name:'첫째', sex:'male', life_stage:'adult', morphs:seed.slice(0,1), hets:[], note:'비공개 메모' },
    { id:'a2', species:sp, name:'둘째', sex:'female', life_stage:'adult', morphs:seed.slice(1,2), hets:[], parent_a:'a1' },
    { id:'a3', species:sp, name:'셋째', sex:'female', life_stage:'adult', morphs:[], hets:[] },
    { id:'a4', species:sp, name:'넷째', sex:'female', life_stage:'adult', morphs:[], hets:[] },
    { id:'a9', species:'pygmy', name:'다른종', sex:'male', life_stage:'adult', morphs:[], hets:[] }
  ];
  let groups = [{ id:'g1', species:sp, name:'2026 A라인', male:'a1', status:'active',
    start_date:C.addDays(T,-18), target_morph:'라인 고정' }];
  let pairs = [
    { id:'p1', group_id:'g1', name:'2026 A라인 · 둘째', male:'a1', female:'a2', note:'첫 시도' },
    { id:'p2', group_id:'g1', name:'2026 A라인 · 셋째', male:'a1', female:'a3' },
    { id:'p3', group_id:'g1', name:'2026 A라인 · 넷째', male:'a1', female:'a4' }
  ];
  let matingEvents = [{ id:'me1', group_id:'g1', pairing_id:'p1', occurred_on:C.addDays(T,-3),
    result:'copulation', note:'교미 확인' }];
  let clutches = [{ id:'c1', species:sp, pairing:'p1', laid_date:C.addDays(T,-58), egg_count:3,
                    fertile_count:0, infertile_count:0, stopped_count:0, hatched_count:1,
                    actual_hatch_date:C.addDays(T,-2), outcome_closed:false,
                    temp:28.5, expected_hatch:C.addDays(T,-3) }];
  let projects = [];
  const noop = async () => {};
  window.__saved = [];
  window.CareApp = {
    ready:true, user:{id:'u1',email:'demo@x'}, premium:{active:true,kind:'sub'},
    sb:null,
    device:()=>'d', friendly:e=>String((e&&e.message)||e), boot:async()=>({}), logVisit:()=>{},
    uploadPhoto:async file=>URL.createObjectURL(file),
    listAnimals: async()=>animals,
    listRows: async t=>(t==='pairings'?pairs:clutches),
    saveAnimal: async r=>{window.__saved.push(['animal',r]); const found=animals.find(a=>a.id===r.id);
      if(found) Object.assign(found,r); else {r.id='new'+animals.length;animals.push(r);} },
    saveRow: async (t,r)=>{window.__saved.push([t,r]);},
    saveClutch: async r=>{window.__saved.push(['clutches',r]);const found=clutches.find(c=>c.id===r.id);
      if(found)Object.assign(found,r);else{r.id='c'+(clutches.length+1);clutches.unshift(r);}return r;},
    saveClutchOutcome: async (id,r)=>{const found=clutches.find(c=>c.id===id);Object.assign(found,r);return found;},
    listClutchOffspring: async ids=>animals.filter(a=>ids.includes(a.clutch_id)),
    listBreedingProjects: async()=>projects,
    listMatingGroups: async()=>groups,
    listMatingEvents: async ids=>matingEvents.filter(event=>ids.includes(event.group_id)),
    saveMatingGroup: async (group,femaleIds)=>{const saved=Object.assign({},group,{id:group.id||'g'+(groups.length+1)});
      const found=groups.find(item=>item.id===saved.id);if(found)Object.assign(found,saved);else groups.unshift(saved);
      pairs.forEach(pair=>{if(pair.group_id===saved.id&&!femaleIds.includes(pair.female))pair.group_id=null;});
      femaleIds.forEach(female=>{let pair=pairs.find(item=>item.group_id===saved.id&&item.female===female);
        if(!pair){pair={id:'p'+(pairs.length+1)};pairs.push(pair);}Object.assign(pair,{group_id:saved.id,male:saved.male,
          female: female,name:saved.name+' · '+((animals.find(item=>item.id===female)||{}).name||female),species:sp});});
      return saved;},
    saveMatingEvent: async event=>{const saved=Object.assign({},event,{id:event.id||'me'+(matingEvents.length+1)});
      const found=matingEvents.find(item=>item.id===saved.id);if(found)Object.assign(found,saved);else matingEvents.unshift(saved);return saved;},
    deleteMatingEvent: async id=>{matingEvents=matingEvents.filter(event=>event.id!==id);},
    createBreedingProject: async r=>{const now=new Date().toISOString();const saved=Object.assign({},r,
      {id:'bp'+(projects.length+1),user_id:'u1',created_at:now,updated_at:now});projects.unshift(saved);return saved;},
    updateBreedingProject: async (p,c)=>{Object.assign(p,c,{updated_at:new Date().toISOString()});return p;},
    deleteBreedingProject: async p=>{projects=projects.filter(item=>item.id!==p.id);},
    deleteRow: noop, deleteAnimal: noop
  };
  [
    {
      version:1,species:sp,calculatedAt:new Date().toISOString(),
      parents:{A:{label:'블랙나이트',traits:[]},B:{label:'이클립스',traits:[]}},
      results:[
        {label:'블랙나이트 크로스',probability:.5,guaranteedHets:[],partialHets:[]},
        {label:'100% het 이클립스',probability:.5,guaranteedHets:[],partialHets:[]}
      ],warnings:[],lineTraits:[{id:'blacknight',label:'블랙나이트',both:false}]
    },
    {
      version:1,species:sp,calculatedAt:new Date(Date.now()-86400000).toISOString(),
      parents:{A:{label:'맥스노우',traits:[]},B:{label:'맥스노우',traits:[]}},
      results:[
        {label:'슈퍼 스노우',probability:.25,guaranteedHets:[],partialHets:[]},
        {label:'맥스노우',probability:.5,guaranteedHets:[],partialHets:[]},
        {label:'노멀',probability:.25,guaranteedHets:[],partialHets:[]}
      ],warnings:[],lineTraits:[]
    }
  ].forEach(function (item) { window.CalculationHistoryStore.record(item, 'ko'); });
})();
</script>
