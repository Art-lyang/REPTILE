<script>
const SUPABASE_URL = 'harness';
const SUPABASE_ANON = 'harness';
const animals = [
  {token:'demo',name:'라봉이',species:'leopard',sex:'female',life_stage:'adult',morphs:['Tangerine'],hets:['100% het Tremper Albino'],photo:'/assets/leopard-hero-v1.png'},
  {token:'leo-2',name:'모카',species:'leopard',sex:'male',life_stage:'adult',morphs:['Black Night'],hets:[],photo:'/assets/leo-face-a.png'},
  {token:'cre-1',name:'호두',species:'crested',sex:'female',life_stage:'subadult',morphs:['Harlequin'],hets:[],photo:'/assets/crested-profile-orange-v1.jpg'},
  {token:'cre-2',name:'구름',species:'crested',sex:'male',life_stage:'adult',morphs:['Lilly White'],hets:[],photo:'/assets/crested-profile-dark-v1.jpg'},
  {token:'fat-1',name:'오레오',species:'fattail',sex:'male',life_stage:'adult',morphs:['Oreo'],hets:[],photo:'/assets/fattail-profile-oreo-v1.jpg'},
  {token:'fat-2',name:'쿠키',species:'fattail',sex:'female',life_stage:'adult',morphs:['Normal'],hets:[],photo:'/assets/fattail-profile-normal-v1.jpg'}
];
/* ?nick=none 이면 이력 없음, ?nick=err 이면 v59 미적용(함수 없음) 상태를 봅니다. */
const nickMode = new URLSearchParams(location.search).get('nick') || '';
const okLogo='data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0e7c7b"/><text x="32" y="41" font-size="26" fill="#fff" text-anchor="middle" font-family="sans-serif">R</text></svg>');
const nickHistory = [
  {at:'2026-08-02T04:00:00Z', from:'행복한 집사 003', to:'Ryang Gecko'},
  {at:'2026-07-11T00:01:00Z', from:'느긋한 집사 012', to:'행복한 집사 003'}
];
window.supabase = { createClient(){ return {
  rpc(fn){
    if(fn==='public_breeder_badge'){
      /* ?biz=none 이면 미인증, ?biz=nologo 면 인증은 됐는데 로고가 없는 경우. */
      /* ?biz= 로 네 조합을 봅니다.
         (없음) 인증+로고 · image  이미지만 · verified 인증만 · none 아무것도 */
      const biz=new URLSearchParams(location.search).get('biz')||'';
      if(biz==='none')     return Promise.resolve({data:{},error:null});
      if(biz==='image')    return Promise.resolve({data:{verified:false,biz_name:null,image:okLogo},error:null});
      if(biz==='verified') return Promise.resolve({data:{verified:true,biz_name:'량스튜디오',image:null},error:null});
      return Promise.resolve({data:{verified:true,biz_name:'량스튜디오',image:okLogo,logo_url:okLogo},error:null});
    }
    if(fn==='public_nickname_history'){
      if(nickMode==='err') return Promise.resolve({data:null,error:{code:'PGRST202',message:'not found'}});
      return Promise.resolve({data:nickMode==='none'?[]:nickHistory,error:null});
    }
    return Promise.resolve({data:{breeder:'Ryang Gecko',total:animals.length,animals},error:null});
  },
  storage:{from(){return{createSignedUrls(){return Promise.resolve({data:[],error:null});}};}}
}; } };
</script>
