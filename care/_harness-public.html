  { token:'leo-2', name:'모카', species:'leopard', sex:'male', life_stage:'adult', morphs:['Black Night'], hets:[], photo:'/assets/leo-face-a.png' },
  { token:'cre-1', name:'호두', species:'crested', sex:'female', life_stage:'subadult', morphs:['Harlequin'], hets:[], photo:'/assets/crested-profile-orange-v1.jpg' },
  { token:'fat-1', name:'오레오', species:'fattail', sex:'male', life_stage:'adult', morphs:['Oreo'], hets:[], photo:'/assets/fattail-profile-oreo-v1.jpg' }
];
const publicAnimal = {
  name:'라봉이', species:'leopard', sex:'female', life_stage:'adult', hatch_date:'2025-11-13',
  morphs:['Tangerine'], hets:['100% het Tremper Albino'], photo_url:'/assets/leopard-hero-v1.png',
  photos:['/assets/leo-face-a.png','/assets/leo-face-b.png'], note:'건강하게 성장 중인 라인브리딩 개체입니다.',
  breeder:'Ryang Gecko', clutch:'RG-25-11',
  parents:{
    a:{name:'블랙',morphs:['Black Night'],hets:[],token:'sire',photo:'/assets/leo-face-a.png'},
    b:{name:'탠저린',morphs:['Tangerine'],hets:['100% het Tremper Albino'],token:'dam',photo:'/assets/leo-face-b.png'}
  },
  latest_weight:{grams:62.4,measured_on:'2026-08-03'},
  weight_history:[
    {grams:48.2,measured_on:'2026-04-06'},{grams:51.1,measured_on:'2026-05-04'},
    {grams:54.7,measured_on:'2026-06-01'},{grams:58.5,measured_on:'2026-07-06'},
    {grams:62.4,measured_on:'2026-08-03'}
  ]
};
window.supabase = { createClient(){ return {
  rpc(name){
    /* ?biz=none 이면 미인증, ?biz=nologo 면 인증만 된 상태를 봅니다. */
    if(name === 'public_breeder_badge'){
      /* ?biz= 로 네 조합을 봅니다.
         (없음) 인증+로고 · image  이미지만 · verified 인증만 · none 아무것도 */
      const biz=new URLSearchParams(location.search).get('biz')||'';
      if(biz==='none') return Promise.resolve({ data:{}, error:null });
      const logo='data:image/svg+xml;base64,'+btoa('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0e7c7b"/><text x="32" y="41" font-size="26" fill="#fff" text-anchor="middle" font-family="sans-serif">R</text></svg>');
      if(biz==='image')    return Promise.resolve({ data:{ verified:false, biz_name:null, image:logo }, error:null });
      if(biz==='verified') return Promise.resolve({ data:{ verified:true, biz_name:'량스튜디오', image:null }, error:null });
      return Promise.resolve({ data:{ verified:true, biz_name:'량스튜디오', image:logo, logo_url:logo }, error:null });
    }
    if(name === 'public_animal') return Promise.resolve({ data:publicAnimal, error:null });
    /* ?related=none 이면 공개된 개체가 이 한 마리뿐인 브리더를 봅니다.
       예전에는 이때 브리더로 가는 버튼이 통째로 사라졌습니다. */
    const rel=new URLSearchParams(location.search).get('related')||'';
    const list=rel==='none'?[]:breederAnimals;
    return Promise.resolve({ data:{ breeder:'Ryang Gecko', total:list.length, animals:list }, error:null });
  },
  storage:{ from(){ return { createSignedUrls(){ return Promise.resolve({data:[],error:null}); } }; } }
}; } };
</script>
