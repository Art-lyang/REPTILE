<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>care 하네스 (임시)</title>
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/variable/pretendardvariable-dynamic-subset.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<link rel="stylesheet" href="care.css?v=5">
</head>
<body>
<header><div class="hd"><div class="hd-txt">
  <h1>케어 관리</h1><div class="sub" id="who"></div>
</div><div class="hd-btns"><a class="blink" id="acctBtn" href="#" style="display:none">내 정보</a></div></div></header>
<div class="wrap">
  <div class="focusbar" id="focusbar" style="display:none">
    <span class="fl">개체</span><select id="focus" aria-label="개체"></select>
  </div>
  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-t="today"><i class="bi bi-check2-square" aria-hidden="true"></i>오늘</button>
    <button class="tab" data-t="animals"><i class="bi bi-heart" aria-hidden="true"></i>개체</button>
    <button class="tab" data-t="plans"><i class="bi bi-arrow-repeat" aria-hidden="true"></i>계획</button>
    <button class="tab" data-t="health"><i class="bi bi-clipboard-pulse" aria-hidden="true"></i>건강</button>
    <button class="tab" data-t="report"><i class="bi bi-graph-up" aria-hidden="true"></i>요약</button>
  </div>
  <div id="body"></div>
</div>
<div id="toast"></div>

<script src="care-core.js?v=5"></script>
<script>
/* 가짜 백엔드. 실제 care-app.js 대신 이걸 물려 화면만 확인합니다. */
(function () {
  const C = window.CareCore, T = C.today();
  const CR = 'c1', LEO = 'l1';
  const animals = [{ id: CR, name: '하양이', species: 'crested', sex: 'female' },
                   { id: LEO, name: '노랑이', species: 'leopard', sex: 'male' }];
  let records = [
    { id: 's1', animal_id: CR, kind: 'symptom', detail: 'floppy_tail', title: '관찰', done_date: C.addDays(T, -11) },
    { id: 's2', animal_id: CR, kind: 'symptom', detail: 'floppy_tail', title: '관찰', done_date: C.addDays(T, -4) },
    { id: 's3', animal_id: CR, kind: 'symptom', detail: 'shed_stuck', title: '관찰', done_date: C.addDays(T, -30) },
    { id: 's4', animal_id: CR, kind: 'symptom', detail: 'shed_stuck', title: '해소', done_date: C.addDays(T, -26) },
    { id: 's5', animal_id: CR, kind: 'symptom', detail: 'resp', title: '관찰', done_date: C.addDays(T, -1) }
  ];
  const noop = async () => {};
  window.__saved = [];
  window.CareApp = {
    ready: true, user: { id: 'u1', email: 'demo@x' }, premium: { active: true, kind: 'sub' },
    device: () => 'd', friendly: e => String((e && e.message) || e), boot: async () => ({}), logVisit: () => {},
    listAnimals: async () => animals, listPlans: async () => [],
    listRecords: async () => records, listWeights: async () => [],
    saveAnimal: noop, deleteAnimal: noop, savePlan: noop, deletePlan: noop, addPlans: noop,
    addRecord: async r => {
      window.__saved.push(r);
      records = records.concat([Object.assign({ id: 'n' + window.__saved.length, done_date: T }, r)]);
    },
    deleteRecord: noop, completePlan: noop, undoPlan: noop, saveWeight: noop, deleteWeight: noop
  };
})();
</script>
<script src="care-ui.js?v=5"></script>
</body>
</html>
