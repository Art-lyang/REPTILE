<script>
/* 가짜 백엔드. 실제 care-app.js 대신 이걸 물려 화면만 확인합니다. */
(function () {
  const C = window.CareCore, T = C.today();
  const CR = 'c1', LEO = 'l1';
  const animals = [{ id: CR, name: '하양이', species: 'crested', sex: 'female', life_stage: 'adult' },
                   { id: LEO, name: '노랑이', species: 'leopard', sex: 'male', life_stage: 'subadult' }];
  let records = [
    { id: 's1', animal_id: CR, kind: 'symptom', detail: 'floppy_tail', title: '관찰', done_date: C.addDays(T, -11) },
    { id: 's2', animal_id: CR, kind: 'symptom', detail: 'floppy_tail', title: '관찰', done_date: C.addDays(T, -4) },
    { id: 's3', animal_id: CR, kind: 'symptom', detail: 'shed_stuck', title: '관찰', done_date: C.addDays(T, -30) },
    { id: 's4', animal_id: CR, kind: 'symptom', detail: 'shed_stuck', title: '해소', done_date: C.addDays(T, -26) },
    { id: 's5', animal_id: CR, kind: 'symptom', detail: 'resp', title: '관찰', done_date: C.addDays(T, -1) },
    { id: 'r1', animal_id: CR, plan_id: 'pf1', kind: 'feed', done_date: C.addDays(T, -4) },
    { id: 'r2', animal_id: CR, plan_id: 'pf1', kind: 'feed', done_date: C.addDays(T, -2) },
    { id: 'r3', animal_id: LEO, plan_id: 'pf4', kind: 'clean', done_date: C.addDays(T, -2) },
    { id: 'r4', animal_id: LEO, plan_id: 'pf4', kind: 'clean', done_date: T }
  ];
  const plans = [
    { id:'pf1', animal_id:CR, kind:'feed', title:'CGD 급여', feed_item_id:'f1',
      interval_days:2, start_date:C.addDays(T,-60), is_active:true },
    { id:'pf2', animal_id:LEO, kind:'custom', title:'밀웜 간식', feed_item_id:'f2',
      weekdays:[2,5], start_date:C.addDays(T,-60), is_active:true },
    { id:'pf3', animal_id:CR, kind:'supplement', title:'칼슘', feed_item_id:'f3',
      weekdays:[1,4], start_date:C.addDays(T,-60), is_active:true },
    { id:'pf4', animal_id:LEO, kind:'clean', title:'상태 확인', weekly_target:3,
      start_date:C.addDays(T,-60), is_active:true }
  ];
  const feeds = [
    { id:'f1', name:'판게아 파파야', kind:'staple', brand:'Pangea', unit:'g',
      per_use:8, amount_left:24, amount_full:500, lead_days:3,
      buy_url:'https://example.com/pangea', is_active:true },
    { id:'f2', name:'밀웜', kind:'treat', unit:'마리', per_use:5,
      amount_left:300, amount_full:500, lead_days:2, is_active:true },
    { id:'f3', name:'칼슘 D3', kind:'supplement', unit:'통', per_use:0.02,
      amount_left:0.4, amount_full:1, lead_days:5,
      expires_on:'2026-08-05', is_active:true },
    { id:'f4', name:'다 쓴 것', kind:'other', unit:'g', per_use:1,
      amount_left:0, amount_full:100, lead_days:1, is_active:false }
  ];
  const noop = async () => {};
  const saveAnimal = async (row, initialWeight) => {
    const found = animals.find(a => a.id === row.id);
    if (found) Object.assign(found, row);
    else {
      row.id = 'a' + (animals.length + 1);
      animals.push(row);
    }
    window.__saved.push(['animal', row]);
    if (initialWeight !== null && initialWeight !== undefined && initialWeight !== '') {
      window.__saved.push(['weight', {
        animal_id: row.id, grams: Number(initialWeight), measured_on: T
      }]);
    }
    return row.id;
  };
  const savePlan = async row => {
    const found = plans.find(plan => plan.id === row.id);
    if (found) Object.assign(found, row);
    else {
      row.id = 'p' + (plans.length + 1);
      plans.push(row);
    }
    window.__saved.push(['plan', row]);
  };
  window.__saved = [];
  window.CareApp = {
    ready: true, user: { id: 'u1', email: 'demo@x' }, premium: { active: true, kind: 'sub' },
    sb: null,
    device: () => 'd', friendly: e => String((e && e.message) || e), boot: async () => ({}), logVisit: () => {},
    uploadPhoto: async file => URL.createObjectURL(file),
    listAnimals: async () => animals, listPlans: async () => plans,
    listRecords: async () => records, routineStreak: async () => 1, listWeights: async () => [],
    /* 한도 확인용. 주소로 상태를 바꿔 봅니다.
         ?free=1     무료이고 두 번째 개체부터 잠긴 상태
         ?quota=full 유료인데 자리를 다 채운 상태 (안내 띠가 빨갛게)
         없으면      유료이고 여유 있는 상태 (안내 띠가 뜨면 안 됨)

       '자리가 얼마 안 남은' 상태는 여기 개체가 2마리뿐이라 만들 수 없습니다
       (8할을 넘기면서 동시에 다 차지 않으려면 개체가 더 있어야 합니다).
       그 임계값은 tests/care-free-limit.test.js 가 지킵니다. */
    careQuota: async () => {
      const q = new URLSearchParams(location.search);
      if (q.get('free') === '1') {
        return { premium: false, limit: 1, used: animals.length,
                 active: animals.slice(0, 1).map(a => a.id), known: true };
      }
      if (q.get('quota') === 'full') {
        return { premium: true, limit: animals.length, used: animals.length, active: null, known: true };
      }
      return { premium: true, limit: 50, used: animals.length, active: null, known: true };
    },
    activeAnimalIds: () => (new URLSearchParams(location.search).get('free') === '1'
      ? animals.slice(0, 1).map(a => a.id) : null),
    setAnimalSlot: async () => ({ ok: true }),
    listFeeds: async () => feeds, saveFeed: noop, deleteFeed: noop, refillFeed: noop,
    saveAnimal: saveAnimal, deleteAnimal: noop, savePlan: savePlan, deletePlan: noop,
    addPlans: async rows => rows.forEach(savePlan),
    addRecord: async r => {
      window.__saved.push(r);
      records = records.concat([Object.assign({ id: 'n' + window.__saved.length, done_date: T }, r)]);
    },
    deleteRecord: noop,
    completePlan: async plan => window.CareApp.addRecord({
      animal_id: plan.animal_id, plan_id: plan.id, kind: plan.kind,
      done_date: T, title: plan.title, detail: plan.detail
    }),
    undoPlan: async plan => { records = records.filter(r => !(r.plan_id === plan.id && r.done_date === T)); },
    saveWeight: async (animalId, grams, measuredOn) => {
      window.__saved.push(['weight', { animal_id: animalId, grams: grams, measured_on: measuredOn || T }]);
    },
    deleteWeight: noop
  };
})();
</script>
