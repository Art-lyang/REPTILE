       갈아끼울 수 없습니다. -->

    <button class="tab" data-t="clutch"><i class="bi bi-egg" aria-hidden="true"></i><span data-bm-text="tabClutches">클러치</span></button>
    <button class="tab" data-t="goal"><i class="bi bi-bullseye" aria-hidden="true"></i><span data-bm-text="tabGoals">역산</span></button>
