<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>케어 관리 · 량 스튜디오</title>
<meta name="description" content="급여·청소·영양제 주기와 체중을 기록하고, 캘린더로 내보내 폰에서 알림을 받습니다.">

<!-- 개인 사육 기록 화면입니다. 검색에 절대 노출되면 안 됩니다. -->
<meta name="robots" content="noindex, nofollow">

<link rel="icon" type="image/png" sizes="32x32" href="/assets/logo-mark-32.png">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/logo-mark.png">
<link rel="apple-touch-icon" href="/assets/logo-mark-180.png">

<!-- 홈 화면에 추가하면 주소창 없이 앱처럼 열립니다.
     iOS 는 설치 버튼을 띄울 수 없어서 공유 → '홈 화면에 추가' 로 안내합니다. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f5f1e8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#151a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="케어">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<!-- 테스트 중 임시 잠금. 가려두는 용도일 뿐이고, 실제 데이터는 아래 Supabase
     로그인과 RLS 가 지킵니다. 자세한 내용은 assets/gate.js 머리말 참고.
     다른 스크립트보다 먼저 와야 화면이 번쩍 보였다 가려지지 않습니다. -->
<script src="/assets/gate.js?v=1"></script>

<link rel="stylesheet" href="care.css?v=1">
</head>
<body>

<header>
  <div class="hwrap">
    <a class="back" href="/">← 스튜디오</a>
    <div style="flex:1;min-width:0">
      <h1>🗓 케어 관리</h1>
      <div class="sub" id="who"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <select class="in" id="focus" style="display:none;margin-bottom:12px"></select>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-t="today">오늘</button>
    <button class="tab" data-t="animals">개체</button>
    <button class="tab" data-t="plans">계획</button>
    <button class="tab" data-t="report">요약</button>
  </div>

  <div id="body"><div class="empty">불러오는 중…</div></div>

  <!-- 개인 사육 기록을 다루는 화면이라 약관·처리방침으로 가는 길이 있어야
       합니다. 계산기는 SHOW_LEGAL_LINKS 로 숨기고 있지만, 여기는 로그인해야
       들어오는 곳이고 수집하는 항목도 더 많아 항상 보여줍니다. -->
  <div class="legal">
    <a href="/terms.html#terms">이용약관</a> ·
    <a href="/terms.html#privacy">개인정보처리방침</a>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<!-- 읽는 순서가 중요합니다.
     supabase-js → studio-config(접속 정보) → care-core(SERVICE_ID 정의)
     → analytics(SERVICE_ID 를 씀) → care-app → care-ui(마지막에 실행) -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="/assets/studio-config.js?v=113119"></script>
<script src="care-core.js?v=1"></script>
<script src="/assets/analytics.js?v=1"></script>
<script src="care-app.js?v=1"></script>
<script src="care-ui.js?v=1"></script>
</body>
</html>
