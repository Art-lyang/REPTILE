       (계산기 헤더와 같은 규칙) -->
  <img class="hd-deco leaf" src="/assets/leaf.svg" alt="" aria-hidden="true">
  <img class="hd-deco hero" src="/assets/leopard-hero-v1.png" alt="" aria-hidden="true" loading="eager">
  <div class="hd">
    <div class="hd-txt">
      <h1 data-care-text="pageHeader">크리처 케어로그</h1>
      <div class="sub" id="who" data-care-text="pageSubtitle">급여·청소·영양제 주기를 정해두고 오늘 할 일로 확인하세요</div>
    </div>
    <div class="hd-btns">
      <label class="blink care-lang" data-care-title="language"><i class="bi bi-globe2" aria-hidden="true"></i><span data-care-text="language">언어</span><select data-care-language data-care-aria="language"><option value="ko">한국어</option><option value="en">English</option><option value="zh">中文</option><option value="ja">日本語</option></select></label>
      <a class="blink" href="/" title="량 스튜디오" data-care-url data-care-title="studio"><i class="bi bi-house" aria-hidden="true"></i><span data-care-text="studio">스튜디오</span></a>
      <a class="blink" id="acctBtn" href="/gecko/login.html" data-care-url style="display:none" title="내 정보" data-care-title="account"><i class="bi bi-person" aria-hidden="true"></i><span data-care-text="account">내 정보</span></a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="focusbar" id="focusbar" style="display:none">
    <span class="fl" data-care-text="animal">개체</span>
    <select id="focus" aria-label="개체 고르기" data-care-aria="focusAnimal"></select>
    <i class="bi bi-chevron-down" aria-hidden="true"></i>
  </div>

  <div class="tabs" id="tabs" style="display:none">
    <button class="tab on" data-t="today"><i class="bi bi-check2-square" aria-hidden="true"></i><span data-care-text="tabToday">오늘</span></button>
    <button class="tab" data-t="animals"><i class="bi bi-heart" aria-hidden="true"></i><span data-care-text="tabAnimals">개체</span></button>
    <button class="tab" data-t="plans"><i class="bi bi-arrow-repeat" aria-hidden="true"></i><span data-care-text="tabPlans">계획</span></button>
    <button class="tab" data-t="feed"><i class="bi bi-box-seam" aria-hidden="true"></i><span data-care-text="tabFeed">먹이</span></button>
    <button class="tab" data-t="health"><i class="bi bi-clipboard-pulse" aria-hidden="true"></i><span data-care-text="tabHealth">건강</span></button>
    <button class="tab" data-t="report"><i class="bi bi-graph-up" aria-hidden="true"></i><span data-care-text="tabReport">요약</span></button>
  </div>

  <div id="body"><div class="empty" data-care-text="loading">불러오는 중…</div></div>

  <!-- 개인 사육 기록을 다루는 화면이라 약관·처리방침으로 가는 길이 있어야
       합니다. 계산기는 SHOW_LEGAL_LINKS 로 숨기고 있지만, 여기는 로그인해야
       들어오는 곳이고 수집하는 항목도 더 많아 항상 보여줍니다. -->
  <div class="legal" hidden>
    <a href="/terms.html#terms" data-care-text="terms">이용약관</a> ·
    <a href="/terms.html#privacy" data-care-text="privacy">개인정보처리방침</a>
  </div>
</div>
