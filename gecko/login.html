<style>
  :root{
    --bg:#EDEAE1; --card:#FDFCF9; --card2:#F4F1E9; --ink:#26221D; --ink2:#8A8375;
    --hair:rgba(38,34,29,.08); --chipbd:rgba(38,34,29,.16);
    --teal:#0E7C7B; --teal2:#0A6160; --patina:#3B8DA0; --butter:#EAC36A; --eggplant:#6B5686;
    --shadow:0 1px 2px rgba(38,34,29,.05), 0 8px 24px rgba(38,34,29,.07);
    --err:#B4402A; --errbg:#FBEAE3; --errbd:#F0C3B2;
    --ok:#0E7C7B; --okbg:#E4F0EE; --okbd:#B6D8D4;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#141310; --card:#211E1A; --card2:#1B1915; --ink:#F3EFE7; --ink2:#A49D8F;
      --hair:rgba(255,255,255,.08); --chipbd:rgba(255,255,255,.18);
      --teal:#3FB8B2; --teal2:#57C8C2; --eggplant:#B9A3D6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.3);
      --err:#F3A594; --errbg:#2E1713; --errbd:#6E2E22;
      --ok:#7FD8D2; --okbg:#12231F; --okbd:#2C4A45; }
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  header{padding:22px 16px 6px;text-align:center;position:relative}
  .back{position:absolute;left:14px;top:22px;color:var(--teal);text-decoration:none;font-weight:700;font-size:13.5px}
  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
  .wrap{flex:1;width:100%;max-width:400px;margin:0 auto;padding:14px 16px 40px}
  .card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .seg{display:flex;background:rgba(120,120,128,.14);border-radius:11px;padding:3px;margin-bottom:18px}
  .seg button{flex:1;background:transparent;border:none;padding:9px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
  .seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(38,34,29,.16)}
  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;color:#1f1f1f;
    border:1px solid #dadce0;border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .gbtn:active{background:#f5f5f5}
  .gbtn svg{width:18px;height:18px}
  .divider{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:11.5px;margin:16px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--hair)}
  label.fl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 5px 2px}
  .in{width:100%;padding:12px 13px;border:1.5px solid var(--chipbd);border-radius:11px;background:var(--card2);
    color:var(--ink);font-size:15px;font-family:inherit;margin-bottom:12px}
  .in:focus{outline:none;border-color:var(--teal)}
  .in.bad{border-color:var(--err)}
  .btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15.5px;
    font-weight:700;cursor:pointer;font-family:inherit;margin-top:4px}
  .btn:active{background:var(--teal2)}
  .btn[disabled]{opacity:.6;cursor:default}
  .btn.ghost{background:rgba(120,120,128,.15);color:var(--ink)}
  .msg{font-size:12.5px;border-radius:10px;padding:10px 12px;margin-top:12px;line-height:1.55;display:none}
  .msg.show{display:block}
  .msg.e{background:var(--errbg);border:1px solid var(--errbd);color:var(--err)}
  .msg.o{background:var(--okbg);border:1px solid var(--okbd);color:var(--ok)}
  .sub{font-size:12px;color:var(--ink2);text-align:center;margin-top:14px}
  .sub a{color:var(--teal);font-weight:700;text-decoration:none;cursor:pointer}
  .hint{font-size:11.5px;color:var(--ink2);margin:-6px 0 12px 2px}
  .me{text-align:center}
  .me .av{width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:26px;font-weight:800;margin:0 auto 12px}
  .me .em{font-weight:800;font-size:16px;word-break:break-all}
  .badge{display:inline-block;font-size:11px;font-weight:800;padding:3px 10px;border-radius:20px;margin-top:8px}
  .badge.pro{background:rgba(234,195,106,.25);color:#9A6A12}
  .badge.free{background:rgba(120,120,128,.18);color:var(--ink2)}
  .links{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .links a{display:block;text-align:center;background:var(--card2);color:var(--ink);text-decoration:none;
    border-radius:11px;padding:12px;font-size:14px;font-weight:700}
.consent{background:var(--card2);border-radius:12px;padding:12px 13px;margin:6px 0 12px}
  .cAll{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;padding:4px 2px 10px;border-bottom:1px solid var(--hair);margin-bottom:6px;cursor:pointer}
  .cRow{display:flex;align-items:flex-start;gap:9px;font-size:13px;padding:6px 2px;cursor:pointer}
  .cRow input,.cAll input{width:18px;height:18px;accent-color:var(--teal);flex:0 0 auto;margin-top:1px}
  .cRow .req{color:var(--teal);font-weight:800;font-size:11.5px;margin-right:3px}
  .cRow .opt{color:var(--ink2);font-weight:700;font-size:11.5px;margin-right:3px}
  .cRow a{color:var(--ink2);text-decoration:underline;font-size:11.5px;margin-left:4px}
  .cNote{font-size:11px;color:var(--ink2);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair)}
  .why{background:var(--card2);border-radius:12px;padding:13px;font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:16px}
  .why b{color:var(--ink)}
  /* 로그인 수단 목록 */
  .idrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hair)}
  .idrow:last-of-type{border-bottom:none}
  .idic{flex:0 0 22px;font-size:15px;text-align:center}
  .idmain{flex:1;min-width:0}
  .idmain b{font-size:13px;font-weight:700}
  .idsub{color:var(--ink2);font-size:11px;margin-top:1px;word-break:break-all}
  .idlast{flex:0 0 auto;font-size:10.5px;font-weight:700;color:var(--ink2);background:var(--card);
    border:1px solid var(--hair);border-radius:6px;padding:4px 8px;white-space:nowrap}
  .idrow .mini{flex:0 0 auto;background:var(--card);border:1px solid var(--hair);color:var(--ink);
    border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
  /* 회원탈퇴 */
  .tokgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;margin-bottom:4px}
  .tokgrid2 .cRow{font-size:12.5px}
  .quit{display:inline-block;color:var(--ink2);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px}
  .quitbox{background:var(--card2);border-radius:12px;padding:12px 14px;margin-top:10px;font-size:12.5px;line-height:1.6;color:var(--ink2)}
  .quitbox b{color:var(--ink);display:block;margin-bottom:4px;font-size:13px}
  .quitbox.warn{background:var(--errbg);border:1px solid var(--errbd)}
  .quitbox.warn b{color:var(--err)}
  .quitbox ul{margin:4px 0 0;padding-left:17px}
  .quitbox li{margin:5px 0}
  .quitbox li b{display:inline;margin:0;font-size:12.5px}
  .quitbox .qsub{color:var(--ink2);font-size:11.5px;line-height:1.55}
  .quitbox a{color:var(--teal);font-weight:700}
  .btn.danger{background:var(--err);color:#fff;margin-top:14px}
  .btn.danger[disabled]{opacity:.45}
</style>
</head>

<header>

<div class="wrap"><div class="card" id="root">불러오는 중…</div></div>

<script>
const SB = (SUPABASE_URL && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let MODE='login';   // login | signup | reset | newpw

function devId(){ try{ let d=localStorage.getItem('leoDevice'); if(!d){ d='dev_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('leoDevice',d);} return d; }catch(e){ return 'dev_anon'; } }
function say(kind,text){ const m=$('msg'); if(!m) return; m.className='msg show '+(kind==='e'?'e':'o'); m.innerHTML=text; }
function clearMsg(){ const m=$('msg'); if(m){ m.className='msg'; m.textContent=''; } }
function err(e){
  const t=(e&&e.message)||String(e);
  if(/Invalid login credentials/i.test(t)) return '이메일 또는 비밀번호가 올바르지 않아요.';
  if(/User already registered|already been registered/i.test(t)) return '이미 가입된 이메일이에요. 로그인해 주세요.';
  if(/Password should be at least|Password should contain/i.test(t)) return '비밀번호는 8자 이상, 특수문자를 포함해야 해요.';
  if(/Unable to validate email|invalid format/i.test(t)) return '이메일 형식이 올바르지 않아요.';
  if(/Email not confirmed/i.test(t)) return '메일 인증이 아직 안 됐어요. 받은 편지함(스팸함 포함)을 확인해 주세요.';
  if(/rate limit|too many/i.test(t)) return '시도가 너무 잦아요. 잠시 후 다시 시도해 주세요.';
  if(/provider is not enabled|Unsupported provider/i.test(t)) return '구글 로그인이 아직 설정되지 않았어요. (관리자 설정 필요)';
  return t;
}
/* ---------- 가입 봇 차단 (Cloudflare Turnstile) ----------
   키가 없으면 모든 함수가 조용히 통과합니다. 지금은 꺼진 상태이고,
   assets/studio-config.js 에 사이트 키를 넣는 순간 켜집니다.
   ⚠️ Supabase 쪽 CAPTCHA 설정도 같이 켜야 실제로 검사가 이뤄집니다.
      화면만 켜면 토큰을 보내도 서버가 확인하지 않습니다. */
const CAP_ON = (typeof TURNSTILE_SITE_KEY==='string') && !!TURNSTILE_SITE_KEY.trim();
let capWidget=null;
function capHTML(){ return CAP_ON ? '<div id="capBox" style="margin:10px 0"></div>' : ''; }
function capMount(){
  if(!CAP_ON || !$('capBox')) return;
  const go=()=>{ try{
      capWidget=turnstile.render('#capBox',{sitekey:TURNSTILE_SITE_KEY,theme:'auto'});
    }catch(e){} };
  if(window.turnstile) go();
  else { let n=0; const t=setInterval(()=>{ if(window.turnstile||++n>50){ clearInterval(t); if(window.turnstile) go(); } },100); }
}
/* 토큰은 1회용입니다. 로그인에 실패하고 다시 누르면 새 토큰을 받아야 합니다. */
function capToken(){
  if(!CAP_ON) return null;
  try{ return turnstile.getResponse(capWidget)||null; }catch(e){ return null; }
}
function capReset(){ if(CAP_ON){ try{ turnstile.reset(capWidget); }catch(e){} } }
function capOpts(o){
  const tk=capToken();
  if(!CAP_ON || !tk) return o;
  o.options=Object.assign({}, o.options, {captchaToken:tk});
  return o;
}

const CR_MAIL_LINK='<a href="mailto:kmc612000@gmail.com">kmc612000@gmail.com</a>';
const GOOGLE_SVG='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.5 2.6 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.7 6.9l7.6 5.9c4.4-4.1 6.8-10.1 6.8-17.3z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

/* 회원이 원할 때만 적는 항목. 가입 화면과 내 정보 화면이 같이 씁니다.
   지역은 시·도까지만 받습니다 — 상세 주소는 이 서비스가 쓸 데가 없고,
   받아두면 유출 시 피해만 커집니다. */
const SPECIES=['레오파드 게코','크레스티드 게코','펫테일 게코','기타 파충류','소형 포유류','아직 없음'];
const EXPERIENCE=[['','선택 안 함'],['new','입문 (1년 미만)'],['mid','1~3년'],['exp','3년 이상'],['pro','전문 브리더']];
const REGIONS=['','서울','부산','대구','인천','광주','대전','울산','세종','경기','강원',
               '충북','충남','전북','전남','경북','경남','제주','해외'];
const PURPOSE=[['','선택 안 함'],['hobby','취미 사육'],['breed','브리딩'],['shop','분양샵·업체'],['study','학습·연구']];

function extraHTML(p){
  p=p||{}; const keep=p.keep_species||[];
  const opt=(list,cur)=>list.map(x=>{
    const v=Array.isArray(x)?x[0]:x, t=Array.isArray(x)?x[1]:(x||'선택 안 함');
    return '<option value="'+esc(v)+'"'+((cur||'')===v?' selected':'')+'>'+esc(t)+'</option>'; }).join('');
  return '<div class="consent" id="extraBox">'
    +'<div style="font-size:13px;font-weight:800;padding:2px 2px 4px">알려주시면 도움이 되는 정보 <span class="opt">[선택]</span></div>'
    +'<div class="cNote" style="margin:0 0 8px">모두 비워두셔도 됩니다. 계산기 기본값을 맞추고 어떤 기능을 먼저 만들지 정하는 데만 씁니다.</div>'
    +'<label class="fl">주로 키우는 종 (복수 선택)</label>'
    +'<div class="tokgrid2">'+SPECIES.map((x,i)=>
       '<label class="cRow" style="padding:4px 2px"><input type="checkbox" class="xSp" value="'+esc(x)+'"'
       +(keep.indexOf(x)>=0?' checked':'')+'><span>'+esc(x)+'</span></label>').join('')+'</div>'
    +'<label class="fl" style="margin-top:8px">사육 경력</label>'
    +'<select class="in" id="xExp" style="margin-bottom:8px">'+opt(EXPERIENCE,p.experience)+'</select>'
    +'<label class="fl">활동 지역 <span class="opt">시·도만</span></label>'
    +'<select class="in" id="xReg" style="margin-bottom:8px">'+opt(REGIONS,p.region)+'</select>'
    +'<label class="fl">이용 목적</label>'
    +'<select class="in" id="xPur" style="margin-bottom:8px">'+opt(PURPOSE,p.purpose)+'</select>'
    +'<label class="fl">하고 싶은 말</label>'
    +'<textarea class="in" id="xNote" rows="2" placeholder="바라는 기능, 잘못된 정보 제보 등 (선택)" style="margin-bottom:0;resize:vertical">'+esc(p.note||'')+'</textarea>'
    +'</div>';
}
function extraValues(){
  const g=id=>{ const el=$(id); return el? el.value.trim() : ''; };
  if(!$('extraBox')) return {};
  return { species:[...document.querySelectorAll('.xSp:checked')].map(e=>e.value),
           experience:g('xExp')||null, region:g('xReg')||null,
           purpose:g('xPur')||null, note:g('xNote')||null };
}

function consentHTML(){
  return '<div class="consent" id="consentBox">'
    +'<label class="cAll"><input type="checkbox" id="cAll"><span>전체 동의</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cTerms"><span><span class="req">[필수]</span>이용약관에 동의합니다<a href="../terms.html#terms" target="_blank">보기</a></span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cPrivacy"><span><span class="req">[필수]</span>개인정보 수집·이용에 동의합니다<a href="../terms.html#privacy" target="_blank">보기</a></span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cAge"><span><span class="req">[필수]</span>만 14세 이상입니다</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cThird"><span><span class="opt">[선택]</span>개인정보 제3자 제공에 동의합니다<a href="../terms.html#privacy" target="_blank">보기</a></span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cMailAd"><span><span class="opt">[선택]</span>이메일로 이벤트·혜택 정보를 받겠습니다</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cSms"><span><span class="opt">[선택]</span>문자로 이벤트·혜택 정보를 받겠습니다</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cAi"><span><span class="opt">[선택]</span>등록한 사진·개체 정보를 <b>AI 모델 학습</b>에 이용하는 것에 동의합니다'
      +'<a href="../terms.html#terms" target="_blank">약관 제9조 ③</a>'
      +'<br><span style="font-size:11px;color:var(--ink2)">동의하지 않아도 모든 기능을 그대로 쓸 수 있어요. 언제든 해제할 수 있지만, <b>이미 학습이 끝난 모델은 되돌릴 수 없습니다.</b></span></span></label>'
    +'<div id="phoneWrap" style="display:none;margin-top:8px"><input class="in" id="cPhone" type="tel" placeholder="휴대전화번호 (예: 010-1234-5678)" style="margin-bottom:0"></div>'
    +'<div class="cNote">선택 항목에 동의하지 않아도 서비스를 이용할 수 있어요. 동의는 계정 화면에서 언제든 철회할 수 있습니다.</div>'
    +'</div>';
}
function wireConsent(){
  const all=$('cAll'); if(!all) return;
  const items=[...document.querySelectorAll('.cItem')];
  all.onchange=()=>{ items.forEach(i=>i.checked=all.checked); togglePhone(); };
  items.forEach(i=>i.onchange=()=>{ all.checked=items.every(x=>x.checked); togglePhone(); });
  function togglePhone(){ const w=$('phoneWrap'); if(w) w.style.display=$('cSms').checked?'block':'none'; }
}
// 기본정보 (선택 수집) — 동의 화면과 함께 노출
function profileHTML(p){
  p=p||{};
  return '<div class="consent" id="profBox">'
    +'<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">기본 정보 <span class="opt">[선택]</span></div>'
    +'<input class="in" id="pName" placeholder="이름 (선택)" value="'+esc(p.name||'')+'" style="margin-bottom:8px">'
    +'<input class="in" id="pNick" placeholder="닉네임 (선택 · 커뮤니티 표시명)" value="'+esc(p.nickname||'')+'" style="margin-bottom:0">'
    +'<div class="cNote">입력하지 않아도 가입할 수 있어요. 이벤트 당첨 안내·문의 응대에만 사용하며, 언제든 계정 화면에서 수정·삭제할 수 있습니다.</div>'
    +'</div>';
}
function consentValues(){
  const g=id=>{ const el=$(id); return el? el.value.trim() : ''; };
  return { terms:$('cTerms').checked, privacy:$('cPrivacy').checked, age:$('cAge').checked,
           third:$('cThird').checked, mail:$('cMailAd').checked, sms:$('cSms').checked,
           ai:!!($('cAi')&&$('cAi').checked),
           phone:($('cPhone')&&$('cPhone').value.trim())||null,
           name:g('pName')||null, nickname:g('pNick')||null,
           extra:extraValues() };
}
async function saveConsent(c){
  const base={ p_terms:c.terms, p_privacy:c.privacy, p_age14:c.age,
    p_third:c.third, p_mkt_email:c.mail, p_mkt_sms:c.sms, p_phone:c.phone,
    p_nickname:c.nickname||null };
  // 인자가 많은 것부터 시도하고, 서버가 아직 그 인자를 모르면 줄여서 다시 부릅니다.
  // supabase_v14.sql 적용 전에도 가입이 막히지 않게 하기 위한 것입니다.
  const full=Object.assign({p_name:c.name||null, p_ai_train:!!c.ai}, base);
  let r=await SB.rpc('save_consent', full);
  if(r.error && /p_ai_train|does not exist|function .*save_consent/i.test(r.error.message||''))
    r=await SB.rpc('save_consent', Object.assign({p_name:c.name||null}, base));
  if(r.error && /p_name|does not exist|function .*save_consent/i.test(r.error.message||''))
    r=await SB.rpc('save_consent', base);
  if(!r.error && c.extra) await saveExtra(c.extra);
  return r;
}
/* 선택 정보는 profiles 를 직접 고칩니다. 본인 줄만 고칠 수 있게
   supabase_v14.sql 에서 정책을 걸어 두었습니다.
   실패해도 가입 자체는 진행되어야 하므로 오류를 삼킵니다. */
async function saveExtra(x){
  try{
    const u=(await SB.auth.getUser()).data.user; if(!u) return;
    await SB.from('profiles').update({
      keep_species:(x.species&&x.species.length)?x.species:null,
      experience:x.experience||null, region:x.region||null,
      purpose:x.purpose||null, note:x.note||null
    }).eq('user_id', u.id);
  }catch(e){}
}
// 로그인은 됐지만 동의 기록이 없는 경우 (구글 가입 등) 동의 화면
function renderConsentGate(u){
  $('root').innerHTML='<h2 style="margin:0 0 4px;font-size:17px">서비스 이용 동의</h2>'
    +'<div class="hint">'+esc(u.email||'')+' 계정으로 계속하려면 아래에 동의해 주세요.</div>'
    +profileHTML()+extraHTML()+consentHTML()
    +'<button class="btn" id="go">동의하고 시작하기</button>'
    +'<button class="btn ghost" id="out" style="margin-top:8px">다른 계정으로</button>'
    +'<div class="msg" id="msg"></div>';
  wireConsent();
  $('out').onclick=async()=>{ await SB.auth.signOut(); location.reload(); };
  $('go').onclick=async()=>{
    const c=consentValues(); clearMsg();
    if(!(c.terms&&c.privacy&&c.age)) return say('e','필수 항목에 모두 동의해 주세요.');
    if(c.sms&&!c.phone) return say('e','문자 수신에 동의하셨어요. 휴대전화번호를 입력해 주세요.');
    $('go').disabled=true;
    const r=await saveConsent(c); $('go').disabled=false;
    if(r.error) return say('e',err(r.error));
    await claim(); renderMe(u);
  };
}
async function mustChangePw(){
  try{ const r=await SB.rpc('my_consent');
       return !!(r.data && r.data.must_change_password); }
  catch(e){ return false; }
}
async function hasConsent(){
  try{ const r=await SB.rpc('my_consent'); return !!(r.data && r.data.agree_terms); }catch(e){ return true; }
}

async function boot(){
  if(!SB){ $('root').innerHTML='<b>백엔드가 설정되지 않았습니다.</b><br><br>gecko-core.js 의 SUPABASE_URL / SUPABASE_ANON 을 채워주세요.'; return; }
  // 비밀번호 재설정 메일로 들어온 경우
  const h=location.hash||''; if(h.indexOf('type=recovery')>=0){ MODE='newpw'; render(); return; }
  const s=await SB.auth.getSession();
  if(s.data.session){
    const u=s.data.session.user;
    /* 임시 비밀번호로 들어온 경우 다른 화면보다 먼저 변경을 요구합니다. */
    if(await mustChangePw()) return renderNewPw(true);
    if(await hasConsent()) return renderMe(u);
    return renderConsentGate(u);
  }
  render();
}

function render(){
  if(MODE==='newpw') return renderNewPw();
  if(MODE==='reset') return renderReset();
  const isUp = MODE==='signup';
  $('root').innerHTML=
    '<div class="seg"><button id="tLogin" class="'+(isUp?'':'on')+'">로그인</button>'
    +'<button id="tSignup" class="'+(isUp?'on':'')+'">회원가입</button></div>'
    +'<button class="gbtn" id="google">'+GOOGLE_SVG+' Google로 '+(isUp?'가입':'로그인')+'</button>'
    +'<div class="divider">또는 이메일로</div>'
    +'<label class="fl">이메일</label><input class="in" id="email" type="email" autocomplete="email" placeholder="you@example.com">'
    +(isUp? '<div class="hint" style="margin:-6px 0 12px 2px">⚠️ <b>실제로 사용하는 이메일 주소로 가입해 주세요.</b> 가입 확인 메일이 발송되고, 비밀번호를 잊으셨을 때 이 주소로만 임시 비밀번호를 보내드릴 수 있습니다. 받을 수 없는 주소로 가입하시면 계정을 되찾을 방법이 없습니다.</div>' : '')
    +'<label class="fl">비밀번호</label><input class="in" id="pw" type="password" autocomplete="'+(isUp?'new-password':'current-password')+'" placeholder="'+(isUp?'8자 이상 · 특수문자 포함':'비밀번호')+'">'
    +(isUp? '<label class="fl">비밀번호 확인</label><input class="in" id="pw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력">' : '')
    +(isUp? profileHTML()+extraHTML()+consentHTML() : '')
    +capHTML()
    +'<button class="btn" id="go">'+(isUp?'가입하기':'로그인')+'</button>'
    +'<div class="msg" id="msg"></div>'
    +(isUp? '' : '<div class="sub"><a id="toReset">비밀번호를 잊으셨나요?</a></div>')
    +'<div class="why"><b>왜 로그인이 필요한가요?</b><br>프리미엄 코드를 계정에 연결하면 <b>휴대폰·PC 어디서든</b> 이용할 수 있어요. 등록한 개체·페어링 기록도 계정에 저장돼 기기를 바꿔도 유지됩니다.</div>';
  $('tLogin').onclick=()=>{ MODE='login'; render(); };
  $('tSignup').onclick=()=>{ MODE='signup'; render(); };
  const rs=$('toReset'); if(rs) rs.onclick=()=>{ MODE='reset'; render(); };
  if(isUp) wireConsent();
  capMount();
  $('google').onclick=isUp? doGoogleSignup : doGoogle;
  $('go').onclick=isUp? doSignup : doLogin;
  ['email','pw','pw2'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); }); });
}

/* 비밀번호 재설정 — 자동 메일이 아니라 운영자가 직접 처리합니다.
   요청만 남기고, 운영자가 관리자 화면에서 임시 비밀번호를 발급해
   회원 이메일로 보내줍니다. */
function renderReset(){
  $('root').innerHTML='<h2 style="margin:0 0 6px;font-size:17px">비밀번호 찾기</h2>'
    +'<div class="hint">가입하신 이메일 주소를 알려주시면, 운영자가 확인 후 <b>임시 비밀번호</b>를 그 주소로 보내드립니다.</div>'
    +'<label class="fl">가입한 이메일</label><input class="in" id="email" type="email" placeholder="you@example.com">'
    +'<label class="fl">남기실 말 (선택)</label>'
    +'<input class="in" id="note" placeholder="예: 가입일, 닉네임 등 확인에 도움이 되는 정보">'
    +'<button class="btn" id="go">임시 비밀번호 요청</button>'
    +'<button class="btn ghost" id="back" style="margin-top:8px">돌아가기</button>'
    +'<div class="msg" id="msg"></div>'
    +'<div class="why"><b>어떻게 진행되나요?</b><br>'
    +'① 요청을 남기시면 운영자가 확인합니다.<br>'
    +'② <b>가입하실 때 쓰신 이메일 주소로</b> 임시 비밀번호를 보내드립니다.<br>'
    +'③ 임시 비밀번호로 로그인하시면 바로 새 비밀번호를 정하는 화면이 나옵니다.<br><br>'
    +'사람이 직접 확인하고 보내드리기 때문에 <b>시간이 걸릴 수 있습니다.</b> '
    +'급하시면 '+CR_MAIL_LINK+' 로 함께 연락 주세요.</div>';
  $('back').onclick=()=>{ MODE='login'; render(); };
  $('go').onclick=async()=>{
    const em=$('email').value.trim(); clearMsg();
    if(!validEmail(em)) return say('e','이메일 형식을 확인해 주세요.');
    $('go').disabled=true; $('go').textContent='보내는 중…';
    let ok=false;
    try{
      const r=await SB.rpc('request_password_reset',{p_email:em,p_note:$('note').value.trim()||null});
      ok = !r.error;
    }catch(e){}
    $('go').disabled=false; $('go').textContent='임시 비밀번호 요청';
    /* 가입 여부를 알려주지 않습니다. 알려주면 남의 가입 여부를 확인하는
       수단이 됩니다. 가입되지 않은 주소여도 같은 안내가 나갑니다. */
    if(ok) say('o','요청을 접수했어요.<br>가입된 주소라면 <b>'+esc(em)+'</b> 으로 임시 비밀번호를 보내드립니다.<br>메일이 안 보이면 <b>스팸함</b>도 확인해 주세요.');
    else   say('e','요청을 보내지 못했어요. 잠시 후 다시 시도해 주세요.');
  };
}

/* forced=true 면 '나중에' 없이 변경만 가능합니다.
   임시 비밀번호는 운영자와 메일에 남아 있으므로 계속 쓰면 안 됩니다. */
function renderNewPw(forced){
  $('root').innerHTML='<h2 style="margin:0 0 6px;font-size:17px">'+(forced?'새 비밀번호를 정해 주세요':'새 비밀번호 설정')+'</h2>'
    +(forced? '<div class="hint">임시 비밀번호로 로그인하셨어요. <b>안전을 위해 지금 새 비밀번호로 바꿔 주세요.</b> 임시 비밀번호는 메일에 남아 있어 계속 쓰시면 위험합니다.</div>' : '')
    +'<label class="fl">새 비밀번호</label><input class="in" id="pw" type="password" placeholder="8자 이상 · 특수문자 포함">'
    +'<label class="fl">비밀번호 확인</label><input class="in" id="pw2" type="password" placeholder="한 번 더 입력">'
    +'<button class="btn" id="go">변경하기</button><div class="msg" id="msg"></div>';
  $('go').onclick=async()=>{
    const a=$('pw').value, b=$('pw2').value; clearMsg();
    { const p=pwProblem(a); if(p) return say('e',p); }
    if(a!==b) return say('e','비밀번호가 서로 달라요.');
    $('go').disabled=true;
    const r=await SB.auth.updateUser({password:a});
    $('go').disabled=false;
    if(r.error) return say('e',err(r.error));
    try{ await SB.rpc('clear_must_change'); }catch(e){}
    say('o','변경되었어요! 잠시 후 이동합니다.');
    setTimeout(()=>{ location.href='login.html'; },1200);
  };
}

      +'<br><span style="font-size:11px;color:var(--ink2)">해제하면 이후 학습에서 제외하고 원본은 삭제합니다. 다만 <b>이미 학습이 끝난 모델은 되돌릴 수 없습니다.</b></span></span></label>'
    +(c.ai_at? '<div class="cNote" style="margin-top:2px">AI 학습 동의 '+new Date(c.ai_at).toLocaleDateString('ko-KR')+'</div>' : '')

  sItems.forEach(i=>i.onchange=()=>{ syncAll(); togglePhone(); });
  function togglePhone(){ $('sPhoneWrap').style.display=$('sSms').checked?'block':'none'; }
  syncAll();

  $('sSave').onclick=async()=>{
    if($('sSms').checked && !$('sPhone').value.trim()) return say('e','문자 수신을 위해 휴대전화번호를 입력해 주세요.');
    $('sSave').disabled=true;
    const r=await saveConsent({terms:true,privacy:true,age:true,third:$('sThird').checked,
      mail:$('sMail').checked, sms:$('sSms').checked, ai:$('sAi').checked,
      phone:$('sPhone').value.trim()||null,
      name:$('iName').value.trim()||null, nickname:$('iNick').value.trim()||null,
      extra:extraValues()});
    $('sSave').disabled=false;
    if(r.error) say('e',err(r.error)); else say('o','저장되었어요.');
  };

  // 비밀번호 변경 — 지금 로그인한 본인만 바꿀 수 있습니다.
  // 현재 비밀번호를 다시 묻지 않는 것은 이미 로그인된 세션이기 때문입니다.
  const pwbox=document.createElement('div');
  pwbox.className='consent'; pwbox.style.marginTop='12px';
  pwbox.innerHTML='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">비밀번호 변경</div>'
    +'<input class="in" id="npw" type="password" autocomplete="new-password" placeholder="새 비밀번호 (8자 이상 · 특수문자 포함)" style="margin-bottom:8px">'
    +'<input class="in" id="npw2" type="password" autocomplete="new-password" placeholder="한 번 더 입력" style="margin-bottom:0">'
    +'<button class="btn ghost" id="npwSave" style="margin-top:10px">비밀번호 변경</button>'
    +'<div class="cNote">구글 계정으로만 로그인하신다면 비밀번호를 정하지 않아도 됩니다. 정해두시면 두 가지 방법 모두로 로그인할 수 있어요.</div>';
  $('root').appendChild(pwbox);
  $('npwSave').onclick=async()=>{
    const a=$('npw').value, b=$('npw2').value;
    const p=pwProblem(a); if(p) return say('e',p);
    if(a!==b) return say('e','비밀번호가 서로 달라요.');
    $('npwSave').disabled=true;
    const r=await SB.auth.updateUser({password:a});
    $('npwSave').disabled=false;
    if(r.error) return say('e',err(r.error));
    try{ await SB.rpc('clear_must_change'); }catch(e){}
    $('npw').value=''; $('npw2').value='';
    say('o','비밀번호가 변경되었어요.');
  };

  // 연결된 로그인 수단 (docs/AUTH.md 5장)
  await renderIdentities();

  // 회원탈퇴
  const out=document.createElement('div');
  out.style.marginTop='18px'; out.style.textAlign='center';
  out.innerHTML='<a class="quit" id="quitLink">회원탈퇴</a>';
  $('root').appendChild(out);
  $('quitLink').onclick=()=>renderQuit(c);
}

/* ---------- 연결된 로그인 수단 ----------
   설계 근거는 docs/AUTH.md 5장. 핵심 규칙:
   "사용 가능한 로그인 수단"은 소셜 identity 수 + (비밀번호 설정됨 ? 1 : 0) 이며,
   해제 후 1개 이상 남을 때만 해제를 허용한다. identity 개수만 세면 안 된다 —
   구글로만 가입한 계정도 email identity 를 갖지만 비밀번호는 없기 때문. */
const PROVIDERS={
  email:  {ko:'이메일 + 비밀번호', icon:'✉️'},
  google: {ko:'Google',           icon:'🔵'},
  kakao:  {ko:'카카오',            icon:'💛'},
  apple:  {ko:'Apple',            icon:'🍎'},
};
function providerLabel(p){ return (PROVIDERS[p]&&PROVIDERS[p].ko)||p; }
function providerIcon(p){ return (PROVIDERS[p]&&PROVIDERS[p].icon)||'🔑'; }

// 해제 후에도 남는 "사용 가능한" 로그인 수단 개수
function usableCount(list, hasPassword, excludeProvider){
  let n=list.filter(i=>i.provider!=='email' && i.provider!==excludeProvider).length;
  if(hasPassword && excludeProvider!=='email') n++;
  return n;
}

async function renderIdentities(){
  let d=null;
  try{ const r=await SB.rpc('my_identities'); if(r.error) throw r.error; d=r.data; }catch(e){ d=null; }

  const box=document.createElement('div');
  box.className='consent'; box.style.marginTop='12px';

  if(!d){
    box.innerHTML='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">로그인 수단</div>'
      +'<div class="cNote">로그인 수단 정보를 불러오지 못했어요. '
      +'서버에 <b>supabase_setup.sql</b> 의 H) 항목이 적용됐는지 확인해 주세요.</div>';
    $('root').appendChild(box); return;
  }

  const list=d.identities||[], hasPw=!!d.has_password;
  const total=usableCount(list, hasPw, null);

  let h='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">로그인 수단 '
    +'<span class="opt">'+total+'개</span></div>';

  // 이메일+비밀번호는 identity 목록이 아니라 비밀번호 설정 여부로 판단
  const rows=[];
  if(hasPw) rows.push({provider:'email', email:(list.filter(i=>i.provider==='email')[0]||{}).email});
  list.filter(i=>i.provider!=='email').forEach(i=>rows.push(i));

  h+=rows.map(i=>{
    const last = usableCount(list, hasPw, i.provider)===0;
    return '<div class="idrow"><span class="idic">'+providerIcon(i.provider)+'</span>'
      +'<div class="idmain"><b>'+esc(providerLabel(i.provider))+'</b>'
      +(i.email? '<div class="idsub">'+esc(i.email)+'</div>':'')
      +'</div>'
      +(last? '<span class="idlast">유일한 수단</span>'
            : '<button class="mini" data-unlink="'+esc(i.provider)+'">해제</button>')
      +'</div>'; }).join('');

  h+='<div class="cNote">로그인 수단을 여러 개 연결해 두면 하나를 못 쓰게 돼도 계정에 들어올 수 있어요. '
    +'<b>마지막 하나는 해제할 수 없습니다.</b></div>';

  // 아직 연결하지 않은 provider 안내 (연동 UI 는 다음 단계에서 구현)
  const linked=new Set(rows.map(i=>i.provider));
  const missing=Object.keys(PROVIDERS).filter(p=>!linked.has(p) && p!=='kakao' && p!=='apple');
  if(missing.length) h+='<div class="cNote" style="border-top:none;padding-top:0">'
    +'아직 연결하지 않음: '+missing.map(p=>esc(providerLabel(p))).join(', ')
    +' <span class="opt">(연결 기능 준비 중)</span></div>';

  box.innerHTML=h;
  $('root').appendChild(box);

  box.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>{
    const p=b.dataset.unlink;
    if(usableCount(list, hasPw, p)===0)
      return say('e','이 계정의 유일한 로그인 방법이에요. 다른 방법을 먼저 추가해 주세요.');
    say('e','로그인 수단 해제 기능은 준비 중이에요. '
      +'지금 필요하시면 kmc612000@gmail.com 으로 요청해 주세요.');
  });
}

/* ---------- 회원탈퇴 ---------- */

    +'<li>마케팅 수신 동의 및 제3자 제공 동의</li></ul></div>'

    +'<div class="quitbox"><b>법령에 따라 보관되는 정보</b>'
    +'<ul><li><b>약관·개인정보 동의 기록 — 탈퇴 후 5년</b><br>'
    +'<span class="qsub">전자상거래법상 계약·청약철회 기록 보존 의무. 이름·이메일 등 신원정보는 삭제하고 <b>동의 사실과 일시만</b> 남깁니다.</span></li>'

    +'<span class="qsub">통신비밀보호법상 보존 의무. 개인을 식별할 수 없는 형태로만 남습니다.</span></li></ul>'
    +'<div class="qsub" style="margin-top:8px">자세한 내용은 <a href="../terms.html#privacy" target="_blank">개인정보처리방침</a>에서 확인하실 수 있어요.</div></div>'

    +'<div class="quitbox"><b>프리미엄을 이용 중이라면</b>'
    +'<div class="qsub">탈퇴 시 남은 이용 기간은 <b>환불되지 않으며</b>, 사용한 코드는 다시 사용할 수 없습니다. 잠시 쉬어가는 것이라면 탈퇴 대신 로그아웃을 권해드려요.</div></div>'

    +'<label class="cRow" style="margin-top:14px"><input type="checkbox" id="qAgree">'
    +'<span>위 내용을 모두 확인했으며, 데이터가 삭제되는 것에 동의합니다.</span></label>'

    +'<div class="fl" style="margin-top:10px">확인을 위해 가입 이메일을 입력해 주세요</div>'

          +'<br><br>계속 실패하면 kmc612000@gmail.com 으로 연락 주시면 직접 처리해 드릴게요.');

}

async function doGoogle(){
  clearMsg();
  const r=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});
  if(r.error) say('e',err(r.error));
}
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function doLogin(){
  const em=$('email').value.trim(), pw=$('pw').value; clearMsg();
  if(!validEmail(em)) return say('e','이메일 형식을 확인해 주세요.');
  if(!pw) return say('e','비밀번호를 입력해 주세요.');
  $('go').disabled=true; $('go').textContent='로그인 중…';
  const r=await SB.auth.signInWithPassword(capOpts({email:em,password:pw}));
  if(r.error) capReset();
  $('go').disabled=false; $('go').textContent='로그인';
  if(r.error) return say('e',err(r.error));
  await flushPendingConsent(); await claim();
  if(await mustChangePw()) return renderNewPw(true);
  if(await hasConsent()) renderMe(r.data.user); else renderConsentGate(r.data.user);
}

/* 비밀번호 규칙: 8자 이상 + 특수문자 1개 이상.
   여기 검사는 안내용입니다. 화면 검사는 우회할 수 있으므로 실제 강제는
   Supabase 대시보드에서 같이 걸어야 합니다:
   Authentication → Providers → Email → Minimum password length = 8,
   Required characters = 특수문자 포함 조합. 한쪽만 바꾸면 안내와 실제
   기준이 어긋나 사용자가 영문 오류를 그대로 보게 됩니다. */
function pwProblem(pw){
  if(pw.length<8) return '비밀번호는 8자 이상이어야 해요.';
  if(!/[^A-Za-z0-9]/.test(pw)) return '비밀번호에 특수문자(@, !, # 등)를 하나 이상 넣어 주세요.';
  return null;
}

async function doSignup(){
  const em=$('email').value.trim(), pw=$('pw').value, pw2=$('pw2').value; clearMsg();
  const c=consentValues();
  if(!validEmail(em)) return say('e','이메일 형식을 확인해 주세요.');
  { const p=pwProblem(pw); if(p) return say('e',p); }
  if(pw!==pw2) return say('e','비밀번호가 서로 달라요.');
  if(!(c.terms&&c.privacy&&c.age)) return say('e','필수 항목([필수] 표시)에 모두 동의해 주세요.');
  if(c.sms&&!c.phone) return say('e','문자 수신에 동의하셨어요. 휴대전화번호를 입력해 주세요.');
  $('go').disabled=true; $('go').textContent='가입 중…';
  const r=await SB.auth.signUp(capOpts({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}}));
  if(r.error) capReset();
  $('go').disabled=false; $('go').textContent='가입하기';
  if(r.error) return say('e',err(r.error));
  if(r.data.session){ await saveConsent(c); await claim(); return renderMe(r.data.user); }
  try{ sessionStorage.setItem('leoConsent', JSON.stringify(c)); }catch(e){}
  say('o','가입 확인 메일을 보냈어요. 메일의 링크를 누르면 가입이 완료됩니다.<br>메일이 안 보이면 <b>스팸함</b>도 확인해 주세요.');
}
// 구글 가입: 동의 먼저 받고 진행
async function doGoogleSignup(){
  const c=consentValues(); clearMsg();
  if(!(c.terms&&c.privacy&&c.age)) return say('e','필수 항목에 동의하신 뒤 진행해 주세요.');
  try{ sessionStorage.setItem('leoConsent', JSON.stringify(c)); }catch(e){}
  doGoogle();
}

// 기기에 있던 코드·데이터를 계정으로 이관
async function flushPendingConsent(){
  try{ const raw=sessionStorage.getItem('leoConsent'); if(!raw) return;
    const c=JSON.parse(raw); const r=await saveConsent(c);
    if(!r.error) sessionStorage.removeItem('leoConsent');
  }catch(e){}
}
async function claim(){
  try{ const s=await SB.auth.getSession(); const u=s.data.session&&s.data.session.user;
    if(u) await SB.rpc('claim_device',{p_device:devId(), p_user:'u_'+u.id});
  }catch(e){}
}

if(SB) SB.auth.onAuthStateChange(async (ev,sess)=>{
  if(ev==='SIGNED_IN' && sess){ await flushPendingConsent(); await claim();
    if(await hasConsent()) renderMe(sess.user); else renderConsentGate(sess.user); }
  if(ev==='PASSWORD_RECOVERY'){ MODE='newpw'; render(); }
});
boot();
</script>
