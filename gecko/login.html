<style>

      --hair:rgba(255,255,255,.08); --chipbd:rgba(255,255,255,.18);
      --teal:#3FB8B2; --teal2:#57C8C2; --eggplant:#B9A3D6;
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 8px 26px rgba(0,0,0,.3);
      --err:#F3A594; --errbg:#2E1713; --errbd:#6E2E22;
      --ok:#7FD8D2; --okbg:#12231F; --okbd:#2C4A45; }
  }
  *{box-sizing:border-box} html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);line-height:1.55;min-height:100vh;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
  header{padding:22px 16px 6px;text-align:center;position:relative}
  .back{position:absolute;left:14px;top:22px;color:var(--teal);text-decoration:none;font-weight:700;font-size:13.5px}
  .langpick{position:absolute;right:14px;top:16px;display:inline-flex;align-items:center;gap:5px;
    min-height:34px;padding:0 10px;border:1px solid var(--hair);border-radius:11px;background:var(--card);
    color:var(--ink);font-size:12px;font-weight:700;box-shadow:var(--shadow)}

  header h1{margin:0;font-size:20px;font-weight:800;letter-spacing:-.4px}
  .wrap{flex:1;width:100%;max-width:400px;margin:0 auto;padding:14px 16px 40px}
  .card{background:var(--card);border-radius:18px;padding:20px;box-shadow:var(--shadow)}
  .seg{display:flex;background:rgba(120,120,128,.14);border-radius:11px;padding:3px;margin-bottom:18px}
  .seg button{flex:1;background:transparent;border:none;padding:9px;border-radius:9px;font-size:14px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}

  .gbtn{width:100%;display:flex;align-items:center;justify-content:center;gap:9px;background:#fff;color:#1f1f1f;
    border:1px solid #dadce0;border-radius:12px;padding:13px;font-size:14.5px;font-weight:600;cursor:pointer;font-family:inherit}
  .gbtn:active{background:#f5f5f5}

  .divider{display:flex;align-items:center;gap:10px;color:var(--ink2);font-size:11.5px;margin:16px 0}
  .divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--hair)}
  label.fl{display:block;font-size:12px;font-weight:700;color:var(--ink2);margin:0 0 5px 2px}
  .in{width:100%;padding:12px 13px;border:1.5px solid var(--chipbd);border-radius:11px;background:var(--card2);

  .btn{width:100%;background:var(--teal);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15.5px;

  .me{text-align:center}
  .me .av{width:64px;height:64px;border-radius:50%;background:var(--teal);color:#fff;display:flex;align-items:center;
    justify-content:center;font-size:26px;font-weight:800;margin:0 auto 12px}

  .badge.pro{background:rgba(234,195,106,.25);color:#9A6A12}
  .badge.free{background:rgba(120,120,128,.18);color:var(--ink2)}
  .links{display:flex;flex-direction:column;gap:8px;margin-top:18px}
  .links a{display:block;text-align:center;background:var(--card2);color:var(--ink);text-decoration:none;
    border-radius:11px;padding:12px;font-size:14px;font-weight:700}
  /* 가입 갈래. 로그인/가입 전환(.seg)과 같은 성격의 선택이라 비슷한 모양으로
     두었습니다. 라디오 대신 버튼인 것은, 고른 쪽에 따라 아래 칸이 늘고 줄기
     때문입니다 — 누르면 화면이 바뀐다는 것이 버튼 쪽이 더 잘 읽힙니다. */
  .jkbar{display:flex;gap:7px;margin:0 0 10px}
  .jkbar .jk{flex:1;background:var(--card2);border:1.5px solid transparent;border-radius:11px;
    padding:11px 8px;font-size:13.5px;font-weight:700;color:var(--ink);cursor:pointer;font-family:inherit}
  .jkbar .jk.on{border-color:var(--teal);color:var(--teal);background:var(--card)}
.consent{background:var(--card2);border-radius:12px;padding:12px 13px;margin:6px 0 12px}
  .cAll{display:flex;align-items:center;gap:9px;font-size:14.5px;font-weight:800;padding:4px 2px 10px;border-bottom:1px solid var(--hair);margin-bottom:6px;cursor:pointer}
  .cRow{display:flex;align-items:flex-start;gap:9px;font-size:13px;padding:6px 2px;cursor:pointer}
  .cRow input,.cAll input{width:18px;height:18px;accent-color:var(--teal);flex:0 0 auto;margin-top:1px}
  .cRow .req{color:var(--teal);font-weight:800;font-size:11.5px;margin-right:3px}
  .cRow .opt{color:var(--ink2);font-weight:700;font-size:11.5px;margin-right:3px}
  .cRow a{color:var(--ink2);text-decoration:underline;font-size:11.5px;margin-left:4px}
  .cNote{font-size:11px;color:var(--ink2);line-height:1.6;margin-top:8px;padding-top:8px;border-top:1px solid var(--hair)}
  .why{background:var(--card2);border-radius:12px;padding:13px;font-size:12.5px;color:var(--ink2);line-height:1.65;margin-top:16px}
  .why b{color:var(--ink)}
  .beta-notice{margin-bottom:16px;padding:12px 13px;border:1px solid var(--okbd);border-radius:12px;
    background:var(--okbg);color:var(--ok);font-size:12px;line-height:1.6}
  .beta-notice b{display:block;margin-bottom:2px;font-size:13px;color:var(--ink)}
  /* 로그인 수단 목록 */
  .idrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--hair)}
  .idrow:last-of-type{border-bottom:none}
  .idic{flex:0 0 22px;font-size:15px;text-align:center}
  .idmain{flex:1;min-width:0}
  .idmain b{font-size:13px;font-weight:700}
  .idsub{color:var(--ink2);font-size:11px;margin-top:1px;word-break:break-all}

  .idrow .mini{flex:0 0 auto;background:var(--card);border:1px solid var(--hair);color:var(--ink);
    border-radius:8px;padding:5px 11px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit}
  /* 회원탈퇴 */
  .tokgrid2{display:grid;grid-template-columns:1fr 1fr;gap:0 8px;margin-bottom:4px}
  .tokgrid2 .cRow{font-size:12.5px}
  .quit{display:inline-block;color:var(--ink2);font-size:12px;text-decoration:underline;cursor:pointer;padding:6px}

  .quitbox b{color:var(--ink);display:block;margin-bottom:4px;font-size:13px}

<script>window.LoginI18n.apply(document);</script>

<script>
const SB = (SUPABASE_URL && window.supabase) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON) : null;
const LoginLocale = window.LoginI18n;
const t = LoginLocale.t;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let MODE='login';   // login | signup | reset | newpw
let ACCOUNT_RENDER=0;

function devId(){ try{ let d=localStorage.getItem('leoDevice'); if(!d){ d='dev_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36); localStorage.setItem('leoDevice',d);} return d; }catch(e){ return 'dev_anon'; } }
function say(kind,text){ const m=$('msg'); if(!m) return; m.className='msg show '+(kind==='e'?'e':'o'); m.innerHTML=text; }
function clearMsg(){ const m=$('msg'); if(m){ m.className='msg'; m.textContent=''; } }
function err(e){ return esc(LoginLocale.friendly(e)); }
const returnTarget = LoginLocale.safeNextPath();
$('backLink').href = returnTarget || LoginLocale.calculatorUrl();
$('backLink').querySelector('span').textContent = t(returnTarget ? 'back' : 'calculator');
/* ---------- 가입 봇 차단 (Cloudflare Turnstile) ----------
   키가 없으면 모든 함수가 조용히 통과합니다. 지금은 꺼진 상태이고,
   assets/studio-config.js 에 사이트 키를 넣는 순간 켜집니다.
   ⚠️ Supabase 쪽 CAPTCHA 설정도 같이 켜야 실제로 검사가 이뤄집니다.
      화면만 켜면 토큰을 보내도 서버가 확인하지 않습니다. */
const CAP_ON = (typeof TURNSTILE_SITE_KEY==='string') && !!TURNSTILE_SITE_KEY.trim();
let capWidget=null;
function capHTML(){ return CAP_ON ? '<div id="capBox" style="margin:10px 0"></div>' : ''; }
function capMount(){
  if(!CAP_ON || !$('capBox')) return;
  const go=()=>{ try{
      capWidget=turnstile.render('#capBox',{sitekey:TURNSTILE_SITE_KEY,theme:'auto'});
    }catch(e){} };
  if(window.turnstile) go();
  else { let n=0; const t=setInterval(()=>{ if(window.turnstile||++n>50){ clearInterval(t); if(window.turnstile) go(); } },100); }
}
/* 토큰은 1회용입니다. 로그인에 실패하고 다시 누르면 새 토큰을 받아야 합니다. */
function capToken(){
  if(!CAP_ON) return null;
  try{ return turnstile.getResponse(capWidget)||null; }catch(e){ return null; }
}
function capReset(){ if(CAP_ON){ try{ turnstile.reset(capWidget); }catch(e){} } }
function capOpts(o){
  const tk=capToken();
  if(!CAP_ON || !tk) return o;
  o.options=Object.assign({}, o.options, {captchaToken:tk});
  return o;
}

const CR_MAIL_LINK='<a href="mailto:kmc612000@gmail.com">kmc612000@gmail.com</a>';
const GOOGLE_SVG='<svg viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9 3.6l6.7-6.7C35.5 2.6 30.1 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.8 6.1C12.3 13.2 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.7 6.9l7.6 5.9c4.4-4.1 6.8-10.1 6.8-17.3z"/><path fill="#FBBC05" d="M10.4 28.7c-.5-1.4-.8-2.9-.8-4.7s.3-3.3.8-4.7l-7.8-6.1C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.8-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.8 2.3-8.3 2.3-6.3 0-11.7-3.7-13.6-9.8l-7.8 6.1C6.5 42.6 14.6 48 24 48z"/></svg>';

/* 회원이 원할 때만 적는 항목. 가입 화면과 내 정보 화면이 같이 씁니다.
   지역은 시·도까지만 받습니다 — 상세 주소는 이 서비스가 쓸 데가 없고,
   받아두면 유출 시 피해만 커집니다. */
const SPECIES=[['레오파드 게코','speciesLeopard'],['크레스티드 게코','speciesCrested'],['펫테일 게코','speciesFattail'],
  ['기타 파충류','speciesReptile'],['소형 포유류','speciesMammal'],['아직 없음','speciesNone']];
const EXPERIENCE=[['','selectNone'],['new','expNew'],['mid','expMid'],['exp','expExperienced'],['pro','expPro']];
const REGIONS=[['','selectNone'],['서울','regionSeoul'],['부산','regionBusan'],['대구','regionDaegu'],['인천','regionIncheon'],
  ['광주','regionGwangju'],['대전','regionDaejeon'],['울산','regionUlsan'],['세종','regionSejong'],['경기','regionGyeonggi'],
  ['강원','regionGangwon'],['충북','regionChungbuk'],['충남','regionChungnam'],['전북','regionJeonbuk'],['전남','regionJeonnam'],
  ['경북','regionGyeongbuk'],['경남','regionGyeongnam'],['제주','regionJeju'],['해외','regionOverseas']];
const PURPOSE=[['','selectNone'],['hobby','purposeHobby'],['breed','purposeBreed'],['shop','purposeShop'],['study','purposeStudy']];

function extraHTML(p){
  p=p||{}; const keep=p.keep_species||[];
  const opt=(list,cur)=>list.map(x=>{
    const v=x[0], label=t(x[1]);
    return '<option value="'+esc(v)+'"'+((cur||'')===v?' selected':'')+'>'+esc(label)+'</option>'; }).join('');
  return '<div class="consent" id="extraBox">'
    +'<div style="font-size:13px;font-weight:800;padding:2px 2px 4px">'+t('extraTitle')+' <span class="opt">'+t('optional')+'</span></div>'
    +'<div class="cNote" style="margin:0 0 8px">'+t('extraNote')+'</div>'
    +'<label class="fl">'+t('keepSpecies')+'</label>'
    +'<div class="tokgrid2">'+SPECIES.map((x,i)=>
       '<label class="cRow" style="padding:4px 2px"><input type="checkbox" class="xSp" value="'+esc(x[0])+'"'
       +(keep.indexOf(x[0])>=0?' checked':'')+'><span>'+esc(t(x[1]))+'</span></label>').join('')+'</div>'
    +'<label class="fl" style="margin-top:8px">'+t('experience')+'</label>'
    +'<select class="in" id="xExp" style="margin-bottom:8px">'+opt(EXPERIENCE,p.experience)+'</select>'
    +'<label class="fl">'+t('region')+' <span class="opt">'+t('provinceOnly')+'</span></label>'
    +'<select class="in" id="xReg" style="margin-bottom:8px">'+opt(REGIONS,p.region)+'</select>'
    +'<label class="fl">'+t('purpose')+'</label>'
    +'<select class="in" id="xPur" style="margin-bottom:8px">'+opt(PURPOSE,p.purpose)+'</select>'
    +'</div>';
}
function extraValues(){
  const g=id=>{ const el=$(id); return el? el.value.trim() : ''; };
  if(!$('extraBox')) return {};
  return { species:[...document.querySelectorAll('.xSp:checked')].map(e=>e.value),
           experience:g('xExp')||null, region:g('xReg')||null,
           purpose:g('xPur')||null };
}

function consentHTML(){
  return '<div class="consent" id="consentBox">'
    +'<label class="cAll"><input type="checkbox" id="cAll"><span>'+t('consentAll')+'</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cTerms"><span><span class="req">'+t('required')+'</span>'+t('termsConsent')+'<a href="../terms.html#terms" target="_blank">'+t('view')+'</a></span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cPrivacy"><span><span class="req">'+t('required')+'</span>'+t('privacyConsent')+'<a href="../terms.html#privacy" target="_blank">'+t('view')+'</a></span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cAge"><span><span class="req">'+t('required')+'</span>'+t('ageConsent')+'</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cThird"><span><span class="opt">'+t('optional')+'</span>'+t('thirdConsent')+'<a href="../terms.html#privacy" target="_blank">'+t('view')+'</a></span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cMailAd"><span><span class="opt">'+t('optional')+'</span>'+t('mailConsent')+'</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cSms"><span><span class="opt">'+t('optional')+'</span>'+t('smsConsent')+'</span></label>'
    +'<label class="cRow"><input type="checkbox" class="cItem" id="cAi"><span><span class="opt">'+t('optional')+'</span>'+t('aiConsent')
      +'<a href="../terms.html#terms" target="_blank">'+t('aiTerms')+'</a>'
      +'<br><span style="font-size:11px;color:var(--ink2)">'+t('aiConsentNote')+'</span></span></label>'
    +'<div id="phoneWrap" style="display:none;margin-top:8px"><input class="in" id="cPhone" type="tel" placeholder="'+esc(t('phonePlaceholder'))+'" style="margin-bottom:0"></div>'
    +'<div class="cNote">'+t('optionalConsentNote')+'</div>'

}
function wireConsent(){
  const all=$('cAll'); if(!all) return;
  const items=[...document.querySelectorAll('.cItem')];
  all.onchange=()=>{ items.forEach(i=>i.checked=all.checked); togglePhone(); };
  items.forEach(i=>i.onchange=()=>{ all.checked=items.every(x=>x.checked); togglePhone(); });
  function togglePhone(){ const w=$('phoneWrap'); if(w) w.style.display=$('cSms').checked?'block':'none'; }
}
/* 가입 갈래. 사업자는 가입할 때부터 상호명과 등록번호를 냅니다.
   계정은 바로 만들어지고 무료 회원으로 쓸 수 있으며, 관리자가 승인해야
   인증 표시와 로고가 붙습니다(supabase_v61). 승인 전이라고 못 들어오게
   막으면, 승인까지 며칠 걸리는 동안 아무것도 못 하게 됩니다. */
let JOIN_KIND='personal';   // personal | business

function joinKindHTML(){
  const tab=(k,label)=>'<button type="button" class="jk'+(JOIN_KIND===k?' on':'')
    +'" data-jk="'+k+'">'+esc(label)+'</button>';
  return '<div class="jkbar" role="group" aria-label="'+esc(t('joinKind'))+'">'
    + tab('personal', t('joinPersonal')) + tab('business', t('joinBusiness')) + '</div>'
    + '<div class="hint" style="margin:-4px 0 12px 2px">'
    + t(JOIN_KIND==='business'?'joinBusinessHint':'joinPersonalHint') + '</div>';
}

function bizSignupHTML(){
  if(JOIN_KIND!=='business') return '';
  return '<div class="consent" id="bizBox">'
    +'<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('bizTitle')
      +' <span class="opt">'+t('required')+'</span></div>'
    +'<input class="in" id="jName" placeholder="'+esc(t('bizName'))+'" style="margin-bottom:8px">'
    +'<input class="in" id="jNum" inputmode="numeric" placeholder="'+esc(t('bizNumber'))+'" style="margin-bottom:0">'
    +'<div class="cNote">'+t('joinBizNote')+'</div></div>';
}

// 기본정보 (선택 수집) — 동의 화면과 함께 노출
function profileHTML(p){
  p=p||{};
  return '<div class="consent" id="profBox">'
    +'<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('profileTitle')+' <span class="opt">'+t('optional')+'</span></div>'
    +'<input class="in" id="pName" placeholder="'+esc(t('nameOptional'))+'" value="'+esc(p.name||'')+'" style="margin-bottom:8px">'
    +'<input class="in" id="pNick" placeholder="'+esc(t('nicknameRequired'))+'" value="'+esc(p.nickname||'')+'" style="margin-bottom:0">'
    +'<div class="cNote">'+t('profileSignupNote')+'</div>'
    +'</div>';
}
function consentValues(){
  const g=id=>{ const el=$(id); return el? el.value.trim() : ''; };
  return { terms:$('cTerms').checked, privacy:$('cPrivacy').checked, age:$('cAge').checked,
           third:$('cThird').checked, mail:$('cMailAd').checked, sms:$('cSms').checked,
           ai:!!($('cAi')&&$('cAi').checked),
           phone:($('cPhone')&&$('cPhone').value.trim())||null,
           name:g('pName')||null, nickname:g('pNick')||null,
           joinKind:JOIN_KIND, bizName:g('jName')||null, bizNumber:g('jNum')||null,
           extra:extraValues() };
}
/* 화면에서 미리 거르는 것들. 서버(supabase_v61)가 최종 판단을 하지만, 가입은
   되돌리기 번거로운 동작이라 보내기 전에 알려 주는 편이 낫습니다.

   허용 글자는 서버와 같은 목록입니다. 두 곳이 갈라지면 화면은 통과시키고
   서버가 막는, 설명할 수 없는 상태가 됩니다. */
const PLAIN_NAME = /^[A-Za-z0-9가-힣ㄱ-ㅎㅏ-ㅣぁ-ゖァ-ヺー一-鿿 ._-]+$/;
function joinProblem(c){
  if(c.name && !PLAIN_NAME.test(c.name)) return t('nameCharset');
  if(c.nickname && !PLAIN_NAME.test(c.nickname)) return t('nickCharset');
  if(c.joinKind==='business'){
    if(!c.bizName) return t('bizNameNeeded');
    if(String(c.bizNumber||'').replace(/[^0-9]/g,'').length!==10) return t('bizNumberInvalid');
  }
  return null;
}

/* 가입 직후 사업자 신청을 함께 냅니다. 계정은 이미 만들어졌고 무료로 쓸 수
   있으므로, 신청이 실패해도 가입 자체를 되돌리지는 않습니다 — 계정 화면에서
   다시 낼 수 있습니다. */
async function submitJoinBusiness(c){
  if(c.joinKind!=='business' || !c.bizName) return;
  try{ await SB.rpc('apply_business_verification',
    {p_name:c.bizName, p_number:c.bizNumber, p_logo:null}); }
  catch(e){ /* 계정 화면에서 다시 낼 수 있습니다 */ }
}

async function saveConsent(c){
  const base={ p_terms:c.terms, p_privacy:c.privacy, p_age14:c.age,
    p_third:c.third, p_mkt_email:c.mail, p_mkt_sms:c.sms, p_phone:c.phone,
    p_nickname:c.nickname||null };
  // 인자가 많은 것부터 시도하고, 서버가 아직 그 인자를 모르면 줄여서 다시 부릅니다.
  // supabase_v14.sql 적용 전에도 가입이 막히지 않게 하기 위한 것입니다.
  /* null 은 '건드리지 않음' 입니다. 계정 화면에서 닉네임을 지운 경우는
     set_my_nickname 이 따로 처리하므로 여기로는 null 이 옵니다. */
  const full=Object.assign({p_name:c.name||null, p_ai_train:!!c.ai}, base);
  let r=await SB.rpc('save_consent', full);
  if(r.error && /p_ai_train|does not exist|function .*save_consent/i.test(r.error.message||''))
    r=await SB.rpc('save_consent', Object.assign({p_name:c.name||null}, base));
  if(r.error && /p_name|does not exist|function .*save_consent/i.test(r.error.message||''))
    r=await SB.rpc('save_consent', base);
  if(!r.error && c.extra) await saveExtra(c.extra);
  if(!r.error) await submitJoinBusiness(c);
  return r;
}
/* 선택 정보는 profiles 를 직접 고칩니다. 본인 줄만 고칠 수 있게
   supabase_v14.sql 에서 정책을 걸어 두었습니다.
   실패해도 가입 자체는 진행되어야 하므로 오류를 삼킵니다. */
async function saveExtra(x){
  try{
    const u=(await SB.auth.getUser()).data.user; if(!u) return;
    await SB.from('profiles').update({
      keep_species:(x.species&&x.species.length)?x.species:null,
      experience:x.experience||null, region:x.region||null,
      purpose:x.purpose||null
    }).eq('user_id', u.id);
  }catch(e){}
}
// 로그인은 됐지만 동의 기록이 없는 경우 (구글 가입 등) 동의 화면
function renderConsentGate(u){
  $('root').innerHTML='<h2 style="margin:0 0 4px;font-size:17px">'+t('consentGateTitle')+'</h2>'
    +'<div class="hint">'+LoginLocale.html('consentGateBody',{email:u.email||''})+'</div>'
    +profileHTML()+extraHTML()+consentHTML()
    +'<button class="btn" id="go">'+t('consentStart')+'</button>'
    +'<button class="btn ghost" id="out" style="margin-top:8px">'+t('otherAccount')+'</button>'
    +'<div class="msg" id="msg"></div>';
  wireConsent();
  $('out').onclick=async()=>{ await SB.auth.signOut(); location.reload(); };
  $('go').onclick=async()=>{
    const c=consentValues(); clearMsg();
    if(!(c.terms&&c.privacy&&c.age)) return say('e',t('consentRequired'));
    if(!c.nickname) return say('e',t('nickNeeded'));
    { const p=joinProblem(c); if(p) return say('e',p); }
    if(c.sms&&!c.phone) return say('e',t('phoneRequired'));
    $('go').disabled=true;
    const r=await saveConsent(c); $('go').disabled=false;
    if(r.error) return say('e',err(r.error));
    await claim(); finishLogin(u);
  };
}
async function mustChangePw(){
  try{ const r=await SB.rpc('my_consent');
       return !!(r.data && r.data.must_change_password); }
  catch(e){ return false; }
}
async function hasConsent(){
  try{ const r=await SB.rpc('my_consent'); return !!(r.data && r.data.agree_terms); }catch(e){ return true; }
}

async function boot(){
  if(!SB){ $('root').innerHTML=t('backendMissing'); return; }
  // 비밀번호 재설정 메일로 들어온 경우
  const h=location.hash||''; if(h.indexOf('type=recovery')>=0){ MODE='newpw'; render(); return; }
  const s=await SB.auth.getSession();
  if(s.data.session){
    const u=s.data.session.user;
    /* 임시 비밀번호로 들어온 경우 다른 화면보다 먼저 변경을 요구합니다. */
    if(await mustChangePw()) return renderNewPw(true);
    if(await hasConsent()) return finishLogin(u);
    return renderConsentGate(u);
  }
  render();
}

function render(){
  if(MODE==='newpw') return renderNewPw();
  if(MODE==='reset') return renderReset();
  const isUp = SIGNUPS_ENABLED && MODE==='signup';
  $('root').innerHTML=
    '<div class="beta-notice" role="status"><b>'+t('closedBetaTitle')+'</b>'+t('closedBetaBody')+'</div>'
    +'<div class="seg"><button id="tLogin" class="'+(isUp?'':'on')+'">'+t('login')+'</button>'
    +(SIGNUPS_ENABLED ? '<button id="tSignup" class="'+(isUp?'on':'')+'">'+t('signup')+'</button>' : '')+'</div>'
    +'<button class="gbtn" id="google">'+GOOGLE_SVG+' '+t(isUp?'googleSignup':'googleLogin')+'</button>'
    +'<div class="divider">'+t('emailDivider')+'</div>'
    +'<label class="fl">'+t('email')+'</label><input class="in" id="email" type="email" autocomplete="email" placeholder="you@example.com">'
    +(isUp? '<div class="hint" style="margin:-6px 0 12px 2px">'+t('signupEmailWarning')+'</div>' : '')
    +'<label class="fl">'+t('password')+'</label><input class="in" id="pw" type="password" autocomplete="'+(isUp?'new-password':'current-password')+'" placeholder="'+esc(t(isUp?'passwordRule':'password'))+'">'
    +(isUp? '<label class="fl">'+t('passwordConfirm')+'</label><input class="in" id="pw2" type="password" autocomplete="new-password" placeholder="'+esc(t('passwordAgain'))+'">' : '')
    +(isUp? joinKindHTML()+profileHTML()+bizSignupHTML()+extraHTML()+consentHTML() : '')
    +capHTML()
    +'<button class="btn" id="go">'+t(isUp?'signupAction':'loginAction')+'</button>'
    +'<div class="msg" id="msg"></div>'
    +(isUp? '' : (PASSWORD_RESET_REQUESTS_ENABLED ? '<div class="sub"><a id="toReset">'+t('forgotPassword')+'</a></div>' : ''))
    +'<div class="why"><b>'+t('whyLoginTitle')+'</b><br>'+t('whyLoginBody')+'</div>';
  $('tLogin').onclick=()=>{ MODE='login'; render(); };
  const signupTab=$('tSignup');
  if(signupTab) signupTab.onclick=()=>{ MODE='signup'; render(); };
  const rs=$('toReset'); if(rs) rs.onclick=()=>{ MODE='reset'; render(); };
  document.querySelectorAll('[data-jk]').forEach(b=>{
    b.onclick=()=>{ JOIN_KIND=b.dataset.jk; render(); };
  });
  if(isUp) wireConsent();
  capMount();
  $('google').onclick=isUp? doGoogleSignup : doGoogle;
  $('go').onclick=isUp? doSignup : doLogin;
  ['email','pw','pw2'].forEach(id=>{ const el=$(id); if(el) el.addEventListener('keydown',e=>{ if(e.key==='Enter') $('go').click(); }); });
}

/* 비밀번호 재설정 — 자동 메일이 아니라 운영자가 직접 처리합니다.
   요청만 남기고, 운영자가 관리자 화면에서 임시 비밀번호를 발급해
   회원 이메일로 보내줍니다. */
function renderReset(){
  if(!PASSWORD_RESET_REQUESTS_ENABLED) return renderResetPaused();
  $('root').innerHTML='<h2 style="margin:0 0 6px;font-size:17px">'+t('resetTitle')+'</h2>'
    +'<div class="hint">'+t('resetHint')+'</div>'
    +'<label class="fl">'+t('joinedEmail')+'</label><input class="in" id="email" type="email" placeholder="you@example.com">'
    +'<label class="fl">'+t('resetNote')+'</label>'
    +'<input class="in" id="note" placeholder="'+esc(t('resetNotePlaceholder'))+'">'
    +'<button class="btn" id="go">'+t('resetRequest')+'</button>'
    +'<button class="btn ghost" id="back" style="margin-top:8px">'+t('back')+'</button>'
    +'<div class="msg" id="msg"></div>'
    +'<div class="why"><b>'+t('resetHowTitle')+'</b><br>'+t('resetHowBody')
    +'<br><br>'+CR_MAIL_LINK+'</div>';
  $('back').onclick=()=>{ MODE='login'; render(); };
  $('go').onclick=async()=>{
    const em=$('email').value.trim(); clearMsg();
    if(!validEmail(em)) return say('e',t('emailCheck'));
    $('go').disabled=true; $('go').textContent=t('sending');
    let ok=false;
    try{
      const r=await SB.rpc('request_password_reset',{p_email:em,p_note:$('note').value.trim()||null});
      ok = !r.error;
    }catch(e){}
    $('go').disabled=false; $('go').textContent=t('resetRequest');
    /* 가입 여부를 알려주지 않습니다. 알려주면 남의 가입 여부를 확인하는
       수단이 됩니다. 가입되지 않은 주소여도 같은 안내가 나갑니다. */
    if(ok) say('o',LoginLocale.html('resetAccepted',{email:em}));
    else   say('e',t('resetFailed'));
  };
}

function renderResetPaused(){
  $('root').innerHTML='<h2 style="margin:0 0 6px;font-size:17px">'+t('resetTitle')+'</h2>'
    +'<div class="hint">'+t('resetPaused')+'</div>'
    +'<button class="btn ghost" id="back" style="margin-top:8px">'+t('backToLogin')+'</button>';
  $('back').onclick=()=>{ MODE='login'; render(); };
}

/* forced=true 면 '나중에' 없이 변경만 가능합니다.
   임시 비밀번호는 운영자와 메일에 남아 있으므로 계속 쓰면 안 됩니다. */
function renderNewPw(forced){
  $('root').innerHTML='<h2 style="margin:0 0 6px;font-size:17px">'+t(forced?'forcedPasswordTitle':'newPasswordTitle')+'</h2>'
    +(forced? '<div class="hint">'+t('forcedPasswordHint')+'</div>' : '')
    +'<label class="fl">'+t('newPassword')+'</label><input class="in" id="pw" type="password" placeholder="'+esc(t('passwordRule'))+'">'
    +'<label class="fl">'+t('passwordConfirm')+'</label><input class="in" id="pw2" type="password" placeholder="'+esc(t('passwordAgain'))+'">'
    +'<button class="btn" id="go">'+t('change')+'</button><div class="msg" id="msg"></div>';
  $('go').onclick=async()=>{
    const a=$('pw').value, b=$('pw2').value; clearMsg();
    { const p=pwProblem(a); if(p) return say('e',p); }
    if(a!==b) return say('e',t('passwordMismatch'));
    $('go').disabled=true;
    const r=await SB.auth.updateUser({password:a});
    $('go').disabled=false;
    if(r.error) return say('e',err(r.error));
    try{ await SB.rpc('clear_must_change'); }catch(e){}
    say('o',t('passwordChangedMove'));
    setTimeout(()=>{ const next=LoginLocale.safeNextPath(); if(next) location.replace(next); else location.href=LoginLocale.url('/gecko/login.html'); },1200);
  };
}

async function renderMe(u,isAdmin){
  const run=++ACCOUNT_RENDER;
  let prem={active:false};
  if(typeof isAdmin!=='boolean'){
    try{ const r=await SB.rpc('is_owner'); isAdmin=r.data===true; }catch(e){ isAdmin=false; }
  }
  try{ const r=await SB.rpc('premium_status',{p_device:'u_'+u.id}); prem=r.data||{active:false}; }catch(e){}
  if(run!==ACCOUNT_RENDER) return;
  const exp=prem.expires_at? LoginLocale.formatDate(prem.expires_at) : null;
  const letter=(u.email||'?').charAt(0).toUpperCase();
  const overview='<div class="me"><div class="av">'+esc(letter)+'</div>'
    +'<div class="em">'+esc(u.email||t('signedIn'))+'</div>'
    +(isAdmin? '<div class="badge pro">🛡️ '+t('adminBadge')+'</div>' : '')
    +(prem.active? '<div class="badge pro">💎 '+t(prem.kind==='sub'?'subscription':prem.kind==='trial'?'trial':'premiumAccess')
      +(exp?' · '+t('until',{date:exp}):' · '+t('unlimited'))+'</div>'
                 : '<div class="badge free">'+t('freePlan')+'</div>')
    +'</div>'
    +'<div class="links"><a href="'+esc(LoginLocale.calculatorUrl())+'">🧮 '+t('calculator')+'</a>'
    /* 브리딩 링크가 '레오파드 전용' 과 '전 종' 두 개로 나뉘어 있었습니다.
       레오파드 전용 화면에서 종을 바꾸려고 하면 다시 레오파드가 나와서
       뭐가 뭔지 알 수 없었습니다. 이제 한 화면으로 합쳤습니다. */
    /* 브리딩 관리는 유료지만 링크는 무료 회원에게도 보여 줍니다. 감춰 두면
       무엇이 더 있는지 알 수 없어서, 결제를 권할 자리 자체가 없어집니다.
       무료가 누르면 요금 안내로 갑니다. */
    +'<a href="'+esc(prem.active? LoginLocale.url('/care/breeding.html?species=gecko&v=20260803m') : LoginLocale.url('/pricing.html'))+'">'
      +'🧬 '+t('breedingManagement')+(prem.active? '' : ' <span class="opt">'+t('premiumAccess')+'</span>')+'</a>'
    /* 케어로그는 무료도 10마리까지 쓸 수 있게 만들어 두었지만(supabase_v54),
       회원가입을 막아 둔 동안에는 링크를 열지 않습니다. 아직 들어올 수 없는
       사람에게 먼저 보여 줄 이유가 없습니다. 가입을 열 때 이 조건을 풉니다. */
    +(prem.active? '<a href="'+esc(LoginLocale.url('/care/'))+'">🗓 '+t('creatureCare')+'</a>' : '')
    +(isAdmin? '<a href="'+esc(LoginLocale.url('/admin/'))+'">🛡️ '+t('adminConsole')+'</a>'
      : '<a href="'+esc(LoginLocale.calculatorUrl())+'" id="codeLink">💎 '+t('premiumCode')+'</a>')+'</div>'
    +(isAdmin? '<div class="admin-note">'+t('adminOnlySummary')+'</div>' : '')
    +'<button class="btn ghost" id="out" style="margin-top:14px">'+t('logout')+'</button>';
  $('root').innerHTML=AccountShell.html({overview:overview,isAdmin:isAdmin,i18n:LoginLocale});
  AccountShell.bind($('root'));
  $('out').onclick=async()=>{ await SB.auth.signOut(); location.reload(); };
  (isAdmin? renderAdminProfile(run) : renderConsentSettings(run)).catch(error=>{
    if(run===ACCOUNT_RENDER) say('e',err(error));
  });
  /* 기한이 얼마 안 남았으면 알려 줍니다. 관리자에게는 띄우지 않습니다 —
     관리자 계정은 무기한이라 어차피 조건에 걸리지 않지만, 걸리더라도
     본인이 관리하는 쪽이라 안내받을 일이 아닙니다. */
  if(!isAdmin && window.PremiumExpiryNotice) window.PremiumExpiryNotice.show(prem, LoginLocale.language());
}

async function finishLogin(user){
  const next=LoginLocale.safeNextPath();
  if(next){ location.replace(next); return; }
  let isAdmin=false;
  try{ const r=await SB.rpc('is_owner'); isAdmin=r.data===true; }catch(e){}
  return renderMe(user,isAdmin);
}

/* 남은 닉네임 변경 횟수. v59 적용 전에는 함수가 없으므로 조용히 비웁니다 —
   안내 한 줄 때문에 계정 화면 전체가 멈추면 안 됩니다. */
async function nickStatus(){
  try{ const r=await SB.rpc('my_nickname_status'); return r.error? null : r.data; }
  catch(e){ return null; }
}
function nickNoteText(s){
  if(!s) return '';
  const left=Math.max(0, (s.limit||2) - (s.used||0));
  return left>0 ? t('nickChangesLeft').replace('{n}', String(left)) : t('nickChangesNone');
}
/* 닉네임 저장 절차는 일반 계정 화면과 관리자 화면이 같이 씁니다. 두 곳에
   따로 적어 두면 한쪽만 고치게 되고, 그 화면에서만 조용히 옛 동작이 남습니다.
   legacy 는 v59 를 아직 적용하지 않은 상태입니다. */
async function submitNickname(wanted){
  const n=await SB.rpc('set_my_nickname',{p_nickname:wanted});
  const legacy=!!(n.error && /set_my_nickname|does not exist|PGRST202/i
    .test(String(n.error.message||'')+' '+String(n.error.code||'')));
  return { n:n, legacy:legacy };
}
/* 서버가 지어 준 이름을 화면에 되돌려 줍니다. 안 하면 지운 칸이 빈 채로
   남아 사용자는 저장이 안 된 줄 압니다. */
function applyNickResult(data){
  if(!data) return;
  const input=$('iNick'); if(input) input.value=data.nickname||'';
  const note=$('nickNote'); if(note) note.textContent=nickNoteText(data);
}

/* ---------- 사업자 인증 (supabase_v60) ----------
   프리미엄 계정만 신청합니다. 승인되면 공개 화면에서 브리더명 옆에 로고와
   인증 표시가 붙습니다. 사업자등록번호는 관리자만 봅니다 — 공개 화면으로는
   상호명과 로고만 나갑니다. */
const BIZ_TYPES = ['image/png','image/jpeg','image/webp'];
const BIZ_MAX   = 512*1024;

async function bizStatus(){
  try{ const r=await SB.rpc('my_business_status'); return r.error? null : r.data; }
  catch(e){ return null; }
}

/* 로고는 줄이지 않고 그대로 올립니다. ImgTool.resize 는 JPEG 로 다시 굽는데,
   투명한 배경의 PNG 로고가 들어오면 뒤가 까맣게 칠해집니다. 로고는 그 회사의
   자산이라 우리가 말없이 바꿀 것이 아닙니다 — 크면 작은 파일을 달라고 합니다. */
async function uploadLogo(file){
  if(BIZ_TYPES.indexOf(file.type)<0) throw new Error('BIZ_LOGO_TYPE');
  if(file.size>BIZ_MAX) throw new Error('BIZ_LOGO_SIZE');
  const s=await SB.auth.getSession();
  const uid=s.data.session && s.data.session.user && s.data.session.user.id;
  if(!uid) throw new Error('AUTH_REQUIRED');
  const ext={'image/png':'png','image/jpeg':'jpg','image/webp':'webp'}[file.type];
  const path='b/u_'+uid+'_'+Date.now()+'.'+ext;
  const up=await SB.storage.from('breeder-logos').upload(path,file,{contentType:file.type,upsert:true});
  if(up.error) throw up.error;
  return SB.storage.from('breeder-logos').getPublicUrl(path).data.publicUrl;
}

function bizErr(e){
  const m=String((e&&e.message)||e||'');
  if(/BIZ_LOGO_TYPE/.test(m))       return t('bizLogoType');
  if(/BIZ_LOGO_SIZE/.test(m))       return t('bizLogoSize');
  if(/BIZ_PREMIUM_REQUIRED/.test(m))return t('bizPremiumOnly');
  if(/BIZ_NAME_REQUIRED/.test(m))   return t('bizNameNeeded');
  if(/BIZ_NUMBER_INVALID/.test(m))  return t('bizNumberInvalid');
  if(/BIZ_NUMBER_TAKEN/.test(m))    return t('bizNumberTaken');
  if(/BIZ_LOGO_INVALID/.test(m))    return t('bizLogoInvalid');
  if(/BIZ_NOT_APPROVED/.test(m))    return t('bizNotApproved');
  return err(e);
}

function bizBoxHTML(b){
  const st=(b&&b.status)||'none';
  const badge={pending:'bizStatusPending',approved:'bizStatusApproved',
               rejected:'bizStatusRejected',none:'bizStatusNone'}[st];
  return '<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('bizTitle')
      +' <span class="opt">'+t(badge)+'</span></div>'
    +(st==='rejected' && b.note ? '<div class="cNote" style="margin-top:0;border-top:0;padding-top:0">'
      +esc(t('bizRejectedNote'))+' '+esc(b.note)+'</div>' : '')
    +'<input class="in" id="bName" placeholder="'+esc(t('bizName'))+'" value="'+esc((b&&b.biz_name)||'')+'" style="margin-bottom:8px">'
    +'<input class="in" id="bNum" inputmode="numeric" placeholder="'+esc(t('bizNumber'))+'" value="'+esc((b&&b.biz_number)||'')+'" style="margin-bottom:8px">'
    +'<div id="bLogoBox" style="display:flex;align-items:center;gap:10px;margin-bottom:8px">'
      +'<img id="bLogoImg" alt="" style="width:46px;height:46px;border-radius:11px;object-fit:contain;'
        +'background:var(--card);border:1px solid var(--hair);padding:4px;'
        +'display:'+((b&&b.logo_url)?'block':'none')+'" src="'+esc((b&&b.logo_url)||'')+'">'
      +'<button class="btn ghost" id="bPick" style="margin:0;flex:1">'+t('bizLogoPick')+'</button>'
      +'<input type="file" id="bFile" accept="image/png,image/jpeg,image/webp" hidden>'
    +'</div>'
    +'<button class="btn ghost" id="bSave" style="margin-top:2px">'
      +t(st==='approved'?'bizSaveLogo':'bizApply')+'</button>'
    +'<div class="cNote">'+t('bizHint')+'</div>';
}

async function renderBusinessBox(profilePane){
  const first=await bizStatus();
  /* v60 적용 전이거나 프리미엄이 아니면 아예 안 그립니다. 안 되는 칸을 회색으로
     띄워 두면 '왜 안 되냐' 는 문의만 늘어납니다. */
  if(!first || !first.premium) return;
  const box=document.createElement('div');
  box.className='consent'; box.style.marginTop='12px';
  profilePane.appendChild(box);

  function draw(b){
    box.innerHTML=bizBoxHTML(b);
    let logoUrl=b.logo_url||null;
    $('bPick').onclick=()=>$('bFile').click();
    $('bFile').onchange=async()=>{
      const file=$('bFile').files[0]; if(!file) return;
      $('bPick').disabled=true;
      try{
        logoUrl=await uploadLogo(file);
        $('bLogoImg').src=logoUrl; $('bLogoImg').style.display='block';
        say('o',t('bizLogoReady'));
      }catch(e){ say('e',bizErr(e)); }
      $('bPick').disabled=false; $('bFile').value='';
    };
    $('bSave').onclick=async()=>{
      $('bSave').disabled=true;
      /* 승인된 사람이 로고만 바꿀 때는 승인을 풀지 않습니다. 상호명이나 번호를
         고치는 것은 다시 확인해야 하니 신청으로 돌아갑니다. */
      const nameSame=($('bName').value.trim()===(b.biz_name||''));
      const numSame=($('bNum').value.replace(/[^0-9]/g,'')===String(b.biz_number||''));
      const r = (b.status==='approved' && nameSame && numSame)
        ? await SB.rpc('set_my_breeder_logo',{p_logo:logoUrl})
        : await SB.rpc('apply_business_verification',
            {p_name:$('bName').value.trim(), p_number:$('bNum').value, p_logo:logoUrl});
      $('bSave').disabled=false;
      if(r.error) return say('e',bizErr(r.error));
      say('o',t('saved'));
      /* 상태가 바뀌었을 수 있습니다(승인 → 심사 중). 이 칸만 다시 그립니다 —
         안 그러면 아직 승인된 것처럼 보입니다. */
      const next=await bizStatus();
      if(next && next.premium) draw(next);
    };
  }
  draw(first);
}

/* 관리자 계정의 프로필 칸. 닉네임만 둡니다 — 동의 항목은 관리자에게 보여
   주지 않기로 한 기존 판단을 그대로 두고, 실제로 막혀 있던 것(본인 닉네임을
   바꿀 방법이 없던 것)만 엽니다. set_my_nickname 은 동의와 무관한 함수라
   save_consent 를 거치지 않아도 됩니다. */
async function renderAdminProfile(run){
  const nick=await nickStatus();
  if(run!==ACCOUNT_RENDER) return;
  const profilePane=AccountShell.pane($('root'),'profile');
  if(!profilePane) return;
  const box=document.createElement('div');
  box.className='consent'; box.style.marginTop='16px';
  box.innerHTML='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('profileTitle')+'</div>'
    +'<input class="in" id="iNick" placeholder="'+esc(t('nickname'))+'" value="'+esc((nick&&nick.nickname)||'')+'" style="margin-bottom:0">'
    +(nick? '<div class="cNote" id="nickNote">'+esc(nickNoteText(nick))+'</div>' : '')
    +'<div class="cNote">'+t('adminProfileNote')+'</div>'
    +'<button class="btn ghost" id="nSave" style="margin-top:10px">'+t('saveSettings')+'</button>';
  profilePane.appendChild(box);
  $('nSave').onclick=async()=>{
    $('nSave').disabled=true;
    const r=await submitNickname($('iNick').value.trim());
    $('nSave').disabled=false;
    if(r.legacy) return say('e',t('errUnknown'));
    if(r.n.error) return say('e',err(r.n.error));
    applyNickResult(r.n.data);
    say('o',t('saved'));
  };
}

async function renderConsentSettings(run){
  let c=null; try{ const r=await SB.rpc('my_consent'); c=r.data; }catch(e){}
  if(!c || run!==ACCOUNT_RENDER) return;
  const nick=await nickStatus();
  if(run!==ACCOUNT_RENDER) return;
  const profilePane=AccountShell.pane($('root'),'profile');
  const privacyPane=AccountShell.pane($('root'),'privacy');
  const securityPane=AccountShell.pane($('root'),'security');
  if(!profilePane || !privacyPane || !securityPane) return;

  // 기본 정보 (이름·닉네임·전화)
  const info=document.createElement('div');
  info.className='consent'; info.style.marginTop='16px';
  info.innerHTML='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('profileTitle')+' <span class="opt">'+t('optional')+'</span></div>'
    +'<input class="in" id="iName" placeholder="'+esc(t('name'))+'" value="'+esc(c.name||'')+'" style="margin-bottom:8px">'
    +'<input class="in" id="iNick" placeholder="'+esc(t('nickname'))+'" value="'+esc(c.nickname||'')+'" style="margin-bottom:0">'
    +(nick? '<div class="cNote" id="nickNote">'+esc(nickNoteText(nick))+'</div>' : '')
    +'<div class="cNote">'+t('profileExistingNote')+'</div>';
  profilePane.appendChild(info);

  // 회원이 원할 때만 적는 정보 — 가입 화면과 같은 입력란을 그대로 씁니다.
  const ex=document.createElement('div');
  ex.style.marginTop='12px'; ex.innerHTML=extraHTML(c);
  profilePane.appendChild(ex);

  /* 사업자 인증은 기다리지 않고 붙입니다. 프리미엄이 아닌 대부분의 회원에게는
     아무것도 안 그리는데, 그 판정을 기다리느라 아래 동의 설정이 늦게 뜨면
     화면이 덜컥거립니다. */
  renderBusinessBox(profilePane).catch(()=>{});

  const box=document.createElement('div');
  box.className='consent'; box.style.marginTop='12px';
  // 가입 화면에는 '전체 선택'이 있는데 여기만 없어서, 항목을 하나씩 눌러야 했습니다.
  box.innerHTML='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('consentSettings')+'</div>'
    +'<label class="cAll"><input type="checkbox" id="sAll"><span>'+t('selectAll')+'</span></label>'
    +'<label class="cRow"><input type="checkbox" class="sItem" id="sThird" '+(c.agree_third?'checked':'')+'><span>'+t('thirdShort')+'</span></label>'
    +'<label class="cRow"><input type="checkbox" class="sItem" id="sMail" '+(c.agree_mkt_email?'checked':'')+'><span>'+t('mailShort')+'</span></label>'
    +'<label class="cRow"><input type="checkbox" class="sItem" id="sSms" '+(c.agree_mkt_sms?'checked':'')+'><span>'+t('smsShort')+'</span></label>'
    +'<div id="sPhoneWrap" style="display:'+(c.agree_mkt_sms?'block':'none')+';margin-top:6px">'
    +'<input class="in" id="sPhone" type="tel" placeholder="'+esc(t('phone'))+'" value="'+esc(c.phone||'')+'" style="margin-bottom:0"></div>'
    +'<label class="cRow" style="margin-top:4px"><input type="checkbox" class="sItem" id="sAi" '+(c.agree_ai_train?'checked':'')+'>'
      +'<span>'+t('aiShort')
      +'<a href="../terms.html#terms" target="_blank">'+t('aiTerms')+'</a>'
      +'<br><span style="font-size:11px;color:var(--ink2)">'+t('aiSettingsNote')+'</span></span></label>'
    +(c.ai_at? '<div class="cNote" style="margin-top:2px">'+t('aiConsentDate',{date:LoginLocale.formatDate(c.ai_at)})+'</div>' : '')
    +'<button class="btn ghost" id="sSave" style="margin-top:10px">'+t('saveSettings')+'</button>'
    +'<div class="cNote">'+t('requiredLocked')
    +(c.consent_at? ' '+t('finalConsentDate',{date:LoginLocale.formatDate(c.consent_at)}) : '')+'</div>';
  privacyPane.appendChild(box);

  const sAll=$('sAll'), sItems=[...document.querySelectorAll('.sItem')];
  const syncAll=()=>{ sAll.checked=sItems.every(x=>x.checked); };
  sAll.onchange=()=>{ sItems.forEach(i=>i.checked=sAll.checked); togglePhone(); };
  sItems.forEach(i=>i.onchange=()=>{ syncAll(); togglePhone(); });
  function togglePhone(){ $('sPhoneWrap').style.display=$('sSms').checked?'block':'none'; }
  syncAll();

  $('sSave').onclick=async()=>{
    if($('sSms').checked && !$('sPhone').value.trim()) return say('e',t('phoneRequired'));
    const wanted=$('iNick').value.trim();
    $('sSave').disabled=true;
    /* 닉네임만 따로 보냅니다. save_consent 는 빈 값을 '건드리지 않음' 으로 읽어서
       '지우고 저장하면 새로 지어 준다' 를 표현할 수 없습니다.
       v59 적용 전이면 함수가 없으므로 예전처럼 같이 실어 보냅니다. */
    const { n, legacy } = await submitNickname(wanted);
    const r=await saveConsent({terms:true,privacy:true,age:true,third:$('sThird').checked,
      mail:$('sMail').checked, sms:$('sSms').checked, ai:$('sAi').checked,
      phone:$('sPhone').value.trim()||null,
      name:$('iName').value.trim()||null, nickname:legacy?(wanted||null):null,
      extra:extraValues()});
    $('sSave').disabled=false;
    if(n.error && !legacy) return say('e',err(n.error));
    if(r.error) return say('e',err(r.error));
    if(!legacy) applyNickResult(n.data);
    say('o',t('saved'));
  };

  /* 비밀번호 변경 — 지금 로그인한 본인만 바꿀 수 있습니다.
     예전에는 현재 비밀번호를 묻지 않았습니다. '이미 로그인된 세션이니까' 라는
     이유였는데, 그건 자리를 비운 사이 남이 화면을 잡으면 그대로 비밀번호를
     바꿔 계정을 가져갈 수 있다는 뜻이기도 합니다. 한 번 더 묻습니다.

     구글로만 가입한 계정에는 확인할 비밀번호가 없습니다. 그때는 묻지 않고
     '처음 정하기' 로 둡니다 — 없는 것을 대라고 하면 영영 정할 수 없습니다.
     has_password 는 my_identities 가 알려 줍니다. */
  let hasPassword=true;
  try{ const r=await SB.rpc('my_identities'); hasPassword=(!r.error && r.data)? !!r.data.has_password : true; }
  catch(e){ hasPassword=true; }
  if(run!==ACCOUNT_RENDER) return;

  const pwbox=document.createElement('div');
  pwbox.className='consent'; pwbox.style.marginTop='12px';
  pwbox.innerHTML='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'
      +t(hasPassword?'changePassword':'setPassword')+'</div>'
    +(hasPassword? '<input class="in" id="cpw" type="password" autocomplete="current-password" placeholder="'+esc(t('currentPassword'))+'" style="margin-bottom:8px">' : '')
    +'<input class="in" id="npw" type="password" autocomplete="new-password" placeholder="'+esc(t('newPasswordPlaceholder'))+'" style="margin-bottom:8px">'
    +'<input class="in" id="npw2" type="password" autocomplete="new-password" placeholder="'+esc(t('passwordAgain'))+'" style="margin-bottom:0">'
    +'<button class="btn ghost" id="npwSave" style="margin-top:10px">'
      +t(hasPassword?'changePassword':'setPassword')+'</button>'
    +'<div class="cNote">'+t(hasPassword?'passwordChangeNote':'passwordProviderNote')+'</div>';
  securityPane.appendChild(pwbox);
  $('npwSave').onclick=async()=>{
    const cur=hasPassword? $('cpw').value : '';
    const a=$('npw').value, b=$('npw2').value;
    if(hasPassword && !cur) return say('e',t('currentPasswordRequired'));
    const p=pwProblem(a); if(p) return say('e',p);
    if(a!==b) return say('e',t('passwordMismatch'));
    /* 같은 비밀번호로 바꾸면 바뀐 것이 없는데 바뀌었다고 안내하게 됩니다. */
    if(hasPassword && cur===a) return say('e',t('passwordSameAsCurrent'));
    $('npwSave').disabled=true;
    if(hasPassword){
      /* 현재 비밀번호 확인. 같은 계정으로 다시 로그인하는 것이라 세션이 새로
         발급될 뿐 로그아웃되지는 않습니다. */
      const s=await SB.auth.getSession();
      const email=(s.data.session && s.data.session.user && s.data.session.user.email)||'';
      const chk=await SB.auth.signInWithPassword({email:email, password:cur});
      if(chk.error){ $('npwSave').disabled=false; return say('e',t('currentPasswordWrong')); }
    }
    const r=await SB.auth.updateUser({password:a});
    $('npwSave').disabled=false;
    if(r.error) return say('e',err(r.error));
    try{ await SB.rpc('clear_must_change'); }catch(e){}
    if($('cpw')) $('cpw').value='';
    $('npw').value=''; $('npw2').value='';
    say('o',t('passwordChanged'));
  };

  // 연결된 로그인 수단 (docs/AUTH.md 5장)
  await renderIdentities(securityPane,run);
  if(run!==ACCOUNT_RENDER) return;

  // 회원탈퇴
  const out=document.createElement('div');
  out.style.marginTop='18px'; out.style.textAlign='center';
  out.innerHTML='<a class="quit" id="quitLink">'+t('deleteAccount')+'</a>';
  securityPane.appendChild(out);
  $('quitLink').onclick=()=>renderQuit(c);
}

/* ---------- 연결된 로그인 수단 ----------
   설계 근거는 docs/AUTH.md 5장. 핵심 규칙:
   "사용 가능한 로그인 수단"은 소셜 identity 수 + (비밀번호 설정됨 ? 1 : 0) 이며,
   해제 후 1개 이상 남을 때만 해제를 허용한다. identity 개수만 세면 안 된다 —
   구글로만 가입한 계정도 email identity 를 갖지만 비밀번호는 없기 때문. */
const PROVIDERS={ email:'✉️', google:'🔵', kakao:'💛', apple:'🍎' };
function providerLabel(p){ return LoginLocale.providerName(p); }
function providerIcon(p){ return PROVIDERS[p]||'🔑'; }

// 해제 후에도 남는 "사용 가능한" 로그인 수단 개수
function usableCount(list, hasPassword, excludeProvider){
  let n=list.filter(i=>i.provider!=='email' && i.provider!==excludeProvider).length;
  if(hasPassword && excludeProvider!=='email') n++;
  return n;
}

async function renderIdentities(target,run){
  let d=null;
  try{ const r=await SB.rpc('my_identities'); if(r.error) throw r.error; d=r.data; }catch(e){ d=null; }
  if(run!==ACCOUNT_RENDER) return;

  const box=document.createElement('div');
  box.className='consent'; box.style.marginTop='12px';

  if(!d){
    box.innerHTML='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('loginMethods')+'</div>'
      +'<div class="cNote">'+t('loginMethodsLoadFailed')+'</div>';
    target.appendChild(box); return;
  }

  const list=d.identities||[], hasPw=!!d.has_password;
  const total=usableCount(list, hasPw, null);

  let h='<div style="font-size:13px;font-weight:800;padding:2px 2px 8px">'+t('loginMethods')+' '
    +'<span class="opt">'+t('methodCount',{count:LoginLocale.formatNumber(total)})+'</span></div>';

  // 이메일+비밀번호는 identity 목록이 아니라 비밀번호 설정 여부로 판단
  const rows=[];
  if(hasPw) rows.push({provider:'email', email:(list.filter(i=>i.provider==='email')[0]||{}).email});
  list.filter(i=>i.provider!=='email').forEach(i=>rows.push(i));

  h+=rows.map(i=>{
    const last = usableCount(list, hasPw, i.provider)===0;
    return '<div class="idrow"><span class="idic">'+providerIcon(i.provider)+'</span>'
      +'<div class="idmain"><b>'+esc(providerLabel(i.provider))+'</b>'
      +(i.email? '<div class="idsub">'+esc(i.email)+'</div>':'')
      +'</div>'
      +(last? '<span class="idlast">'+t('onlyMethod')+'</span>'
            : '<button class="mini" data-unlink="'+esc(i.provider)+'">'+t('unlink')+'</button>')
      +'</div>'; }).join('');

  h+='<div class="cNote">'+t('methodsNote')+'</div>';

  // 아직 연결하지 않은 provider 안내 (연동 UI 는 다음 단계에서 구현)
  const linked=new Set(rows.map(i=>i.provider));
  const missing=Object.keys(PROVIDERS).filter(p=>!linked.has(p) && p!=='kakao' && p!=='apple');
  if(missing.length) h+='<div class="cNote" style="border-top:none;padding-top:0">'
    +LoginLocale.html('notLinked',{providers:missing.map(p=>providerLabel(p)).join(', ')})
    +' <span class="opt">'+t('linkingSoon')+'</span></div>';

  box.innerHTML=h;
  target.appendChild(box);

  box.querySelectorAll('[data-unlink]').forEach(b=>b.onclick=()=>{
    const p=b.dataset.unlink;
    if(usableCount(list, hasPw, p)===0)
      return say('e',t('onlyMethodError'));
    say('e',t('unlinkSoon'));
  });
}

/* ---------- 회원탈퇴 ---------- */
function renderQuit(c){
  const email=(c&&c.email)||'';
  $('root').innerHTML='<h2 style="margin:0 0 6px;font-size:17px">'+t('deleteAccount')+'</h2>'
    +'<div class="hint">'+t('deleteIntro')+'</div>'

    +'<div class="quitbox warn"><b>'+t('irreversible')+'</b>'
    +'<div>'+t('irreversibleBody')+'</div></div>'

    +'<div class="quitbox"><b>'+t('deleteNowTitle')+'</b>'
    +'<ul>'+t('deleteNowItems')+'</ul></div>'

    +'<div class="quitbox"><b>'+t('retainedTitle')+'</b>'
    +'<ul>'+t('retainedItems')+'</ul>'
    +'<div class="qsub" style="margin-top:8px"><a href="../terms.html#privacy" target="_blank">'+t('privacyDetails')+'</a></div></div>'

    +'<div class="quitbox"><b>'+t('premiumDeleteTitle')+'</b>'
    +'<div class="qsub">'+t('premiumDeleteBody')+'</div></div>'

    +'<label class="cRow" style="margin-top:14px"><input type="checkbox" id="qAgree">'
    +'<span>'+t('deleteAgree')+'</span></label>'

    +'<div class="fl" style="margin-top:10px">'+t('typeEmail')+'</div>'
    +'<input class="in" id="qEmail" type="email" placeholder="'+esc(email)+'" autocomplete="off">'

    +'<button class="btn danger" id="qGo" disabled>'+t('deleteAction')+'</button>'
    +'<button class="btn ghost" id="qBack" style="margin-top:8px">'+t('back')+'</button>'
    +'<div class="msg" id="msg"></div>';

  const sync=()=>{ $('qGo').disabled = !($('qAgree').checked
    && $('qEmail').value.trim().toLowerCase()===String(email).toLowerCase() && email); };
  $('qAgree').onchange=sync; $('qEmail').oninput=sync;
  $('qBack').onclick=()=>boot();
  $('qGo').onclick=async()=>{
    if(!confirm(t('deleteConfirm'))) return;
    $('qGo').disabled=true; $('qGo').textContent=t('processing'); clearMsg();
    try{
      const r=await SB.rpc('delete_my_account');
      if(r.error) throw r.error;
      await SB.auth.signOut();
      $('root').innerHTML='<div class="me"><div class="av">👋</div>'
        +'<div class="em">'+t('deleteComplete')+'</div>'
        +'<div class="hint" style="margin-top:10px">'+t('deleteThanks')+'</div></div>'
        +'<div class="links"><a href="'+esc(LoginLocale.calculatorUrl())+'">🧮 '+t('calculatorBack')+'</a></div>';
    }catch(e){
      $('qGo').disabled=false; $('qGo').textContent=t('deleteAction');
      const m=(e&&e.message)||'';
      if(/delete_my_account|does not exist|Could not find the function/i.test(m))
        say('e',t('deleteServerMissing'));
      else
        say('e',LoginLocale.html('deleteFailed',{error:LoginLocale.friendly(e)}));
    }
  };
}

async function doGoogle(){
  clearMsg();
  const r=await SB.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href.split('#')[0]}});
  if(r.error) say('e',err(r.error));
}
function validEmail(v){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v); }

async function doLogin(){
  const em=$('email').value.trim(), pw=$('pw').value; clearMsg();
  if(!validEmail(em)) return say('e',t('emailCheck'));
  if(!pw) return say('e',t('passwordRequired'));
  $('go').disabled=true; $('go').textContent=t('loginWorking');
  const r=await SB.auth.signInWithPassword(capOpts({email:em,password:pw}));
  if(r.error) capReset();
  $('go').disabled=false; $('go').textContent=t('loginAction');
  if(r.error) return say('e',err(r.error));
  await flushPendingConsent(); await claim();
  if(await mustChangePw()) return renderNewPw(true);
  if(await hasConsent()) finishLogin(r.data.user); else renderConsentGate(r.data.user);
}

/* 비밀번호 규칙: 8자 이상 + 특수문자 1개 이상.
   여기 검사는 안내용입니다. 화면 검사는 우회할 수 있으므로 실제 강제는
   Supabase 대시보드에서 같이 걸어야 합니다:
   Authentication → Providers → Email → Minimum password length = 8,
   Required characters = 특수문자 포함 조합. 한쪽만 바꾸면 안내와 실제
   기준이 어긋나 사용자가 영문 오류를 그대로 보게 됩니다. */
function pwProblem(pw){
  if(pw.length<8) return t('passwordTooShort');
  if(!/[^A-Za-z0-9]/.test(pw)) return t('passwordSpecial');
  return null;
}

function signupPaused(){
  MODE='login';
  render();
  return say('e',t('signupPaused'));
}

async function doSignup(){
  if (!SIGNUPS_ENABLED) return signupPaused();
  const em=$('email').value.trim(), pw=$('pw').value, pw2=$('pw2').value; clearMsg();
  const c=consentValues();
  if(!validEmail(em)) return say('e',t('emailCheck'));
  { const p=pwProblem(pw); if(p) return say('e',p); }
  if(pw!==pw2) return say('e',t('passwordMismatch'));
  if(!(c.terms&&c.privacy&&c.age)) return say('e',t('consentRequired'));
  /* 닉네임은 가입 시 필수입니다. 계정 화면에서 비우고 저장하는 것은 반대로
     허용인데, 그때는 서버가 새로 지어 줍니다. 여기서 통과시키면 이름 없는
     계정이 생기고, 공개 카드에 'undefined' 가 찍힙니다. */
  if(!c.nickname) return say('e',t('nickNeeded'));
  { const p=joinProblem(c); if(p) return say('e',p); }
  if(c.sms&&!c.phone) return say('e',t('phoneRequired'));
  $('go').disabled=true; $('go').textContent=t('signupWorking');
  const r=await SB.auth.signUp(capOpts({email:em,password:pw,options:{emailRedirectTo:location.href.split('#')[0]}}));
  if(r.error) capReset();
  $('go').disabled=false; $('go').textContent=t('signupAction');
  if(r.error) return say('e',err(r.error));
  if(r.data.session){ await saveConsent(c); await claim(); return finishLogin(r.data.user); }
  try{ sessionStorage.setItem('leoConsent', JSON.stringify(c)); }catch(e){}
  say('o',t('signupMailSent'));
}
// 구글 가입: 동의 먼저 받고 진행
async function doGoogleSignup(){
  if (!SIGNUPS_ENABLED) return signupPaused();
  const c=consentValues(); clearMsg();
  if(!(c.terms&&c.privacy&&c.age)) return say('e',t('consentRequired'));
  if(!c.nickname) return say('e',t('nickNeeded'));
  { const p=joinProblem(c); if(p) return say('e',p); }
  try{ sessionStorage.setItem('leoConsent', JSON.stringify(c)); }catch(e){}
  doGoogle();
}

// 기기에 있던 코드·데이터를 계정으로 이관
async function flushPendingConsent(){
  try{ const raw=sessionStorage.getItem('leoConsent'); if(!raw) return;
    const c=JSON.parse(raw); const r=await saveConsent(c);
    if(!r.error) sessionStorage.removeItem('leoConsent');
  }catch(e){}
}
async function claim(){
  try{ const s=await SB.auth.getSession(); const u=s.data.session&&s.data.session.user;
    if(u) await SB.rpc('claim_device',{p_device:devId(), p_user:'u_'+u.id});
  }catch(e){}
}

if(SB) SB.auth.onAuthStateChange(async (ev,sess)=>{
  if(ev==='SIGNED_IN' && sess){ await flushPendingConsent(); await claim();
    if(await hasConsent()) finishLogin(sess.user); else renderConsentGate(sess.user); }
  if(ev==='PASSWORD_RECOVERY'){ MODE='newpw'; render(); }
});
boot();
</script>
